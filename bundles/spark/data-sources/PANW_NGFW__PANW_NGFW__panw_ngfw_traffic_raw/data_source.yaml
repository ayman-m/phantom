schema_version: 1
id: panw_ngfw_traffic_raw
pack_name: PANW_NGFW
rule_name: PANW_NGFW
dataset_name: panw_ngfw_traffic_raw
vendor: Palo Alto Networks
product: NGFW Traffic
description: Palo Alto Networks Next-Generation Firewall — session traffic logs (flow start/end/drop/deny
  with bytes/packets accounting).
categories:
- Network Security
- Firewall
version: 1.0.0
origin: bundle
author: phantom-maintainer (PANW NGFW hand-curated)
formats:
- CEF
- SYSLOG
is_rawlog_only: false
fields:
- name: action
  type: string
  description: 'Action taken by the firewall on the session/packet. Common values: allow, deny, drop,
    reset-client, reset-server, reset-both, block-url, block-continue, continue, override.'
  example: allow
- name: app
  type: string
  description: 'Application identified by App-ID (PANW''s content classification engine). Examples: web-browsing,
    ssl, ssh, smtp, dns, ms-rdp, microsoft-teams.'
  example: web-browsing
- name: app_category
  type: string
  description: 'High-level application category (App-ID tier 1). Examples: general-internet, business-systems,
    networking, collaboration, media.'
  example: general-internet
- name: app_sub_category
  type: string
  description: 'App-ID tier 2 subcategory. Examples: internet-utility, file-sharing, encrypted-tunnel,
    ip-protocol.'
  example: internet-utility
- name: bytes_received
  type: integer
  description: Total bytes received from server → client during the session. Maps to `xdm.target.sent_bytes`.
  example: '16384'
- name: bytes_sent
  type: integer
  description: Total bytes sent from client → server. Maps to `xdm.source.sent_bytes`.
  example: '4096'
- name: dest_device_category
  type: string
  description: 'Device category of the destination host (when PANW Device-ID identifies it). Examples:
    server, mobile, iot, router, switch.'
  example: server
- name: dest_device_host
  type: string
  description: Hostname of the destination host as resolved by PANW Device-ID. Used for `xdm.target.host.hostname`
    only if it doesn't contain ':' (which would suggest a MAC).
  example: dst-host.corp.example.com
- name: dest_device_mac
  type: mac
  description: MAC address of the destination host (Device-ID). Six colon-separated hex octets.
  example: 00:50:56:aa:bb:02
- name: dest_device_model
  type: string
  description: 'Device model string from PANW Device-ID inventory. Examples: VMware ESXi, MacBookPro18,3,
    iPhone13,4.'
  example: Dell PowerEdge R740
- name: dest_device_os
  type: string
  description: Operating system of the destination host (Device-ID). Free-form, vendor-supplied.
  example: Ubuntu 22.04
- name: dest_device_osfamily
  type: string
  description: 'OS family of destination host. Drives `xdm.target.host.os_family` enum: Windows, MacOS/Mac,
    ios/iOS, Chromeos, Linux, Android.'
  example: Linux
- name: dest_device_vendor
  type: string
  description: 'Hardware vendor of the destination host (Device-ID). Examples: Dell, Apple, Cisco, HP.'
  example: Dell Inc.
- name: dest_ip
  type: ipv4
  description: Destination IP address — IPv4 or IPv6. The MR detects IPv6 by the presence of ':' and routes
    to `xdm.target.ipv6` accordingly. Sentinel value `00000000000000000000ffff00000000` is treated as
    empty.
  example: 10.20.30.40
- name: dest_port
  type: integer
  description: Destination TCP/UDP port (1-65535). Cast to integer in the MR; non-numeric values become
    null.
  example: '443'
- name: dest_user
  type: string
  description: 'Destination user as identified by PANW User-ID (LDAP/AD/RADIUS lookup on dest_ip). Examples:
    corp\\jdoe, jdoe@example.com.'
  example: corp\\bob
- name: from_zone
  type: string
  description: 'Source security zone (the firewall zone the session originated from). Examples: trust,
    untrust, dmz, internal, guest.'
  example: trust
- name: inbound_if
  type: string
  description: 'Inbound interface name (the firewall interface that received the session). Examples: ethernet1/1,
    ae1.100, tunnel.5.'
  example: ethernet1/1
- name: is_nat
  type: string
  description: 'Whether source/dest NAT was applied to the session. Cast to boolean. Values: ''true'',
    ''false'', ''True'', ''False''.'
  example: 'false'
- name: is_proxy
  type: string
  description: Whether the firewall proxied the session (e.g. SSL decrypt, explicit proxy). Cast to boolean.
    When true, `xdm.intermediate.ipv4/ipv6/port` get populated from dest_ip/dest_port.
  example: 'false'
- name: log_source
  type: string
  description: Log source type identifier (PANW's Cortex Cloud Identity Engine value or similar). Maps
    to `xdm.observer.type`.
  example: panw-ngfw
- name: log_source_id
  type: string
  description: Unique identifier of the log source instance (serial number or UUID of the firewall emitting
    the log).
  example: 001801000001
- name: log_source_name
  type: string
  description: Friendly name of the log source (firewall hostname or assigned name).
  example: pa-fw-hq-01
- name: log_type
  type: string
  description: 'PANW log subsystem that produced this event. Drives `xdm.event.type`. Common values: traffic,
    threat, url, file, hipmatch, globalprotect, system, config.'
  example: traffic
- name: outbound_if
  type: string
  description: 'Outbound interface name (the firewall interface forwarding the session). Examples: ethernet1/2,
    ae2.200.'
  example: ethernet1/2
- name: packets_received
  type: integer
  description: Packet count received (server → client). Maps to `xdm.target.sent_packets`.
  example: '42'
- name: packets_sent
  type: integer
  description: Packet count sent (client → server). Maps to `xdm.source.sent_packets`.
  example: '28'
- name: protocol
  type: string
  description: IP protocol — lowercase string. The MR maps icmp/tcp/udp to XDM enums; other values pass
    through as-is.
  example: tcp
- name: rt
  type: string
  example: '1788700000000'
  description: Event time as a CEF epoch integer (10/13/16/19 digits). The broker honours the CEF `rt`
    extension as `_time` during generic extraction, with NO parsing rule involved — so this is the back-dating
    handle for this source even on the derived route. Omit it and `_time` falls back to ingestion time.
- name: rule_matched
  type: string
  description: Name of the security policy rule that matched this session. Maps to `xdm.network.rule`.
  example: Allow-Web-Browsing
- name: session_id
  type: string
  description: Unique session identifier (PANW's session number for this flow). Maps to `xdm.event.id`
    AND `xdm.session_context_id` in the standalone RULE.
  example: '1234567'
- name: source_device_category
  type: string
  description: 'Device category of the source host (Device-ID). Examples: workstation, mobile, iot, server.'
  example: workstation
- name: source_device_host
  type: string
  description: Hostname of the source host (Device-ID). Used for `xdm.source.host.hostname` only if it
    doesn't contain ':' (which would suggest a MAC).
  example: src-host.corp.example.com
- name: source_device_mac
  type: mac
  description: MAC address of the source host (Device-ID).
  example: 00:50:56:aa:bb:01
- name: source_device_model
  type: string
  description: Device model of the source host (Device-ID).
  example: MacBookPro18,3
- name: source_device_os
  type: string
  description: OS of the source host (Device-ID).
  example: macOS 14.0
- name: source_device_osfamily
  type: string
  description: OS family of source host. Drives `xdm.source.host.os_family` enum.
  example: MacOS
- name: source_device_vendor
  type: string
  description: Hardware vendor of the source host (Device-ID).
  example: Apple Inc.
- name: source_ip
  type: ipv4
  description: Source IP address — IPv4 or IPv6. IPv6 detected by ':'.
  example: 10.1.2.3
- name: source_port
  type: integer
  description: Source TCP/UDP port.
  example: '54321'
- name: source_user
  type: string
  description: Source user (PANW User-ID).
  example: corp\\alice
- name: sub_type
  type: string
  description: 'Log subtype — discriminator within a log_type. For traffic: start, end, drop, deny. For
    threat: vulnerability, virus, spyware, wildfire-virus, file. For url: url. Maps to `xdm.event.operation_sub_type`.'
  example: end
- name: to_zone
  type: string
  description: Destination security zone.
  example: untrust
- name: total_time_elapsed
  type: integer
  description: Session duration in SECONDS (vendor-emitted unit). MR multiplies by 1000 to produce `xdm.event.duration`
    in milliseconds.
  example: '60'
validated: true
use_cases:
- Firewall traffic & threat analysis
- Network security monitoring
- Threat hunting
how_to_use: "Palo Alto Networks NGFW Traffic logs. Simulate with type=CEF to your XSIAM Broker (UDP syslog).\n\
  \nRouting: Cortex ingests PAN-OS NGFW logs NATIVELY — the parsing and modeling for\nthe `panw_ngfw_*_raw`\
  \ datasets are built into the platform, NOT shipped by an\ninstallable content pack. The Cortex Marketplace\
  \ \"PAN-OS by Palo Alto Networks\"\npack is an XSOAR automation pack (integration, classifier, mapper,\
  \ playbooks) that\nmanages firewalls over the API; it ships no parsing or modeling rules, and\ninstalling\
  \ it does NOT create these datasets.\n\n**PAN CAN be back-dated — send a CEF `rt`.** A\n  probe carrying `rt=1787195628621` lands with `_time=1787195628000`, exactly the value\n  sent, even 18 days in the past. `_time` does not have to come from a parsing rule: the\n  broker honours the CEF `rt` extension during GENERIC extraction, so the derived route\n  bypassing the pack's\
  \ parsing rule costs nothing here. `rt` also does not need to be a\n  column the modeling rule reads\
  \ — it is consumed at ingestion.\n\n  Send `rt` as an epoch integer (10/13/16/19 digits). An ISO-8601\
  \ string is NOT honoured.\n  This makes PAN's 44 detectors reachable without waiting out their activation\
  \ windows.\n\n**Activation 14 days and Training 30 days are reachable via `rt`.** The `rt` lever above\
  \ works here exactly as `FTNTFGTeventtime` does on FortiGate: bursts whose `rt` values are spread\
  \ across the past 30 days accrue the detectors' training history in minutes instead of wall-clock\
  \ weeks. What `rt` does NOT compress is DEDUPLICATION — a fired detector stays quiet for its\
  \ documented dedup period in wall-clock time regardless of the timestamps sent.\n\nPractical consequence:\
  \ do both — seed back-dated history with `rt` bursts to clear activation/training, AND keep a\
  \ low-rate sustained feed running so day-over-day baselines exist. A worker\nat 1 event / 30s reaches the\
  \ 50,000-event per-run ceiling after ~17 days.\n\nRequired CEF header for XSIAM:\n- vendor: `panw`\n- product:\
  \ `ngfw_traffic`\n\nThat pair derives the target dataset directly (`<lower(vendor)>_<lower(product)>_raw`\n\
  = `panw_ngfw_traffic_raw`), which is the dataset this modeling rule binds to. Modeling rules\nbind by\
  \ dataset NAME only, so the derived route reaches the rule without any\nparsing rule being consulted\
  \ — the same mechanism documented for `microsoft`/`adfs`.\n\nDo NOT send `product=ngfw_cef`. That pair\
  \ is claimed by an INGEST block targeting\nthe catch-all `panw_ngfw_cef_raw` with `no_hit=drop`: no\
  \ modeling rule binds there,\nand non-matching events are silently DISCARDED. There is no mechanism\
  \ that reads the\n`log_type` extension to fan one CEF stream out into the six per-log-type datasets\
  \ —\nINGEST blocks route, MODEL blocks only bind to a dataset that already exists.\n\nValidated: a worker sent with CEF header vendor=`panw`,\nproduct=`ngfw_traffic` creates `panw_ngfw_traffic_raw` (even when the dataset did not exist before) and\nthe native modeling rule binds to it immediately: 30 raw rows -> **38 xdm fields modeled**.\nThe derived route works as reasoned\
  \ — no INGEST block claims panw/ngfw_traffic, the\nbroker derives `<lower(vendor)>_<lower(product)>_raw`,\
  \ and modeling rules bind by dataset\nNAME only, so the pack's own parsing rule is never consulted and\
  \ its no_hit=drop never fires.\nNo content pack install is required: Cortex parses PAN-OS natively.\n\
  \n\n**This feed drives live Analytics/BIOC detectors, not just XDM mapping.** A single source host scanning ~20-24 distinct destination ports on one target fires **Suspicious port scan** (`XDR_ANALYTICS`). The alert arrives 3.5-12 minutes after the burst, and the same source host is deduplicated for 1 day. Route as vendor `panw`, product `ngfw_traffic`. The exact `phantom_create_data_worker` call is in the `trigger_port_scan_analytics` skill. A real domain controller (as classified by the tenant) initiating SMB (port 445) to a workstation fires **Suspicious SMB connection from domain controller** (`XDR_ANALYTICS_BIOC`). That rule has a documented 7-day deduplication period per source. See `trigger_network_analytics_alerts`.\n\
  \n\n**Send the keys the modeling rule reads, or most detectors see nothing.** The thin 9-field schema (action, app, dest_ip, dest_port, protocol, source_device_host, source_ip, source_port, source_user) leaves `xdm.event.outcome`, `xdm.event.type`, `xdm.event.duration` and both byte counters empty on every row, because the rule sets outcome only when `sub_type` is `deny` or `drop`, takes `xdm.event.type` from `log_type`, the byte counters from `bytes_sent` and `bytes_received`, and `xdm.event.duration` from `total_time_elapsed` (seconds, multiplied by 1000). Add `log_type` (`TRAFFIC`), `sub_type` (`start`, `end`, `deny` or `drop`), `bytes_sent`, `bytes_received`, `packets_sent`, `packets_received`, `total_time_elapsed`, `session_id`, `rule_matched`, `from_zone` and `to_zone` to the schema_override (about 20 fields stay far under the 4 KB syslog limit). With these keys a 30-event burst populates type, sub_type, duration, both byte counters, packets, event id, rule and both zones on all 30 rows, and `xdm.event.outcome` is FAILED for exactly the `deny` and `drop` rows. With those keys in place, 120 denied zero-byte connections from one host to 40 never-seen internal hosts fire **Failed Connections** (`XDR_ANALYTICS`, T1018, text: tried to connect to 37 hosts in the last 24 hours) about 5 minutes later (it does not fire with the thin schema), and three **Uncommon SSH session** variants fire from SSH events (`app` ssh) on a host that had SSH traffic on earlier days. **The source must be an established host**: a host with ordinary traffic history on the tenant fires, while a fresh address does not fire even after 20 days of back-dated traffic is added (Large Upload fires from a fresh address, so it does not need this). A repeat on a host with no SSH history does not fire; give the host back-dated SSH history first (see `trigger_uncommon_ssh_alert`). `observables_dict` draws every field independently per event, so values that must go together (an app with its port, `sub_type` deny with zero bytes, a long `total_time_elapsed` with a large `bytes_sent`) need single-value lists or a separate burst for each shape. Send to the operator's log destination object (`logdest:<id>`, which resolves to the broker's CEF port 5514), not to `udp:<ip>:514`.\n\
  \nThe sibling routes (ngfw_url, ngfw_threat, ngfw_filedata, ngfw_globalprotect, ngfw_hipmatch)\nfollow\
  \ the same derivation and are expected to behave identically, but only ngfw_traffic has\nbeen validated end to end.\n\
  \n\n**EAL / DNS-enriched traffic is NOT craftable via CEF.** CEF `product=ngfw_eal` lands raw in `panw_ngfw_eal_raw` but NO modeling rule binds that dataset\
  \ — zero XDM rows. EAL is not a separate dataset in real deployments: it enriches TRAFFIC logs with\
  \ `dns_query_name`, `dns_query_type`, `dns_reply_code`, `dns_resolutions`. Those four fields are accepted\
  \ on this route and land raw, but the traffic modeling rule does not map them to XDM, and `network_story`\
  \ stitching leaves them null for injected events (stitching builds from XDM). Real EAL arrives via\
  \ Strata Logging Service direct NGFW integration, not broker CEF. Consequence: **DNS Tunneling** and\
  \ **Random-Looking Domain Names** cannot be triggered through CEF/syslog injection — bursts (250 TXT queries, ~13 KB in <10 min on one domain; 300 DGA domains, mostly NXDomain) land cleanly and produce no alert. The only path to those detectors is real XDR-agent telemetry.\n\
  \n**How simulation works — read this before generating.** `phantom_create_data_worker`\nresolves each\
  \ field's value in this order:\n\n  1. `observables_dict[field]` — explicit; always wins. Values are\
  \ LISTS.\n  2. `is_gate` + `example` — gate fields are auto-pinned to their example.\n  3. declared\
  \ `type` — ipv4/user/url/datetime are synthesized plausibly.\n  4. field-name heuristic.\n  5. random\
  \ token.\n\n**A field's `example` below is DOCUMENTATION ONLY unless that field is marked\n`is_gate`.**\
  \ So every field the modeling rule reads expecting a specific SHAPE --\nan enum, an HTTP method, a status\
  \ code, a resource path, a numeric type code, an\nXML or JSON blob -- MUST be passed in `observables_dict`,\
  \ with keys spelled\nexactly as `fields[]` spells them (dotted leaves included, e.g.\n`event_data.param2`).\
  \ Anything you leave out is randomly generated, and the rule\nwill map it to garbage or drop the event."
