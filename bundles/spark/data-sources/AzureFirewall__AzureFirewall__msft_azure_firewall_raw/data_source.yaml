schema_version: 1
id: AzureFirewall
pack_name: AzureFirewall
rule_name: AzureFirewall
dataset_name: msft_azure_firewall_raw
vendor: Microsoft
product: AzureFirewall
description: Azure Firewall is a cloud-native and intelligent network firewall security
  service that provides breed threat protection for cloud workloads running in Azure.
  It's a fully stateful firewall as a service, with built-in high availability and
  unrestricted cloud scalability. This pack contains an integration with a main goal
  to manage Azure Firewall security service, and normalization rules for ingesting
  and modeling Azure Firewall Resource logs.
