how_to_use: |
  ## msft Azure Firewall → Cortex XSIAM (dataset `msft_azure_firewall_raw`)

  **Validated** — maps **20 xdm fields** end-to-end
  via CEF-over-syslog on a tenant with the **Azure Firewall** content pack installed
  (the pack binds the modeling rule + parsing rule to the dataset).

  Required CEF header — the broker derives the dataset from it (lowercased):
  - vendor: `msft`
  - product: `Azure_Firewall`
  Broker derives -> `msft_azure_firewall_raw`.
  Modeling-rule gate: seed `category in ("AZFWApplicationRule", "AZFWNetworkRule", "AZFWDnsQuery", ...)` (the AZFWApplicationRule branch is verified).

  JSON-native MR: it reads nested JSON via `json_extract_scalar(...)`/`->`. The
  worker emits composite schema fields as JSON strings on the CEF wire, which the
  rule parses — so CEF-over-syslog populates these fields (no HTTP collector).

  Verify (wide >=7d window):
      config timeframe = 30d | datamodel dataset = msft_azure_firewall_raw | sort desc _time | fields xdm.* | limit 20

  **Simulation recipe — reverse-engineered from this pack's parsing + modeling rules.**

  Routing: vendor `msft` / product `azure`.
  Discriminator: category — must start with the literal prefix `AZFW` (recipe pins `AZFWApplicationRule`)
  (Taken VERBATIM from the pack's parsing rule: `[INGEST:vendor="msft", product="azure", target_dataset="msft_azure_firewall_raw", no_hit = drop]` in scripts/maintainer/parsing_rules/AzureFirewall__AzureFirewall.xif. NOT derived — note that broker derivation of msft/azure would yield `msft_azure_raw`, so the INGEST block's explicit target_dataset is doing the routing here, and the `category = "AZFW*"` filter is what selects THIS dataset out of the four packs sharing this vendor/product pair. IMPORTANT ALTERNATIVE: the schema's own how_to_use records an empirically validated (20 xdm fields) route using vendor=`msft`, product=`Azure_Firewall`, which no INGEST block claims and which therefore lands by pure broker derivation (msft + azure_firewall -> msft_azure_firewall_raw), bypassing the parsing rule entirely. Both reach the same dataset and the same modeling rule (modeling rules bind on dataset NAME only). See notes for the trade-off between the two.)

  Gate: `category` must be one of `AZFWApplicationRule`, `AZFWApplicationRuleAggregation`, `AZFWNetworkRule`, `AZFWNetworkRuleAggregation`, `AZFWNatRule`, `AZFWNatRuleAggregation`, `AZFWDnsQuery`, `AZFWIdpsSignature`, `AZFWThreatIntel`, `AZFWFatFlow`, `AZFWFlowTrace`, `AZFWFqdnResolveFailure`, `AZFWInternalFqdnResolutionFailure`.
  no_hit: drop — the parsing rule's INGEST block is `no_hit = drop`, so on the msft/azure route any event whose `category` does not match `AZFW*` is discarded at ingest with NO raw row and no error anywhere. On the derived msft/Azure_Firewall route no parsing rule applies, so a wrong category still lands raw but simply maps zero xdm fields (no MODEL branch matches).

  Composite: `properties` must be a JSON OBJECT on the wire. Leaves read: `properties.Action`, `properties.ActionReason`, `properties.Protocol`, `properties.IsExplicitProxyRequest`, `properties.Fqdn`, `properties.TargetUrl`, `properties.WebCategory`, `properties.SourceIp`, `properties.SourcePort`, `properties.DestinationPort`, `properties.Policy`, `properties.RuleCollectionGroup`

  Pass this verbatim as `observables_dict` (keys are schema field names; values are LISTS):

  ```json
  {
    "category": [
      "AZFWApplicationRule"
    ],
    "resourceId": [
      "/SUBSCRIPTIONS/8A5B7D2C-1F3E-4A9B-9C0D-2E4F6A8B1C3D/RESOURCEGROUPS/RG-NETWORK-PROD/PROVIDERS/MICROSOFT.NETWORK/AZUREFIREWALLS/AZFW-HUB-EASTUS"
    ],
    "properties.Action": [
      "Allow"
    ],
    "properties.ActionReason": [
      "ApplicationRule"
    ],
    "properties.Protocol": [
      "HTTPS"
    ],
    "properties.IsExplicitProxyRequest": [
      "true"
    ],
    "properties.Fqdn": [
      "www.contoso.com"
    ],
    "properties.TargetUrl": [
      "https://www.contoso.com/index.html"
    ],
    "properties.WebCategory": [
      "NEWS"
    ],
    "properties.SourceIp": [
      "203.0.113.45"
    ],
    "properties.SourcePort": [
      "51514"
    ],
    "properties.DestinationIp": [
      "203.0.113.200"
    ],
    "properties.DestinationPort": [
      "443"
    ],
    "properties.Policy": [
      "AzFwPolicy-Prod"
    ],
    "properties.RuleCollectionGroup": [
      "DefaultApplicationRuleCollectionGroup"
    ],
    "properties.RuleCollection": [
      "AllowWebTraffic"
    ],
    "properties.Rule": [
      "Allow-Contoso-HTTPS"
    ]
  }
  ```

  Populates: `xdm.event.original_event_type`, `xdm.event.type`, `xdm.event.outcome`, `xdm.event.outcome_reason`, `xdm.observer.action`, `xdm.observer.name`, `xdm.observer.type`, `xdm.observer.unique_identifier`, `xdm.source.cloud.provider`, `xdm.target.resource.id`, `xdm.network.rule`, `xdm.source.ipv4`, `xdm.source.host.ipv4_public_addresses`, `xdm.source.port`, `xdm.intermediate.is_proxy`, `xdm.network.application_protocol`, `xdm.network.http.url`, `xdm.network.http.url_category`, `xdm.target.host.fqdn`, `xdm.target.port`, `xdm.target.url`

  - COMPOSITE, not flat. Every mapped value except `category` and `resourceId` is read as `properties -> X`, i.e. inside a JSON OBJECT. `properties` must arrive as nested JSON; the dotted-leaf field names (`properties.Action`, ...) are what the generator folds into that object. A CEF extension literally named `properties.Action` would produce a flat column of that name and the rule would read nothing. The schema declares `properties` (type json) plus 36 dotted leaves, so the shape is already correct — just do NOT put the bare key `properties` in observables_dict, or it will clobber the folded object with the literal string `{}`.
  - ROUTING TRADE-OFF, read before choosing. The msft/azure INGEST route (used above) is the pack's canonical path: it applies `filter category = "AZFW*"` with `no_hit = drop`, and it also parses `_time` from a `time` column. The msft/Azure_Firewall derived route recorded in the schema's how_to_use (and empirically validated at 20 xdm fields) is claimed by no INGEST block, so it lands by broker derivation, no parsing rule runs, nothing can be dropped, and `_time` falls back to `_insert_time`. Both reach msft_azure_firewall_raw and the same modeling rule. Prefer msft/azure when the AzureFirewall content pack is definitely installed (it must be, or there is no modeling rule at all); the derived pair is the more forgiving of the two because a mis-cased category cannot silently vanish.
  - SHARED VENDOR/PRODUCT PAIR — four packs claim msft/azure and are separated only by their INGEST filters: AzureFirewall (`category = "AZFW*"`), AzureKubernetesServices -> msft_azure_aks_raw (`category in ("cloud-controller-manager", "cluster-autoscaler", "kube-audit", ...)`), AzureDevOps -> msft_azure_devops_raw (`Type = "AzureDevOpsAuditing"` AND an RFC3339 `TimeGenerated`), and MicrosoftEntraID -> msft_azure_raw, whose filter is `category not in("AZFW*", ...)`. The Entra block's explicit AZFW* exclusion confirms `category` starting with AZFW is the intended discriminator. A category outside AZFW* on this pair therefore does not merely fail to map — it silently routes into a SIBLING dataset (msft_azure_raw) instead.
  - CASE SENSITIVITY IS SPLIT. `properties.Action` is compared raw against "Allow"/"Deny"/"Drop" — case-sensitive, and the schema's own example (`allow`) fails it, nulling xdm.event.outcome. By contrast `properties.Protocol` and `properties.WebCategory` are wrapped in uppercase() before comparison, so lowercase input is safe for those two. `category` is compared raw and is case-sensitive.
  - PUBLIC-IP GUARD. Every `*.host.ipv4_public_addresses` assignment is wrapped in six `not incidr(...)` tests (10/8, 172.16/12, 192.168/16, 127/8, 169.254/16, 100.64/10). Seed SourceIp / DestinationIp / ServerIp / TranslatedIp from documentation-public ranges (192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24) or those array fields stay null while the plain xdm.source.ipv4 / xdm.target.ipv4 still populate. All the IP regextracts are anchored `^...$`, so no port suffix, brackets, or surrounding whitespace.
  - BRANCH SWAPS — one event can satisfy exactly one branch, since every branch leads with a `category` filter. To retarget the recipe, change `category` and add these leaves: AZFWNetworkRule -> properties.Protocol="TCP" (drives xdm.network.ip_protocol via map_ip_protocol), properties.DestinationIp public, properties.DestinationPort; AZFWDnsQuery -> properties.QueryName="www.contoso.com", properties.QueryType="A", properties.QueryClass="IN" (only IN/CS/CH/HS map, to 1/2/3/4), properties.ResponseCode="NOERROR" (fixed vocabulary NOERROR/FORMERR/SERVFAIL/NXDOMAIN/... else the raw string passes through), properties.ResponseFlags="AA,RD,RA" (uppercased then split on comma; array_any looks for "AA" and "TC"), properties.QueryId="34921", properties.RequestSize="76", properties.ResponseSize="92", properties.RequestDurationSecs="0.05" (to_number then multiply by 1000 — MUST be numeric; the schema example `sample_requestdurations` nulls xdm.event.duration), properties.ErrorMessage=""; AZFWIdpsSignature -> properties.SignatureId="2032871", properties.Description="ET MALWARE Observed DNS Query to .biz TLD", properties.Severity="2", properties.Category="Malware Command and Control"; AZFWThreatIntel -> properties.ThreatDescription + properties.TargetUrl + properties.Fqdn; AZFWNatRule -> properties.TranslatedIp="10.0.1.4" and properties.TranslatedPort="8080"; AZFWFlowTrace -> properties.Flag="SYN-ACK" (the rule tests `flag ~= "\-ACK"` for OUTCOME_SUCCESS and `flag = "INVALID"` for OUTCOME_FAILED — the hyphen is load-bearing); AZFWFqdnResolveFailure / AZFWInternalFqdnResolutionFailure -> properties.Error non-empty, properties.ServerIp public IPv4, properties.ServerPort="53", properties.Fqdn.
  - SCHEMA NOISE — do not seed. Roughly 40 of the flat fields[] entries (`action`, `Allow`, `Microsoft`, `Network`, `azureFirewalls`, `source_ipv4`, `source_ipv6`, `destination_ipv4`, `destination_ipv6`, `dns_server_ipv4`, `dns_query_class`, `dns_query_type`, `dns_response_code`, `dns_response_flags`, `error_msg`, `flag`, `ip_protocol`, `is_explicit_proxy_request`, `target_fqdn`, `target_url`, `target_ipv4`, `target_ipv6`, `translated_destination_ipv4`, `translated_destination_ipv6`, `web_category`, `application_protocol`, `ActionReason`, `Category`, `Description`, `DestinationPort`, `Error`, `Fqdn`, `QueryId`, `QueryName`, `RequestDurationSecs`, `RequestSize`, `ResponseSize`, `ServerIp`, `ServerPort`, `Severity`, `SignatureId`, `SourcePort`, `ThreatDescription`, `TranslatedPort`) are NOT wire fields. They are the modeling rule's intermediate `alter` variables plus tokens split out of the XDM constant string "Microsoft.Network/azureFirewalls" and the literals "Allow"/"Microsoft", hoovered up by the schema extractor. Every one of them is unconditionally reassigned by an `alter` before it is read, so seeding them changes no xdm output and only adds junk columns to the raw row.
  - `properties.ServerIp` is declared type ipv6 in the schema while the rule regextracts BOTH an IPv4 and an IPv6 form from it. Left to the type synthesizer it produces an IPv6, so the FqdnResolveFailure branch would populate xdm.intermediate.ipv6 but leave dns_server_ipv4, xdm.intermediate.ipv4 and xdm.intermediate.host.ipv4_public_addresses null. Pass an IPv4 explicitly if you want the v4 side.
  - `xdm.observer.type` ("Microsoft.Network/azureFirewalls") and `xdm.source.cloud.provider` (XDM_CONST.CLOUD_PROVIDER_AZURE) are hard-coded constants in [RULE: map_common_event_fields] — they populate for every branch with no input required.
  - The Application Rule branch calls map_source_peer_common_fields but NOT map_target_peer_common_fields and NOT map_ip_protocol, so on this recipe xdm.target.ipv4/ipv6 and xdm.network.ip_protocol stay null by design; xdm.target.port comes straight from properties.DestinationPort.

  **How simulation works — read this before generating.** `phantom_create_data_worker`
  resolves each field's value in this order:

    1. `observables_dict[field]` — explicit; always wins. Values are LISTS.
    2. `is_gate` + `example` — gate fields are auto-pinned to their example.
    3. declared `type` — ipv4/user/url/datetime are synthesized plausibly.
    4. field-name heuristic.
    5. random token.

  **A field's `example` below is DOCUMENTATION ONLY unless that field is marked
  `is_gate`.** So every field the modeling rule reads expecting a specific SHAPE --
  an enum, an HTTP method, a status code, a resource path, a numeric type code, an
  XML or JSON blob -- MUST be passed in `observables_dict`, with keys spelled
  exactly as `fields[]` spells them (dotted leaves included, e.g.
  `event_data.param2`). Anything you leave out is randomly generated, and the rule
  will map it to garbage or drop the event.