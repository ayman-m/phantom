- name: _raw_log
  type: string
  description: 'Native radware_appwall log line as the vendor emits it (no syslog frame -- the RAW sender prepends one). Branch: BRANCH CHOSEN: the AppWall WAF *attack* event (`AppWallAttackSysLogMessage`) — the only branch the modeling rule has. Both gates are satisfied: the parsing rule''s `_raw_log ~= "AppWallAttackSysLogMessage|SystemAttackSysL'
  example: "AppWallAttackSysLogMessage: appWallTimeStamp=\"{{now:%s}}482\" receivedTimeStamp=\"{{now:%s}}507\" eventId=\"a3f9c1d2-5b7e-4c8a-9f21-6d4e8b0a7c33\" transId=\"1705328581-482913776\" awVersion=\"8.6.1\" hostName=\"cwaf-eu-west-01\" hostIP=\"10.44.12.31\" ClusterManagerIp=\"10.44.12.10\" devType=\"CloudWAF\" tunnel=\"tunnel_www_example_com_443\" tunnelListenIP=\"10.44.12.31\" tunnelListenPort=\"443\" protocol=\"HTTPS\" host=\"www.example.com\" method=\"POST\" uri=\"/account/login.aspx\" directory=\"/account/\" sourceIp=\"203.0.113.45\" sourcePort=\"52344\" externalIp=\"203.0.113.45\" destinationIp=\"198.51.100.20\" destinationPort=\"443\" vhost=\"www.example.com\" webApp=\"Example Corporate Portal\" user=\"Public\" role=\"Public\" targetModule=\"Signatures\" title=\"SQL Injection\" violationCategory=\"Injections\" violationType=\"SQL Injection\" severity=\"High\" action=\"Block\" passive=\"false\" ruleId=\"80000178\" paramName=\"username\" paramType=\"Body URL Encoded\" paramValue=\"admin%27 OR 1%3D1--\" enrichmentContainer=\"applicationId=8f4b1c2e-3a5d-4f6b-9c8e-1d2a3b4c5d6e;tenant=a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d;applicationName=Example Corporate Portal;region=eu-west-1\" details=\"Web application attack detected by the Signatures security module. Rule ID: 80000178\nRule Name: SQL Injection - MSSQL comment sequence in parameter\nRule Description: A SQL comment sequence was found in a user supplied parameter value.\nHTTP Status code: 403\nEnforcement: Blocked and connection reset\n\" request=\"POST /account/login.aspx HTTP/1.1\nHost: www.example.com\nConnection: keep-alive\nContent-Length: 67\nCache-Control: max-age=0\nOrigin: https://www.example.com\nContent-Type: application/x-www-form-urlencoded\nUser-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Safari/537.36\nAccept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8\nReferer: https://www.example.com/account/login.aspx\nAccept