how_to_use: |
  ## Microsoft ADFS -> Cortex XSIAM (dataset `microsoft_adfs_raw`)

  Required CEF header for XSIAM:
  - vendor: `microsoft`
  - product: `adfs`

  **Why these literals and not `microsoft`/`windows`.** The MicrosoftADFS pack ships a
  parsing rule keyed `microsoft`/`windows` whose filter requires
  `_collector_type = "WEC"`, with `no_hit=drop`. `_collector_type` is ingestion metadata
  stamped by the collection mechanism -- it is `Syslog` on our path and cannot be set from
  the event body, and a CEF extension key of that name is shadowed rather than honoured.
  So the documented route is permanently closed to syslog/CEF, and no tenant-side parsing
  rule can reopen it, because INGEST sections are standalone and never chain.

  No INGEST block claims the pair `microsoft`/`adfs`, so the broker derives the dataset
  name directly as `microsoft_adfs_raw` -- the exact dataset the modeling rule binds to.
  The parsing rule is never consulted, and the modeling rule still applies because it
  binds by dataset NAME only. Its own gate is an OR:
  `to_string(event_id) in ("510","1200".."1207") OR _collector_type = "WEC"`, so seeding
  `event_id` satisfies it.

  Verified end to end on a live tenant: one CEF event with these literals landed in
  `microsoft_adfs_raw` and modeled `xdm.event.id` and `xdm.observer.type`.

  **Ingestion shape**: CEF over syslog. Extension keys survive as top-level columns, so
  send the vendor field names below verbatim as CEF extensions.

  **Fields that drive the mapping** (send as CEF extensions):
  - `event_id` -- REQUIRED, one of 510, 1200-1207. Satisfies the modeling gate and maps
    `xdm.event.id`.
  - `provider_name` -- `AD FS Auditing`. Maps `xdm.observer.type`.
  - `time_created` -- ISO-8601. `channel` -> `xdm.event.type`. `record_id` ->
    `xdm.session_context_id`. `event_result` (`success`/`failure`) -> `xdm.event.outcome`.
  - `log_level`, `process_pid`, `process_thread_id`, `activity_id`, `task`,
    `event_action`, `message` -> log level, process, alert id, original event type,
    description.
  - `user.name` / `user.domain` / `user.identifier` / `user.type` -> source user identity.

  **The richest fields come from an ADFS audit XML blob in `event_data.param2`.** The
  modeling rule requires it to start with `<?xml ` and then regex-extracts these tags:
  `<AuditType>`, `<UserId>`, `<MfaMethod>`, `<DeviceId>`, `<Server>`, `<AuthProtocol>`,
  `<IpAddress>`, `<ForwardedIpAddress>`, `<UserAgentString>`. Together these drive
  `xdm.source.user.upn`, `xdm.auth.auth_method`, `xdm.source.host.device_id`,
  `xdm.target.url`, `xdm.network.application_protocol`, `xdm.source.ipv4` and
  `xdm.source.user_agent`.

  **CRITICAL -- send ALL of `param2` through `param15`.** The modeling rule concatenates
  the whole range into one string before parsing it. Any missing param makes that
  concatenation null and silently poisons the rest of the rule -- you get `xdm.event.id`
  and little else, with no error anywhere. Unused params must be the literal `"-"`, which
  is the vendor convention the rule itself special-cases. Verified: with only `param2` set,
  9 XDM fields stayed null; with `param2` carrying the XML and `param3`-`param15` set to
  `"-"`, all of them populated.

  **Proven mapping** from one CEF event shaped this way:
  `xdm.source.user.upn`, `xdm.auth.auth_method`, `xdm.source.user.username`,
  `xdm.source.ipv4` (from ForwardedIpAddress), `xdm.intermediate.ipv4` (from IpAddress),
  `xdm.target.url`, `xdm.network.application_protocol`, `xdm.source.host.device_id`,
  `xdm.source.user_agent`, `xdm.event.operation_sub_type`, `xdm.event.id`,
  `xdm.event.type`, `xdm.event.outcome`, `xdm.observer.type`, `xdm.session_context_id`.

  **`event_data` and `user` must be JSON OBJECTS on the wire**, not flat dotted keys. The
  rule reads them with `json_extract_scalar(event_data, "$.param2")` and
  `json_extract_scalar(user, "$.name")`. A CEF extension literally named
  `event_data.param2=...` produces a flat column of that name and extracts nothing.
  Nested JSON survives CEF-over-syslog intact, including the XML payload.

  **Emit that blob WITHOUT an XML version attribute** -- use `<?xml ?>` rather than
  `<?xml version="1.0"?>`. A CEF extension value containing `=` risks being read as the
  start of a new key, and the rule only regex-matches tags, so the attribute is not needed.
  A `UserId` containing `@` maps `xdm.source.user.upn`; a `DOMAIN\user` form maps
  username plus domain instead.

  **Do NOT** set `_collector_type` -- it is stamped at ingest, cannot be seeded, and
  declaring it invites the agent to chase an unsatisfiable gate.

  **How simulation works — read this before generating.** `phantom_create_data_worker`
  resolves each field's value in this order:

    1. `observables_dict[field]` — explicit; always wins. Values are LISTS.
    2. `is_gate` + `example` — gate fields are auto-pinned to their example.
    3. declared `type` — ipv4/user/url/datetime are synthesized plausibly.
    4. field-name heuristic.
    5. random token.

  **A field's `example` below is DOCUMENTATION ONLY unless that field is marked
  `is_gate`.** So every field the modeling rule reads expecting a specific SHAPE --
  an enum, an HTTP method, a status code, a resource path, a numeric type code, an
  XML or JSON blob -- MUST be passed in `observables_dict`, with keys spelled
  exactly as `fields[]` spells them (dotted leaves included, e.g.
  `event_data.param2`). Anything you leave out is randomly generated, and the rule
  will map it to garbage or drop the event.

  ## Delivery over a real Windows Event Collector

  The `microsoft`/`adfs` syslog/CEF route above bypasses the pack's parsing rule. There is also a real
  route: send the event to the Broker VM's Windows Event Collector applet with the `wec-sender`
  connector. The applet stamps `_collector_type = WEC`, so the pack's own parsing rule matches and the
  event lands in `microsoft_adfs_raw` with no derived-route trick.

  Shape the applet accepts: provider `AD FS Auditing`, event ids 1200-1207 (or 510), with POSITIONAL
  (unnamed) `Data` nodes. The applet turns them into `event_data.param1..param15`, which is exactly what
  the modeling rule reads: put a GUID in the first node, the audit XML in the second and `-` in every
  other one. Expect 28 `xdm.*` fields populated, including `xdm.source.user.upn`,
  `xdm.auth.auth_method`, `xdm.source.ipv4`, `xdm.intermediate.ipv4`, `xdm.target.url`,
  `xdm.source.user_agent` and `xdm.event.outcome`.

  This is the sanctioned WEC exception to syslog/CEF delivery. It does not validate the CEF mapping
  described above.
