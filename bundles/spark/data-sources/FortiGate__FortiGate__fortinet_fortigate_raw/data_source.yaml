  ### 5. The placeholder-pool defect

  `dhost` and `shost` are declared `type: host`. Left unpinned the generator draws from a five-value
  pool, and on the live feed **host-a / host-b / host-c / server-1 / endpoint-7 account for ~3.37M
  rows against ~38k real hostnames** — a 50:1 contamination, and the direct cause of
  `xdm.target.host.fqdn = "host-a"`. Pin both, from DISJOINT pools, or an alert reads
  "ws-014 connected to ws-014".

  Same class: `externalId` feeds `xdm.network.session_id`. Random per event means no traffic row
  ever correlates with its UTM rows — pin from a small pool so they join.

  ### 6. Verifying — sample PER SUBTYPE, not across them

  A 40-row sample spread over six subtypes will miss the sparse ones and read as a mapping failure.
  `xdm.target.file.*` and `xdm.alert.original_threat_name` can look absent in a mixed
  sample and appear as soon as the query filters to `virus` and `ips`.

  ```
  datamodel dataset = fortinet_fortigate_raw
  | filter xdm.observer.name = "<your firewall>" and xdm.event.type = "<subtype>"
  | fields xdm.* | limit 12
  ```

  Take the UNION across subtypes.

  ### 7. Why this source matters most for analytics

  All **23 of 23** third-party-firewall detectors are UNGATED — they run on the base analytics
  engine with no Detection Modules row, no Identity Analytics pairing, no ITDR licence. By
  contrast Windows has 8 reachable of 57 and Duo 1 of 21.

  This is not theoretical: XDR_ANALYTICS alerts carrying
  `original_tags: ['DS:Fortinet/FortiGate']` — "Suspicious port scan" and "Suspicious SMB
  connection from domain controller" — both fire from synthetic CEF. **FortiGate is the proven
  analytics surface.**

  ### 8. Third confirmed detector — Spam Bot Traffic, and re-fire behaviour for all three

  A single internal source host connecting to **15+ distinct external IPs**
  on `dpt=25` or `dpt=587` with `app=SMTP`, `proto=6` fires **Spam Bot Traffic**
  (`XDR_ANALYTICS`, description reads "connected to N SMTP servers in the last 3 days").
  Unlike Suspicious port scan, this one does **not** fire from a single well-shaped one-shot
  burst — a verification burst landing 27 distinct SMTP destinations (well over threshold)
  produced no alert after ~9 minutes of observation. Budget real wall-clock time, not just
  volume, when trying to re-arm it.

  Re-fire behaviour:

  - **Suspicious port scan**: fires repeatedly from different source hosts.
  The alert arrives 3.5-12 minutes after the burst, and the same host is deduplicated for
  1 day. The exact call is in the `trigger_port_scan_analytics` skill.
  - **Spam Bot Traffic** — fires eventually from a correctly-shaped feed, but not instantly;
  needs a fresh source host to re-arm and does not appear to be volume-triggerable on demand.
  - **Suspicious SMB connection from domain controller**: the Cortex doc sets a 7-day
  deduplication period per source, so the same source does not fire again within that window.
  The DC role comes from the tenant's asset classification of a real domain controller,
  not from a host name, so a synthetic host named
  `DC02` is not a domain controller to the detector.

  Full recipes, field shapes, and oversampling gotchas for `observables_dict` are in the
  `trigger_network_analytics_alerts` skill — read that before trying to trigger any of these
  three on demand.

  ### 9. The keys the volumetric and failed-connection detectors read

  **A feed whose senders omit the subtype leaves `xdm.event.type` empty or meaningless.** Two causes
  produce that: a field declared `type: string` with `enum_values` becomes a random 8-character token,
  because the generator only draws from `enum_values` for `type: enum` (the schema declares
  `FTNTFGTsubtype` and `FTNTFGTlevel` as enums for this reason); and a sender that never sends the field at all. **Always pin `FTNTFGTsubtype` in
  `observables_dict`** (`["forward"]` for traffic) — a pinned value always wins over the schema.

  What the modeling rule reads, and what a row needs to carry it:

  | xdm field | CEF key | note |
  |---|---|---|
  | `xdm.event.type`, `xdm.event.operation_sub_type` | `FTNTFGTsubtype` | `forward` for a traffic session; the other values are in section 4 |
  | `xdm.event.outcome` | `outcome` | Only these literals map: `success`/`succeeded`/`update` -> SUCCESS, `failure`/`failed`/`negotiate_error` -> FAILED, `database-check`/`authentication-required` -> PARTIAL, `unregistered`/`new` -> UNKNOWN. `FTNTFGTresult` (`OK`/`DONE` / `ERROR` / `N/A`) is the alternative. **`act=deny` alone does NOT set an outcome** (it only feeds `xdm.observer.action`): for a denied connection send `act=deny` AND `outcome=failure`. |
  | `xdm.event.duration` | `FTNTFGTduration` | seconds, multiplied by 1000. Also subtracted from `FTNTFGTeventtime` to compute `_time` (section 2) |
  | `xdm.source.sent_bytes` / `xdm.target.sent_bytes` | `out` / `in` | the numerators of any volume detector; send integers |
  | `xdm.source.sent_packets` / `xdm.target.sent_packets` | `FTNTFGTsentpkt` / `FTNTFGTrcvdpkt` | |
  | `xdm.network.session_id`, `xdm.session_context_id` | `externalId` | pin from a small pool if rows must join |
  | `xdm.network.ip_protocol` | `proto` | numeric string (`6`, `17`), never a name |

  On valid `forward` rows expect: duration 100%, both byte counters 99.8%,
  session id 98.8%, ip protocol 99.8%, **outcome only on rows whose sender passed `outcome`**.

  **Sender hygiene.** A sender that sends only a handful of keys (no subtype, bytes, duration, outcome or
  event time) and the capitalised product `FortiGate` instead of the pack's `Fortigate` (section 1) produces
  hollow rows that never reach the detectors. Send the full key set and the pack's spelling.

  **Host history.** Palo Alto detectors fire only from hosts with real calendar history; whether
  Analytics measures a host by first-seen span or by active days is not established — plan on 14 real days
  of history per source host.
validated: true
