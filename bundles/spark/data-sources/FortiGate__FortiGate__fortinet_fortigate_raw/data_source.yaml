    Use `suser` instead.] Source user (when known). Account name as the vendor reports it — login name,
    UPN, or sAMAccountName; no domain prefix unless vendor emits one. DROPPED AT PARSE TIME. The parsing
    rule''s final stage is a field whitelist (`| fields FTNTFG*, act, app, dst, dpt, src, spt, suser,
    ...`) and this column is not on it, so it never reaches the modeling rule and can never map. This
    is the BARE FortiOS log name; the CEF wire form the rule reads is the FTNTFGT-prefixed one. Declaring
    this field is wasted.'
