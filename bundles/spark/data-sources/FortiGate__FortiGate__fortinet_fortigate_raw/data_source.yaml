schema_version: 1
id: FortiGate
pack_name: FortiGate
rule_name: FortiGate
dataset_name: fortinet_fortigate_raw
vendor: Fortinet
product: FortiGate
description: 'Fortinet FortiGate firewall logs across six subsystems — traffic sessions, DNS, web filtering,
  IPS, antivirus and SSL-VPN. Delivered to Cortex XSIAM as CEF over syslog with header vendor=Fortinet
  product=Fortigate. The rule defines 127 xdm fields, a traffic-only feed reaches
  39, and generating all six log types reaches 73. The parsing rule ends in a FIELD WHITELIST that discards
  the bare FortiOS names (srcip/dstip/action/devname) — only the FTNTFGT-prefixed CEF forms survive. FTNTFGTeventtime
  is both the parse gate and the back-dating handle. This is the tenant''s proven analytics surface: all
  23 third-party-firewall detectors are ungated and two have already fired from synthetic data.'
categories:
- Network Security
version: 2.0.16
origin: bundle
