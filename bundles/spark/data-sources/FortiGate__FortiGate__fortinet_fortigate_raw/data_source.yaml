how_to_use: |
  ## FortiGate -> `fortinet_fortigate_raw` (validated end to end)

  The rule defines **127 xdm fields**. A
  traffic-only feed reaches **39**. Generating all six log types below reaches **73** — the jump is
  not more volume, it is the OTHER subtypes.

  ### 1. Routing, and a spelling divergence worth knowing

  ```
  [INGEST:vendor="Fortinet", product="Fortigate", target_dataset="fortinet_fortigate_raw", no_hit=keep]
  ```

  The pack spells the product **`Fortigate`, lowercase g**. This YAML's display fields say
  `FortiGate`. Both derive `fortinet_fortigate_raw` so events land either way, but send the pack's
  spelling: if the INGEST match is case-sensitive the parsing rule never runs, and then neither the
  `_time` computation nor the field whitelist applies.

  ### 2. The time gate — and the silent failure behind it

  ```
  filter to_string(FTNTFGTeventtime) ~= "\d{9}$"
  | alter _time = to_timestamp( (eventtime minus its last 9 chars) - FTNTFGTduration )
  ```

  `FTNTFGTeventtime` must END in 9 digits (nanoseconds). **Back-dating formula: to land at epoch T
  carrying duration D, send `str(T + D) + "000000000"`.** Verified: `1788791201000000000` with
  `FTNTFGTduration=180` yields `_time = 1788791021`.

  The parsing rule is `no_hit=keep`, so **an event that fails this filter still lands, with no
  error, and silently takes ingest time.** Always verify the span:
  `dataset = fortinet_fortigate_raw | comp min(_time), max(_time)`.

  ### 3. The parsing whitelist — 50 declared fields can never map

  The parsing rule's final stage keeps only:

  ```
  FTNTFG*, act, _scope, app, c6a2, c6a3, cat, cefDevice*, cnt, destinationTranslated*,
  device*, dhost, dpt, dst, duser, dvchost, external*, fname, fsize, in, msg, out,
  outcome, proto, reason, request*, shost, sourceServiceName, sourceTranslated*,
  sproc, spt, src, suser
  ```

  Everything else is DISCARDED before the modeling rule sees it. **The bare FortiOS names —
  `srcip`, `dstip`, `action`, `devname`, `appcat`, `sessionid`, `policyid`, `srcintf` — are all in
  the discarded set.** 46 fields in this schema are tagged accordingly; sending them is wasted.
  The CEF wire form the rule reads is the `FTNTFGT`-prefixed one.

  ### 4. The six log types

  `FTNTFGTsubtype` selects the subsystem and feeds `xdm.event.type`. Note it is **`FTNTFGTsubtype`,
  not `FTNTFGTtype`** — the latter has no xdm target anywhere in the rule.

