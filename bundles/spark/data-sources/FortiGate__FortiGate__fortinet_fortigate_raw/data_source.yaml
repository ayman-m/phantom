- name: vd
  type: string_short
  description: '[INERT - neither the parsing nor the modeling rule reads this field; it lands as a raw
    column and maps to no xdm.* target.] Virtual domain. Short opaque token, typically without whitespace;
    max ~64 chars. DROPPED AT PARSE TIME. The parsing rule''s final stage is a field whitelist (`| fields
    FTNTFG*, act, app, dst, dpt, src, spt, suser, ...`) and this column is not on it, so it never reaches
    the modeling rule and can never map. This is the BARE FortiOS log name; the CEF wire form the rule
    reads is the FTNTFGT-prefixed one. Declaring this field is wasted.'
  example: root
