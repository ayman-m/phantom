- name: FTNTFGTduration
  type: string
  description: Session duration in seconds. SUBTRACTED from the stripped eventtime to produce _time, so
    an unpinned value shifts every row backwards by up to its random range. Pin it in the same change
    as FTNTFGTeventtime or the two fight.
  example: '180'
- name: FTNTFGTerror
  type: string
  description: Vendor-emitted field 'FTNTFGTerror'. Free-form text; may contain whitespace and punctuation.
    Feeds xdm.event.outcome_reason.
  example: notice
- name: FTNTFGTerror_num
