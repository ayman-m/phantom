  description: Unsigned count of items as recorded by Fortinet. Signed decimal integer; bare digits, optional
    leading minus. Feeds xdm.event.outcome_reason.
  example: '42'
- name: FTNTFGTeventtime
  type: string
  description: 'THE PARSING GATE AND THE TIME SOURCE. The rule filters `to_string(FTNTFGTeventtime) ~=
    "\\d{9}$"` — the value must END in 9 digits (nanoseconds) — then computes `_time = (value with its
    last 9 chars stripped) - FTNTFGTduration`. BACK-DATING FORMULA: to land a row at epoch T while carrying
    duration D, send str(T + D) + "000000000". Because the parsing rule is no_hit=keep, an event that
    FAILS this filter still LANDS with no error and silently takes ingest time — always verify the span
    rather than assuming. Declared `type: integer` historically, which the generator randomises to 4 digits;
    it must be pinned or gated.'
  example: '1788791201000000000'
  is_gate: true
- name: FTNTFGTeventtype
  type: string
  description: Event type or category as the vendor classifies it. Free-form text; may contain whitespace
    and punctuation. Feeds xdm.network.dns.is_response.
  example: dns-response
