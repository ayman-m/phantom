fields:
- name: act
  type: string_short
  description: CEF action — what Fortinet did with the event (allow/block/quarantine/etc.).
    Short opaque token, typically without whitespace; max ~64 chars.
  example: token_value
- name: app
  type: string_short
  description: Application name emitted by Fortinet. Short opaque token, typically
    without whitespace; max ~64 chars.
  example: token_value
- name: cat
  is_gate: true
  type: string
  description: Log category — selects which modeling-rule block runs. trafficlog
    (web traffic, reads the http_* fields), attack (WAF alerts), audit (admin
    actions, reads cs1-cs6). See how_to_use.
  example: 'trafficlog'
- name: cefDeviceEventClassId
  type: string_short
  description: CEF device-event class ID — vendor-specific event-type identifier.
    Short opaque token, typically without whitespace; max ~64 chars.
  example: token_value
- name: cefDeviceVersion
  type: string_short
  description: CEF device-version field — version of the Fortinet product emitting
    this event. Short opaque token, typically without whitespace; max ~64 chars.
  example: token_value
- name: cefName
  type: string_short
  description: CEF event name — short human-readable label for the event class. Short
    opaque token, typically without whitespace; max ~64 chars.
