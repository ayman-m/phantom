how_to_use: |
  ## fortinet fortiweb → Cortex XSIAM (dataset `fortinet_fortiweb_raw`)

    **Routing** — the broker lowercases the CEF/syslog header `vendor`/`product`, replaces
    non-alphanumerics with `_`, and appends `_raw` to choose the dataset (target: `fortinet_fortiweb_raw`).

    **Required CEF header for XSIAM**:
    - **vendor**: `fortinet`
    - **product**: `fortiweb`

    These normalize → `fortinet_fortiweb_raw`.

    **Ingestion shape**: **Flat / CEF-compatible.** The modeling rule reads flat top-level columns (no nested-JSON access). A CEF event routes in and the broker auto-extracts those columns, so this source maps from Phantom's existing CEF path once the dataset is XDM-bound.

    - **Modeling-rule gate — `cat` selects one of THREE blocks, and they read different fields.**
      Pick the block first, then send ITS fields; the right fields under the wrong `cat` land
      raw, count as "modeled", and still map almost nothing.

      | `cat` | Use for | Reads |
      |---|---|---|
      | `trafficlog` (default) | web traffic through the WAF | `src`, `dst`, `src_port`, `dst_port`, `service`, `original_src`, `user_name`, `http_method`, `http_url`, `http_host`, `http_refer`, `http_retcode`, `http_agent`, `http_request_bytes`, `http_response_bytes`, `status` (`success`/`failure`), `cipher_suite` |
      | `attack` | WAF attack alerts | CEF keys: `cefName`, `cefDeviceEventClassId`, `cs1` (application), `cs3`, `cs4` (event type), `src`, `spt`, `dpt`, `app`, `act`, `dhost`, `request` |
      | `audit` | admin/config actions | CEF keys: `cefName`, `cefSeverity`, `cs1` (user id), `cs2` (username), `cs3` (log level), `cs4` (device id), `cs6`, `request`, `requestMethod`, `requestClientApplication`, `dhost`, `msg` |

      **Verified**: the same persona and volume modeled **13** distinct
      xdm fields under `cat = "audit"` with the trafficlog field set, and **26** under
      `cat = "trafficlog"` (HTTP method/URL/referrer/response code, TLS cipher, user identity,
      bytes in both directions). Trafficlog recipe (keep identity fields fixed per worker):

          cat=trafficlog  src=original_src=<client IP>  user_name=<user>  dst=<web server IP>
          dst_port=443  service=https  http_host=portal.example.local  http_method=GET|POST
          http_url=/portal/...  http_refer=https://...  http_retcode=200  http_agent=<browser UA>
          http_request_bytes / http_response_bytes=<integers>  status=success
          cipher_suite=TLS_AES_256_GCM_SHA384

    **XDM mapping**: ~48 fields mapped to the unified data model (`xdm.*`), including: `xdm.alert.category`, `xdm.alert.description`, `xdm.alert.name`, `xdm.alert.original_alert_id`, `xdm.alert.original_threat_id`, `xdm.alert.original_threat_name`.

    **Operator setup**: This data source's modeling rule reads CEF-shaped columns (rt, src, dst, spt, dpt, cs1-6, act, etc.). Phantom emits CEF over syslog (`CEF:0|fortinet|fortiweb|...|<extensions>`) — the broker auto-extracts CEF k=v pairs into typed columns matching the CEF dictionary, and the broker routes to this dataset via the CEF header's vendor/product. Usually NO operator-side broker config is required beyond standard CEF ingestion.

    **Status**: Derived from the parsing/modeling rules. The `trafficlog`
    block is verified on a live tenant (26 xdm fields, above); `attack` and `audit`
    are documented from the rule but not yet verified, so the source keeps no `validated` pill.

    **Verify** (once the dataset is XDM-bound, wide ≥7d window):

        config timeframe = 30d | datamodel dataset = fortinet_fortiweb_raw | sort desc _time | fields xdm.* | limit 20

  **How simulation works — read this before generating.** `phantom_create_data_worker`
  resolves each field's value in this order:

    1. `observables_dict[field]` — explicit; always wins. Values are LISTS.
    2. `is_gate` + `example` — gate fields are auto-pinned to their example.
    3. declared `type` — ipv4/user/url/datetime are synthesized plausibly.
    4. field-name heuristic.
    5. random token.

  **A field's `example` below is DOCUMENTATION ONLY unless that field is marked
  `is_gate`.** So every field the modeling rule reads expecting a specific SHAPE --
  an enum, an HTTP method, a status code, a resource path, a numeric type code, an
  XML or JSON blob -- MUST be passed in `observables_dict`, with keys spelled
  exactly as `fields[]` spells them (dotted leaves included, e.g.
  `event_data.param2`). Anything you leave out is randomly generated, and the rule
  will map it to garbage or drop the event.