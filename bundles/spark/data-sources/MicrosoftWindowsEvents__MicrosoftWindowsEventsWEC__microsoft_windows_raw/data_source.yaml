fields:
- name: event_id
  type: integer
  description: Windows Event ID. 4624, 4625, 4634 and 4672 are natively rendered by the connector and
    need no provider/rendering overrides. Any other id also needs provider and rendering.message/rendering.task.
  example: 4624
- name: computer
  type: host
  description: Host name (short or FQDN) the event claims to come from. Becomes System/Computer, which
    the applet maps to the computer_name column (the same column the syslog sibling's CEF schema
    populates).
  example: PHDC02.phantom.lab
- name: provider
  type: string
  description: Windows Event provider name. Required for any event_id outside the four natively-catalogued
    ones; Security-channel events use Microsoft-Windows-Security-Auditing.
  example: Microsoft-Windows-Security-Auditing
- name: channel
  type: string
  description: Windows Event Log channel.
  example: Security
- name: time
  type: datetime
  description: Event time (ISO-8601 UTC, epoch seconds, or a relative token the connector resolves
    with its own clock, e.g. "now-300s"). Becomes the event's TimeCreated and therefore _time.
  example: '2026-10-14T09:15:42Z'
- name: event_data
  type: json
  description: Named Data nodes as a JSON object, keyed exactly as the modeling rule's coalesce chain
    reads them (e.g. TargetUserName, SubjectUserSid, WorkstationName, IpAddress). Shape differs per
    event_id; declare only the keys the target event type carries.
  example: '{}'
- name: outcome
  type: enum
  enum_values:
  - success
  - failure
  description: Logon/operation outcome. failure maps to xdm.event.outcome = FAILED.
  example: success
- name: rendering.message
  type: string_long
  description: 'Rendered description text (RenderingInfo/Message). Required for any event_id outside
    the four natively-catalogued ones, or the connector rejects the call. Load-bearing, not
    decorative -- the modeling rule reads 33 fields by regex from this same text (see the syslog
    sibling''s description) -- copy the exact message from the matching trigger_<scenario>_alert
    skill, never a placeholder.'
  example: 'An account was successfully logged on.'
- name: rendering.task
  type: string_short
  description: Rendered Task text (RenderingInfo/Task). Required for any event_id outside the four
    natively-catalogued ones.
  example: Logon
- name: rendering.level
  type: string_short
  description: Rendered severity level text. Optional; defaults to Information.
  example: Information
- name: rendering.opcode
  type: string_short
  description: Rendered opcode text. Optional.
  example: Info
- name: rendering.channel
  type: string_short
  description: Rendered channel override. Optional; defaults to the top-level channel.
  example: Security
- name: rendering.provider
  type: string_short
  description: Rendered provider override. Optional; defaults to the top-level provider.
  example: Microsoft-Windows-Security-Auditing
- name: rendering.keywords
  type: string
  description: Rendered keywords text. "Audit Failure" maps event_result to failure, otherwise success.
  example: Audit Success
- name: record_id
  type: integer
  description: Windows Event record id (System/EventRecordID). Optional.
  example: 88301
- name: process_id
  type: integer
  description: Process id that logged the event (System/Execution/@ProcessID). Optional.
  example: 656
- name: thread_id
  type: integer
  description: Thread id that logged the event (System/Execution/@ThreadID). Optional.
  example: 4120
- name: activity_id
  type: string_short
  description: Correlation activity id GUID (System/Correlation/@ActivityID). Optional.
  example: '{00000000-0000-0000-0000-000000000000}'
use_cases:
- Cloud
