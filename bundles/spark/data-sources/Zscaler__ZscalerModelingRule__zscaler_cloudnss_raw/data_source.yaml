- name: _raw_log
  type: json
  description: 'Native zscaler_cloudnss log line as the vendor emits it (no syslog frame -- the RAW sender prepends one). Branch: BRANCH: sourcetype="zscalernss-web" (Cloud NSS Web Logs). The cloudnss MODEL block has four mutually-exclusive `filter sourcetype = ...` branches; web assigns 53 xdm.* fields vs fw 25, dns 24, audit 13, and it matches th'
  example: '[{"sourcetype":"zscalernss-web","event":{"datetime":"{{now:%Y-%m-%d %H:%M:%S}}","tz":"GMT","recordid":"4152897361","user":"jdoe@example.com","department":"Corporate%20IT","location":"Seattle%20Branch","devicehostname":"LT-SEA-4417","deviceostype":"Windows","deviceosversion":"10.0.22631","external_devid":"8f3c2b71-4a19-4e0d-9c2a-77f1d6b0e5a3","protocol":"HTTPS","action":"Blocked","reason":"Blocked - Malware detected","ClientIP":"10.42.18.77","clientpublicIP":"198.51.100.23","clt_sport":"53194","serverip":"203.0.113.42","fwd_gw_ip":"165.225.60.14","clienttlsversion":"TLSv1.3","srvtlsversion":"TLSv1.2","hostname":"badsite.example.net","url":"badsite.example.net/downloads/invoice_2024.exe","refererURL":"www.example.com/search?q=invoice","requestmethod":"GET","status":"403","requestsize":"512","responsesize":"1638","contenttype":"application/octet-stream","useragent":"Mozilla/5.0%20(Windows%20NT%2010.0;%20Win64;%20x64)%20AppleWebKit/537.36%20(KHTML,%20like%20Gecko)%20Chrome/126.0.0.0%20Safari/537.36","appname":"General Browsing","urlcategory":"MALWARE_SITE","urlsupercategory":"SECURITY","threatcategory":"Sandbox Malware","threatname":"Win32.Trojan.Emotet","threatseverity":"Critical","filetype":"EXE","unscannabletype":"None","bamd5":"9e107d9d372bb6826bd81d3542a419d6","sha256":"3fdba35f04dc8c462986c992bcf875546257113072a909c162f7e470e581e278","rulelabel":"Block Malware Downloads","urlfilterrulelabel":"Security Categories Block","apprulelabel":"None","rdr_rulename":"None","dlpidentifier":"0","dlprulename":"None"}}]'
- name: dest_ipv4
  type: ipv4
  description: Destination address of the connection target. Dotted-quad IPv4 literal (e.g., 192.0.2.45);
    no port suffix, no surrounding brackets or quotes.
  example: 203.0.113.42
- name: dest_ipv6
  type: ipv6
  description: Destination address of the connection target. Colon-separated hexadecimal IPv6 literal
    (RFC 4291); no zone suffix, no surrounding brackets.
  example: 2001:db8::1
- name: os
  type: string
  description: Vendor-emitted field 'Os'. Free-form text; may contain whitespace and punctuation.
  example: Linux
- name: proto
  type: string
  description: Network protocol name or numeric IANA assignment. Free-form text; may contain whitespace
    and punctuation.
  example: tcp
- name: sourcetype
  is_gate: true
  type: string
  description: Modeling-rule GATE — the NSS feed type the parsing rule extracts from _raw_log. Must equal
    one of zscalernss-web | zscalernss-dns | zscalernss-fw | zscalernss-audit for the modeling rule to
    fire and populate xdm.* (seed it via observables_dict on the bare leaf name `sourcetype`).
  example: zscalernss-web
- name: src_ipv4
  type: ipv4
  description: Source address of the connection initiator. Dotted-quad IPv4 literal (e.g., 192.0.2.45);
    no port suffix, no surrounding brackets or quotes.
  example: 203.0.113.42
- name: src_ipv6
  type: ipv6
  description: Source address of the connection initiator. Colon-separated hexadecimal IPv6 literal (RFC
    4291); no zone suffix, no surrounding brackets.
  example: 2001:db8::1
- name: url_category
  type: string_short
  description: Zscaler's category classifier for the event. Short opaque token, typically without whitespace;
