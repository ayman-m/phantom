how_to_use: |
  ## Sending these logs to Cortex XSIAM

  **WIRE FORMAT -- use `type=RAW`, NOT CEF.** This source's modeling rule
  extracts its fields from `_raw_log`, the vendor's own log line. A CEF event's
  extensions become dataset COLUMNS and the broker leaves `_raw_log` EMPTY, so
  over CEF this rule maps NOTHING however the schema is shaped. Create the
  worker with `type=RAW`: the generator pins `_raw_log` to this schema's
  `_raw_log` example (or to an `observables_dict` override) and the sender ships
  that line syslog-framed, verbatim.

  **Routing for RAW.** A raw line carries no CEF header, so the broker cannot
  derive vendor/product from the wire. A Broker syslog collector row must map
  this source's listener port to vendor `zscaler` / product `cloudnss`, taken verbatim
  from this pack's parsing-rule INGEST block -- that is the literal the broker
  actually routes on. These are NOT the display `vendor`/`product` fields in
  this schema, which differ. Without that row the event lands in
  `unknown_unknown_raw`.

  This source's PARSING rule also reads `_raw_log` -- over CEF it receives
  nothing, so the parsing rule extracts NO columns at all and every
  column-derived field in the modeling rule stays empty too. CEF does not
  merely lose some fields here; it breaks the whole chain.

  Phantom emits Zscaler Internet Access cloud-NSS records as a JSON log line. This
  is a **raw-log** source: the modeling rule reads the whole JSON object out of
  `_raw_log` (`_raw_log -> sourcetype`, `_raw_log -> epochtime`, etc.), so the
  vendor's fields must be packed **inside** the `_raw_log` JSON, not as top-level
  columns.

  **Required broker routing for XSIAM**:

  - **vendor**: `zscaler`
  - **product**: `cloudnss`

  Broker derives → `zscaler_cloudnss_raw`.

  > **Operator setup (raw-log source):** because the parsing rule reads
  > `_raw_log`, this source needs a **Broker VM Syslog Applet** configured with
  > vendor `zscaler` + product `cloudnss` on a dedicated source port. Without it,
  > the JSON lands in `unknown_unknown_raw` and the modeling rule never fires.

  **MR pattern**: Raw-log JSON. The parsing rule flattens `_raw_log` and the
  modeling rule branches on `_raw_log -> sourcetype`.

  **PR filter quirks**: `_time` is derived from `_raw_log -> epochtime`
  (10-digit epoch seconds). Events without it still land (`no_hit=keep`) but get
  ingest-time `_time`.

  **Verify**:

  ```xql
  datamodel dataset = zscaler_cloudnss_raw
  | filter xdm.event.type = "zscalernss-web"
  | fields xdm.*
  | limit 1
  ```

  ### Make it map to XDM

  The `zscaler_cloudnss_raw` modeling rule only runs when `_raw_log -> sourcetype`
  is one of `"zscalernss-web"`, `"zscalernss-dns"`, `"zscalernss-fw"`,
  `"zscalernss-audit"` — each is a separate feed-type mapping branch. The
  connector's `sourcetype` field defaults to `zscalernss-web` (richest: the
  web-proxy branch), so default generation clears the gate; to exercise another
  branch pass `observables_dict={"sourcetype": "zscalernss-dns"}` — seed the bare
  leaf name `sourcetype`, NOT the dotted `_raw_log.sourcetype`, because the
  generator keys observable overrides on the leaf basename.
  The web branch populates core XDM: `xdm.event.type` <- `sourcetype`,
  `xdm.network.http.url`/`xdm.network.http.url_category` <- the URL fields,
  `xdm.source.ipv4`/`xdm.target.ipv4` <- client/server IPs,
  `xdm.observer.action` <- `action`, `xdm.source.user.username` <- `user`, and
  `xdm.event.outcome` from the request/response action.

  **How simulation works — read this before generating.** `phantom_create_data_worker`
  resolves each field's value in this order:

    1. `observables_dict[field]` — explicit; always wins. Values are LISTS.
    2. `is_gate` + `example` — gate fields are auto-pinned to their example.
    3. declared `type` — ipv4/user/url/datetime are synthesized plausibly.
    4. field-name heuristic.
    5. random token.

  **A field's `example` below is DOCUMENTATION ONLY unless that field is marked
  `is_gate`.** So every field the modeling rule reads expecting a specific SHAPE --
  an enum, an HTTP method, a status code, a resource path, a numeric type code, an
  XML or JSON blob -- MUST be passed in `observables_dict`, with keys spelled
  exactly as `fields[]` spells them (dotted leaves included, e.g.
  `event_data.param2`). Anything you leave out is randomly generated, and the rule
  will map it to garbage or drop the event.
