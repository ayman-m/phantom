  Send them with `http-sender.send_events {"destination": "proofpoint_tap", "events": [<the objects>]}`.

  ### Field guide and value-shape rules

  - `_log_type` (`message-delivered`, `message-blocked`, `click-blocked`, `click-permitted`) must be present on every event; the modeling rule builds `xdm.event.type` as `<_vendor> - <_log_type>` and `_vendor` is stamped by the collector.
  - Message events: `GUID`, `messageID`, `messageTime`, `recipient` (array), `fromAddress` (array), `sender`, `senderIP`, `subject`, `ccAddresses` (array, `[]` if none), `messageParts` (array of objects, each with `filename`, `md5`, `sha256`, `contentType`, `oContentType`, `disposition`, `sandboxStatus`), `threatsInfoMap` (array, `[]` when there is no threat).
  - Threat messages also carry the top-level hunt fields `classification`, `threatID`, `threatURL`, `threatStatus` and `url`; the rule reads those top-level fields directly, so send them in addition to `threatsInfoMap`.
  - Click events: `GUID`, `messageID`, `clickTime`, `clickIP`, `userAgent`, `url`, `recipient` (a STRING), `sender`, `senderIP`, `fromAddress` (array), `subject`, `classification`, `campaignId`, `threatID`, `threatTime`, `threatURL`, `threatStatus`; no `messageParts` or `threatsInfoMap`.
  - The click must match its message: same `GUID` and `messageID` (and recipient, sender, `url`, threat) as the message-delivered event it follows, with `clickTime` later than `messageTime`.
  - Times are ISO-8601 UTC strings with a trailing `Z` and milliseconds (`2026-10-01T10:15:20.123Z`). The parsing rule also accepts `Mon DD YYYY HH:MM:SS`.
  - Hosts and identities must be fictitious (`.example` / `.invalid` domains, random hex hashes). Mail-server and click addresses should be real public IPs, because Cortex derives geography and ASN from the address itself: use an out-of-country address for an attacker and a Saudi ISP address for a user's own click.
  - Use the profile's spellings: `threatID`, `campaignID` and `threatUrl` inside `threatsInfoMap`; `threatID`, `threatURL` and `campaignId` at the top level.

  ### Timing

  `_time` comes from `messageTime` (messages) or `clickTime` (clicks, which repeat it as `messageTime` in `generate_events`), via the parsing rule, so a back-dated event is
  placed at its own time, not the ingestion time. Ingestion can lag **5-7 minutes**: wait that long before concluding an event did not land, and use a time frame that covers the back-dated window.

  ### Verification

  Raw rows (does the event exist, with the JSON columns intact?):

  ```xql
  dataset = proofpoint_tap_raw
  | filter GUID = "<the GUID you sent>"
  | fields _time, _vendor, _log_type, GUID, messageID, recipient, threatsInfoMap
  ```

  Data model (does it map?). Look at **at least 20 rows** and count the distinct non-null `xdm.*` fields across them, never one row:

  ```xql
  datamodel dataset = proofpoint_tap_raw
  | fields _log_type, xdm.event.type, xdm.event.id, xdm.email.sender, xdm.email.recipients, xdm.email.subject,
           xdm.email.message_id, xdm.email.return_path, xdm.email.cc, xdm.email.delivery_timestamp,
           xdm.alert.description, xdm.alert.original_threat_id, xdm.alert.subcategory,
           xdm.alert.original_threat_name, xdm.alert.original_alert_id,
           xdm.email.attachment.filename, xdm.email.attachment.md5, xdm.email.attachment.sha256,
           xdm.intermediate.host.ipv4_addresses, xdm.source.host.ipv4_addresses, xdm.source.user_agent,
           xdm.target.url
  | limit 50
  ```

  **Expected result:** a send of 48 events (4 scenarios x 12) lands with the right `_log_type`
  (16 `message-delivered`, 24 `message-blocked`, 4 `click-blocked`, 4 `click-permitted`). Over 50 rows the data model
  populates **23 distinct non-null `xdm.*` fields**: `message-delivered` 21, `message-blocked` 20, click events 18. They include
  `xdm.event.type` = `Proofpoint - <_log_type>`, `xdm.email.sender`, `xdm.email.recipients`, `xdm.email.subject`,
  `xdm.email.message_id`, `xdm.alert.description`, `xdm.alert.original_threat_id`, `xdm.alert.subcategory`,
  `xdm.email.attachment.filename`, `.md5` and `.sha256`, `xdm.intermediate.host.ipv4_addresses`, and for clicks
  `xdm.source.host.ipv4_addresses`, `xdm.source.user_agent` and `xdm.target.url`.

  ### Caveats

  - Click events repeat `messageTime` as `clickTime` (so `_time` lands at the click), which means `xdm.email.delivery_timestamp` on a click shows the click time, not the message's delivery time.
  - Enum casing is Phantom's choice, not real TAP's: `classification` is sent upper case (`PHISHING`, `MALWARE`, `SPAM`, `IMPOSTOR`), while real TAP uses lower case (`phish`, `malware`, `spam`, `impostor`). The modeling rule does not filter on it, so either lands; match the casing you sent when you write detections.
  - The 23-field figure is a union over many rows and all record kinds. Per record kind the counts are 21 (`message-delivered`), 20 (`message-blocked`) and 18 (click events), so no single kind reaches all 23: judge mapping from >= 20 rows, never one row.
  - Fields the rule does not read (`QID`, `phishScore`, `malwareScore`, `spamScore`, `impostorScore`, `quarantine*`, `policyRoutes`, `modulesRun`, `replyToAddress`, `headerFrom`, `threatStatus`, `campaignId`, ...) stay in the raw dataset only; use them from `dataset = proofpoint_tap_raw`, not `datamodel`.

  ### Validation status

  This source is **not** marked `validated` or `raw_validated`. Those tiers belong to the syslog/CEF path; mapping
  validation of Proofpoint TAP stays on the syslog/CEF source `ProofpointTAP`. Never claim this HTTP source is validated; report only what you measured
  (rows landed, distinct `xdm.*` fields over at least 20 rows).
