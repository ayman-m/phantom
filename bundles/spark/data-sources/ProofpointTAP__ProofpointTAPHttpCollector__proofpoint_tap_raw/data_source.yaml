origin: bundle
author: phantom-bundle
uploaded_by: null
created_at: '2026-10-01T12:00:00Z'
updated_at: '2026-10-01T12:00:00Z'
logo:
  mime_type: image/svg+xml
  data: 
  source: phantom-bundle
  license: MIT
  fidelity: branded
formats:
- JSON
is_rawlog_only: false
fields:
- name: _vendor
  type: string
  is_meta: true
  description: 'Collector-stamped vendor (`Proofpoint` on the operator''s collector). Not sent by Phantom: the XSIAM HTTP Log Collector adds it from its Vendor setting. The modeling rule reads it to build `xdm.event.type` (`<_vendor> - <_log_type>`).'
  example: Proofpoint
- name: _log_type
  type: enum
  description: TAP SIEM record kind, set by the sender. Drives `xdm.event.type` = `Proofpoint - <_log_type>`. `message-*` records describe an email (arrays `messageParts` and `threatsInfoMap`); `click-*` records describe a click on a URL Defense rewritten link and carry no `messageParts` or `threatsInfoMap`. The rule does not filter on it, so an unlisted value still lands, with a nonstandard `xdm.event.type`.
  enum_values:
  - message-delivered
  - message-blocked
  - click-blocked
  - click-permitted
  example: message-blocked
- name: GUID
  type: string_short
  description: TAP record id. A message and every click on that message share the same GUID. Maps to `xdm.event.id` and `xdm.alert.original_alert_id`. Use it as the marker in raw-dataset verification queries.
  example: Kq3vT8xZpL1mWc9RbNd2YfHs6AeUjG4o
- name: QID
  type: string_short
  description: Proofpoint queue id of the message. Not mapped to xdm; kept in the raw dataset. Absent on click events.
  example: r3f9a1c07be
- name: id
  type: string_short
  description: Click record id, `<32hex>-<16hex>-<16hex>-<64hex>`. Click events only. Not mapped to xdm.
  example: 57be3fd7-f3a0-9710-290b6fdfa56257b0
- name: messageID
  type: string
  description: RFC 5322 Message-ID, angle brackets included. Maps to `xdm.email.message_id`. A click repeats the Message-ID of the message it clicked.
  example: <482915063.JavaMail.security@mail.account-verify-portal.example>
- name: messageTime
  type: datetime
  description: 'When TAP processed the message, ISO-8601 UTC with milliseconds and a trailing Z (`2026-10-01T10:15:20.123Z`). The parsing rule uses it first for `_time` (via `%FT%R:%E*SZ`), and the modeling rule maps it to `xdm.email.delivery_timestamp`. Parsing-rule filter `clickTime != null or messageTime != null` is a presence check with `no_hit=keep`: an event with neither is kept but its `_time` is the ingestion time. Always send the CURRENT time (or a deliberate back-dated one), never this example. Click events from `generate_events` repeat `clickTime` here so `_time` lands at the click.'
  example: '2026-10-01T10:15:20.123Z'
  is_gate: true
- name: clickTime
  type: datetime
  description: When the user clicked, ISO-8601 UTC with milliseconds and a trailing Z. Click events only. The parsing rule uses it for `_time` only when `messageTime` is absent or unparseable (`coalesce(messageTime, clickTime)`); the `_1_3` modeling rule does not map it to xdm. Always send a current or deliberately back-dated time, never this example.
  example: '2026-10-01T10:31:07.482Z'
  is_gate: true
- name: recipient
  type: email
  is_array: true
  description: Envelope recipient(s). An array of addresses on `message-*` events, but a plain STRING on `click-*` events; the modeling rule accepts both (`recipient contains "["` branch). Maps to `xdm.email.recipients`.
  example: noura.alharbi@phantom-lab.example
- name: toAddresses
  type: email
  is_array: true
  description: 'Header To: addresses as an array. Not mapped to xdm; kept in the raw dataset.'
  example: noura.alharbi@phantom-lab.example
- name: headerTo
  type: string
  description: 'Header To: display form `"name" <address>`, joined with `; ` for several recipients. Not mapped to xdm.'
  example: '"noura.alharbi" <noura.alharbi@phantom-lab.example>'
- name: ccAddresses
  type: email
  is_array: true
  description: 'Cc: addresses as an array, `[]` when there are none. Maps to `xdm.email.cc`.'
  example: khalid.alotaibi@phantom-lab.example
- name: fromAddress
  type: email
  is_array: true
  description: Header From address as a one-element array (also an array on click events). Maps to `xdm.email.sender` (the rule strips the brackets and quotes).
  example: security@account-verify-portal.example
- name: sender
  type: email
  description: Envelope sender (SMTP MAIL FROM) as a plain string. Maps to `xdm.email.return_path`, and to `xdm.email.sender` when `fromAddress` is absent.
  example: security@account-verify-portal.example
- name: senderIP
  type: ipv4
  description: IP of the sending mail server (a real public address; Cortex resolves its country and ASN, so use an out-of-country one for an attacker). Maps to `xdm.intermediate.host.ipv4_addresses`. In `generate_events` it is the `source_ip` argument.
  example: 217.138.128.45
- name: headerFrom
  type: string
  description: Header From in display form `"Display Name" <address>`; in spoofed mail it can differ from `sender`. Not mapped to xdm. Message events only.
  example: '"Account Security" <security@account-verify-portal.example>'
- name: replyToAddress
  type: email
  is_array: true
  description: Reply-To addresses as an array, `[]` when none. A reply-to that differs from the sender is a phishing and BEC signal. Not mapped to xdm. Message events only.
  example: reply-4821@mail-relay.example
- name: headerReplyTo
  type: string
  description: Header Reply-To display form, `null` when there is no Reply-To. Not mapped to xdm. Message events only.
  example: '"Account Security" <reply-4821@mail-relay.example>'
- name: subject
  type: string_long
  description: Message subject. Maps to `xdm.email.subject`.
  example: Your account requires verification
- name: messageSize
  type: integer_byte_count
  description: Message size in bytes. Not mapped to xdm. Message events only.
  example: 48213
- name: policyRoutes
  type: string
  is_array: true
  description: Mail-flow policy routes the message matched; always starts with `default_inbound`, and threat mail to sensitive recipients adds a second route (`executives`, `finance`, `hr`, `it_staff`, `privileged_users`). Not mapped to xdm.
  example: default_inbound
- name: phishScore
  type: integer
  description: TAP phishing confidence 0-100. Not mapped to xdm; the hunt field for phishing detections.
  example: 96
- name: malwareScore
  type: integer
  description: TAP malware confidence 0-100 (90-100 for malware attachments). Not mapped to xdm.
  example: 4
- name: spamScore
  type: integer
  description: TAP spam confidence 0-100. Not mapped to xdm.
  example: 61
- name: impostorScore
  type: integer
  description: TAP impostor (BEC) confidence 0-100; above 75 is the BEC indicator. Not mapped to xdm.
  example: 0
- name: quarantineFolder
  type: string_short
  description: Quarantine folder (`Phish`, `Malware`) for blocked mail; `null` for delivered mail. Not mapped to xdm. Message events only.
  example: Phish
- name: quarantineRule
  type: string
  description: Rule that quarantined the message (`module.urldefense.phish`, `module.sandbox.threat`); `null` for delivered mail. Not mapped to xdm. Message events only.
  example: module.urldefense.phish
- name: completelyRewritten
  type: boolean
  description: 'JSON boolean: true when URL Defense rewrote every URL in the message. Send a real boolean, not the string `"true"`. Not mapped to xdm. Message events only.'
  example: true
- name: clusterId
  type: string_short
  description: Proofpoint cluster id. Not mapped to xdm.
  example: phantom_lab_hosted
- name: cluster
  type: string_short
  description: Proofpoint cluster name (same value as `clusterId` in the profile). Not mapped to xdm.
  example: phantom_lab_hosted
- name: modulesRun
  type: string
  is_array: true
  description: 'TAP modules that processed the message, a JSON array of strings: `spam`, `urldefense`, `pdr`, `sandbox`, `impostor`, `qr-scanner`. Click events carry `["urldefense"]`. Not mapped to xdm.'
  example: urldefense
- name: xmailer
  type: string
  description: X-Mailer header of the message. Not mapped to xdm. Message events only.
  example: Microsoft Outlook 16.0
- name: messageParts
  type: json
  is_array: true
  description: Native JSON array of objects, one per MIME part (the profile puts the inline `text.txt` body at index 0 and attachments after it). The rule reads `filename`, `md5` and `sha256` from every element and comma-joins them into `xdm.email.attachment.filename`, `.md5` and `.sha256`. Message events only; see the `messageParts.N.*` leaves.
  example: '[{"contentType": "text/plain", "disposition": "inline", "filename": "text.txt", "md5": "10adf3482c4b7d8993447cbaed90dafc", "oContentType": "text/plain", "sandboxStatus": null, "sha256": "abbc0048e5d3b4324f541e8b76f9fdbbe477caec3cf4b25ed0954701f87b2317"}]'
- name: messageParts.0.filename
  type: file_path
  description: 'Leaf of `messageParts` for the inline text body (index 0): file name. Mapped (joined across all parts) to `xdm.email.attachment.filename`.'
  example: text.txt
- name: messageParts.0.contentType
  type: string
  description: 'Leaf of `messageParts` for the inline text body (index 0): MIME type as TAP detected it. Not mapped to xdm.'
  example: text/plain
- name: messageParts.0.oContentType
  type: string
  description: 'Leaf of `messageParts` for the inline text body (index 0): MIME type as declared in the message. Not mapped to xdm.'
  example: text/plain
- name: messageParts.0.disposition
  type: enum
  description: 'Leaf of `messageParts` for the inline text body (index 0): `inline` for the body, `attachment` for files. Not mapped to xdm.'
  enum_values:
  - inline
  - attachment
  example: inline
- name: messageParts.0.md5
  type: hash_md5
  description: 'Leaf of `messageParts` for the inline text body (index 0): MD5 of the part (random hex in synthetic data). Mapped (joined) to `xdm.email.attachment.md5`.'
  example: 10adf3482c4b7d8993447cbaed90dafc
- name: messageParts.0.sha256
  type: hash_sha256
  description: 'Leaf of `messageParts` for the inline text body (index 0): SHA-256 of the part (random hex in synthetic data). Mapped (joined) to `xdm.email.attachment.sha256`. For a malware message this is also the threat id.'
  example: abbc0048e5d3b4324f541e8b76f9fdbbe477caec3cf4b25ed0954701f87b2317
- name: messageParts.0.sandboxStatus
  type: enum
  description: 'Leaf of `messageParts` for the inline text body (index 0): sandbox detonation verdict, or JSON `null` when the part was not submitted (the body and images). Not mapped to xdm.'
  enum_values:
  - CLEAN
  - MALICIOUS
  - UNKNOWN
  example: CLEAN
- name: messageParts.1.filename
  type: file_path
  description: 'Leaf of `messageParts` for the first attachment (index 1): file name. Mapped (joined across all parts) to `xdm.email.attachment.filename`.'
  example: Shipment_48213.xlsm
- name: messageParts.1.contentType
  type: string
  description: 'Leaf of `messageParts` for the first attachment (index 1): MIME type as TAP detected it. Not mapped to xdm.'
  example: application/vnd.ms-excel.sheet.macroEnabled.12
- name: messageParts.1.oContentType
  type: string
  description: 'Leaf of `messageParts` for the first attachment (index 1): MIME type as declared in the message. Not mapped to xdm.'
  example: application/vnd.ms-excel.sheet.macroEnabled.12
- name: messageParts.1.disposition
  type: enum
  description: 'Leaf of `messageParts` for the first attachment (index 1): `inline` for the body, `attachment` for files. Not mapped to xdm.'
  enum_values:
  - inline
  - attachment
  example: attachment
- name: messageParts.1.md5
  type: hash_md5
  description: 'Leaf of `messageParts` for the first attachment (index 1): MD5 of the part (random hex in synthetic data). Mapped (joined) to `xdm.email.attachment.md5`.'
  example: 2fe442e9820fa5f22bcca04d5b13fc63
- name: messageParts.1.sha256
  type: hash_sha256
  description: 'Leaf of `messageParts` for the first attachment (index 1): SHA-256 of the part (random hex in synthetic data). Mapped (joined) to `xdm.email.attachment.sha256`. For a malware message this is also the threat id.'
  example: dd6e58252bf3f8eaa314bc0ffc3b7c1642b7dac0f60e1e2501fd672b2959c104
- name: messageParts.1.sandboxStatus
  type: enum
  description: 'Leaf of `messageParts` for the first attachment (index 1): sandbox detonation verdict, or JSON `null` when the part was not submitted (the body and images). Not mapped to xdm.'
  enum_values:
  - CLEAN
  - MALICIOUS
  - UNKNOWN
  example: MALICIOUS
- name: threatsInfoMap
  type: json
  is_array: true
  description: Native JSON array of per-threat objects; `[]` on benign mail and on bec_impostor mail, one element on URL and attachment threats. Message events only. The whole value maps to `xdm.alert.description` (coalesced with `threatURL`), each element's `threatType` to `xdm.alert.subcategory`, and each element's `threatID` to `xdm.alert.original_threat_id` when the top-level `threatID` is absent. See the `threatsInfoMap.0.*` leaves.
  example: '[{"campaignID": "CMP-4821", "classification": "PHISHING", "threat": "https://credential-harvest.example/login?redirect=91b7584a", "threatID": "de557f4ec679f8a604d7802584cb47e0789947be78f92a4a07be30da1f6d0beb", "threatStatus": "active", "threatTime": "2026-10-01T10:15:20.123Z", "threatType": "URL", "threatUrl": "https://tap-threatinsight.example/#/threat/email/Kq3vT8xZpL1mWc9RbNd2YfHs6AeUjG4o"}]'
- name: threatsInfoMap.0.threatType
  type: enum
  description: 'Leaf of `threatsInfoMap[0]`: what the threat is. Mapped to `xdm.alert.subcategory` (first choice, comma-joined across elements).'
  enum_values:
  - URL
  - ATTACHMENT
  example: URL
- name: threatsInfoMap.0.threatID
  type: hash_sha256
  description: 'Leaf of `threatsInfoMap[0]`: threat id, a random 64-hex token for a URL threat, the attachment''s SHA-256 for an attachment threat. Mapped to `xdm.alert.original_threat_id` only when the top-level `threatID` is absent.'
  example: de557f4ec679f8a604d7802584cb47e0789947be78f92a4a07be30da1f6d0beb
- name: threatsInfoMap.0.classification
  type: enum
  description: 'Leaf of `threatsInfoMap[0]`: threat class. Phantom uses upper case (PHISHING, MALWARE, SPAM, IMPOSTOR); real TAP emits lower case (`phish`, `malware`, `spam`, `impostor`). The `_1_3` rule reads the top-level `classification`, and only reads this leaf (`$[''0''].classification`) when the map arrives as an object keyed by index.'
  enum_values:
  - PHISHING
  - MALWARE
  - SPAM
  - IMPOSTOR
  example: PHISHING
- name: threatsInfoMap.0.threat
  type: string_long
  description: 'Leaf of `threatsInfoMap[0]`: the threat artifact, the malicious URL for a URL threat or the attachment''s SHA-256 for an attachment threat. Not mapped separately (it is inside the `xdm.alert.description` value).'
  example: https://credential-harvest.example/login?redirect=91b7584a
- name: threatsInfoMap.0.threatStatus
  type: enum
  description: 'Leaf of `threatsInfoMap[0]`: verdict state. Phantom emits only `active`; real TAP also reports `cleared` and `falsePositive`. Not mapped to xdm.'
  enum_values:
  - active
  - cleared
  - falsePositive
  example: active
- name: threatsInfoMap.0.threatTime
  type: datetime
  description: 'Leaf of `threatsInfoMap[0]`: when TAP identified the threat, ISO-8601 UTC. Equal to `messageTime` in generated events. Not mapped to xdm.'
  example: '2026-10-01T10:15:20.123Z'
- name: threatsInfoMap.0.campaignID
  type: string_short
  description: 'Leaf of `threatsInfoMap[0]`: Proofpoint campaign id (note the spelling `campaignID` inside the map, `campaignId` on click events). Not mapped to xdm.'
  example: CMP-4821
- name: threatsInfoMap.0.threatUrl
  type: url
  description: 'Leaf of `threatsInfoMap[0]`: link to the Threat Insight page for the message (note the spelling `threatUrl` inside the map, `threatURL` at top level). Not mapped to xdm.'
  example: https://tap-threatinsight.example/#/threat/email/Kq3vT8xZpL1mWc9RbNd2YfHs6AeUjG4o
- name: classification
  type: enum
  description: Top-level threat class on threat messages, bec_impostor mail (`IMPOSTOR`) and on every click. Maps to `xdm.alert.original_threat_name` and is the fallback for `xdm.alert.subcategory` (used on click events, which have no `threatsInfoMap`). Phantom emits upper case; real TAP emits lower case (`phish`, `malware`, `spam`, `impostor`). Absent on benign mail.
  enum_values:
  - PHISHING
  - MALWARE
  - SPAM
  - IMPOSTOR
  example: PHISHING
- name: threatID
  type: hash_sha256
  description: 'Top-level threat id: the malicious artifact''s SHA-256 (attachments) or a random 64-hex token (URLs). Maps to `xdm.alert.original_threat_id`. Absent on benign and bec_impostor mail.'
  example: de557f4ec679f8a604d7802584cb47e0789947be78f92a4a07be30da1f6d0beb
- name: threatURL
  type: url
  description: Top-level link to the Threat Insight page for the message. Maps to `xdm.alert.description` only when `threatsInfoMap` is absent (clicks). Absent on benign and bec_impostor mail.
  example: https://tap-threatinsight.example/#/threat/email/Kq3vT8xZpL1mWc9RbNd2YfHs6AeUjG4o
- name: threatStatus
  type: enum
  description: Top-level threat state. Phantom emits only `active`; real TAP also reports `cleared` and `falsePositive`. Not mapped to xdm. Absent on benign mail.
  enum_values:
  - active
  - cleared
  - falsePositive
  example: active
- name: threatTime
  type: datetime
  description: When TAP identified the threat, ISO-8601 UTC. Click events only (equal to `clickTime`). Not mapped to xdm.
  example: '2026-10-01T10:31:07.482Z'
- name: campaignId
  type: string_short
  description: Proofpoint campaign id on click events (spelled `campaignId`, unlike `campaignID` inside `threatsInfoMap`). Not mapped to xdm.
  example: CMP-9181
- name: url
  type: url
  description: 'The malicious URL: on a threat message the URL found in the body, on a click the URL that was clicked. Maps to `xdm.target.url`. Absent on benign and bec_impostor mail.'
  example: https://credential-harvest.example/login?redirect=91b7584a
- name: userAgent
  type: string_long
  description: Browser or mail-client user agent of the click. Click events only. Maps to `xdm.source.user_agent`.
  example: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36
- name: clickIP
  type: ipv4
  description: 'IP address the click came from: the user''s own address (in the profile, their stable real Saudi home address), usable to pivot to proxy and endpoint telemetry. Click events only. Maps to `xdm.source.host.ipv4_addresses`.'
  example: 37.121.160.24
use_cases:
- Email
- SaaS
- Threat hunting
