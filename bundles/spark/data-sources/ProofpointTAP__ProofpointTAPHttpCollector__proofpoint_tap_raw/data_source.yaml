schema_version: 1
id: ProofpointTAP
pack_name: ProofpointTAP
rule_name: ProofpointTAPHttpCollector
dataset_name: proofpoint_tap_raw
vendor: Proofpoint
product: ProofpointTAP HTTP
description: 'Proofpoint Targeted Attack Protection (TAP) over an XSIAM HTTP Log Collector: JSON TAP SIEM API events (message-delivered, message-blocked, click-blocked, click-permitted) delivered by the http-sender connector instead of syslog/CEF. Use it to simulate phishing, malware-attachment, BEC and click-through chains that the ProofpointTAP pack parses and models into xdm.* email and alert fields.'
how_to_use: |
  **Use this source when the goal is Cortex Analytics alerts.** Analytics reads data that arrives with the source's identity, so send it with the `http-sender` connector: prefer the Cribl destination `cribl_proofpoint_tap` (the Proofpoint TAP source UUID) over the generic HTTP collector destination. The syslog/CEF Proofpoint TAP source is for checking parsing and modeling; do not wait for Analytics alerts from it. (The equivalent Okta comparison showed identical data alerting only over HTTP; this source has not been compared that way.)

  ## Proofpoint TAP over an XSIAM HTTP Log Collector (JSON)

  This is the **HTTP-delivery variant** of Proofpoint TAP. It documents how to simulate TAP SIEM API
  events as **JSON objects** posted to an XSIAM HTTP Log Collector by the `http-sender` connector.
  It is built for HTTP, not derived from the syslog/CEF source of the same product, so every field below
  is a real JSON key, and arrays (`messageParts`, `threatsInfoMap`, `fromAddress`, `recipient`,
  `ccAddresses`, ...) are native JSON arrays and objects, not CEF composites.

  **Do NOT use `phantom_create_data_worker`, syslog, CEF or a `schema_override` for this source.** That path
  sends CEF to the Cortex Broker's syslog port; it is the other data source (`ProofpointTAP`, rule
  `ProofpointTAPModelingRules`). Over HTTP the sender builds the JSON itself, the **collector** (configured in
  XSIAM, not by the sender) fixes vendor and product and therefore the dataset (`_vendor=Proofpoint`,
  `_product=Tap`, dataset `proofpoint_tap_raw`), and there is no
  broker, no `observables_dict` and no `is_gate` pinning. Both variants write the same dataset
  (`proofpoint_tap_raw`), so when verifying, filter on the GUIDs you sent.

  `is_gate` in `fields[]` means "the parsing or modeling rule keys on this field" (here the two time
  fields); its `example` is illustrative, so always send a current or deliberately back-dated timestamp.

  ### Prerequisites

  1. An `http-sender` connector instance with a destination named **`proofpoint_tap`** (dataset
     `proofpoint_tap_raw`). Check with `http-sender.list_destinations` and look for
     `{"destination": "proofpoint_tap", "dataset": "proofpoint_tap_raw", "ready": true}`. If it is missing,
     the operator must create an XSIAM HTTP Log Collector (Log Format JSON, Vendor `Proofpoint`, Product `Tap`) and
     add it to the instance as the primary or an additional destination; see the http-sender README. You cannot
     create it, and the collector key is never visible to you.
  2. The **ProofpointTAP content pack** installed on the tenant. Its
     parsing rule (`[INGEST:vendor="Proofpoint", product="Tap", target_dataset="proofpoint_tap_raw", no_hit=keep]`)
     sets `_time` from `messageTime`, falling back to `clickTime`; its modeling rule `ProofpointTAPModelingRules_1_3`
     maps the columns to `xdm.*`. Without the pack the dataset is raw-only and `_time` is the ingestion time.

  ### Quick start

  1. Prove the path with one sample event (a benign `message-delivered` mail):

  ```
  http-sender.send_test_event {"destination": "proofpoint_tap", "profile": "proofpoint_tap"}
  ```

     The result carries `test_id` (the event's `GUID`) and `verify_with_xql`. HTTP 200 only means the
     collector accepted the request; the row appears minutes later (see Timing).

  2. Preview a scenario without sending (`dry_run` returns the first 3 events), then send it:

  ```
  http-sender.generate_events {"profile": "proofpoint_tap", "scenario": "phishing_url", "count": 12,
    "target_user": "noura.alharbi", "source_ip": "217.138.128.45", "destination": "proofpoint_tap", "dry_run": true}
  http-sender.generate_events {"profile": "proofpoint_tap", "scenario": "phishing_url", "count": 12,
    "target_user": "noura.alharbi", "source_ip": "217.138.128.45", "destination": "proofpoint_tap"}
  ```

  ### Scenarios (`generate_events`, profile `proofpoint_tap`)

  | scenario | `_log_type` produced | When to use it |
  |---|---|---|
  | `benign_mail` | `message-delivered` | Baseline traffic. Business mail, about half with a clean attachment, about 30% with a Cc. Ignores `target_user` and `source_ip`. |
  | `phishing_url` | `message-blocked` | Phishing mail with a malicious URL, URL rewritten, quarantined in `Phish` (`phishScore` 80-100). `classification=PHISHING`, `threatType=URL`. |
  | `malware_attachment` | `message-blocked` | Malicious attachment (`.doc`, `.xlsm`, `.exe`, `.zip`, `.docm`) with `sandboxStatus=MALICIOUS`, quarantined in `Malware`. `classification=MALWARE`, `threatType=ATTACHMENT`, `threatID` = the attachment SHA-256. |
  | `credential_phishing` | `message-blocked` | Credential-harvesting mail, no reply-to, `phishScore` 90-100. Same shape as `phishing_url`. |
  | `bec_impostor` | `message-delivered` | CEO/CFO impersonation from a lookalike domain with a private reply-to, `impostorScore` 75-100. Delivered because it has no payload; `threatsInfoMap` is `[]`, no `url` or `threatID`; `classification=IMPOSTOR`. |
  | `click_chain` | `message-delivered`, then `click-blocked` / `click-permitted` | The user-clicked-a-bad-link shape. The first third of the events (at least one) are delivered phishing messages; the rest are clicks, alternating `click-blocked` then `click-permitted`. Click `j` belongs to message `j % messages` and repeats its GUID, `messageID`, recipient, sender, `url` and threat, so it correlates. Use `count >= 3` (12 gives 4 messages and 8 clicks); a single event is only the message. |

  Arguments:

  - `count` 1-5000 (default 20), `spread_seconds` (window width, default 120): events are spread oldest-first across the window.
  - `start_offset_minutes`: end the window that many minutes in the past (default 0). Use it to back-date; `_time` follows it only because the pack's parsing rule is installed.
  - `target_user`: the **recipient** of the attack scenarios, a bare name or email (default: a rotating pool of the active organization's people, e.g. `noura.alharbi@phantom.lab`; never `DOMAIN\user`). Clicks use the same recipient as their message.
  - `source_ip`: the **sending mail server** (`senderIP`) for the attack scenarios (default a random real out-of-country address). Ignored by `benign_mail`.
  - **Addresses are real, so Cortex can geo-resolve them** (it derives country and ASN from the IP, not from labels). Each benign sender has one stable address, drawn from a pool of real Saudi ISP ranges plus six out-of-country ones; every attack scenario defaults to one of twelve other out-of-country ranges, so an attacker is never a benign sender's address. A `click-*` event's `clickIP` is the recipient's own stable real Saudi home address, the same one that user has in the `okta` and `google_workspace` profiles. A `source_ip` outside the built-in pools is sent as given.
  - `destination`: use `proofpoint_tap`. A warning is returned for any other destination.

  For coverage, send one scenario per call: `phishing_url`, `malware_attachment`, `click_chain` and
  `benign_mail` cover every record kind.

  ### Sending custom TAP JSON (`send_events`)

  `send_events` posts the objects exactly as given: nothing is added, so include `_log_type` and a time field. Send
  real JSON types: arrays as arrays, `completelyRewritten` as a boolean, scores as numbers.

