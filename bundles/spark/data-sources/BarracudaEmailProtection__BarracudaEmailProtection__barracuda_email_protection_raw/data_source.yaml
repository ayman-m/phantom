how_to_use: |
  ## Barracuda BarracudaEmailProtection → Cortex XSIAM (dataset `barracuda_email_protection_raw`)

  **WIRE FORMAT -- use `type=RAW`, NOT CEF.** This source's modeling rule
  extracts its fields from `_raw_log`, the vendor's own log line. A CEF event's
  extensions become dataset COLUMNS and the broker leaves `_raw_log` EMPTY, so
  over CEF this rule maps NOTHING however the schema is shaped. Create the
  worker with `type=RAW`: the generator pins `_raw_log` to this schema's
  `_raw_log` example (or to an `observables_dict` override) and the sender ships
  that line syslog-framed, verbatim.

  **Routing for RAW.** A raw line carries no CEF header, so the broker cannot
  derive vendor/product from the wire, and a Broker syslog collector row must
  supply them. The local parsing-rule snapshot has no INGEST block for this
  pack, so the literal is UNCONFIRMED -- do not assume the display
  `vendor`/`product` fields are it (for the 75 sources where the literal IS
  known, all 75 differ from the display values). Confirm empirically that
  events land in `barracuda_email_protection_raw` and that `unknown_unknown_raw` did not grow.

    **Routing** — the broker lowercases the CEF/syslog header `vendor`/`product`, replaces
    non-alphanumerics with `_`, and appends `_raw` to choose the dataset (target: `barracuda_email_protection_raw`).

    **Required CEF header for XSIAM** — the header must normalize to `barracuda_email_protection`. The marketplace pack's display name `Barracuda` / `BarracudaEmailProtection` normalizes to `barracuda_barracudaemailprotection_raw`, a **different dataset** (vendor rename / legacy CEF identity), so use the vendor's actual CEF `deviceVendor`/`deviceProduct` that yields `barracuda_email_protection` and confirm which dataset the events land in.

    **Ingestion shape**: **JSON-native.** The modeling rule reads nested JSON (e.g. `payload -> dst_domain`). CEF/syslog routes + lands and the broker extracts top-level columns; the nested reads need the composite present, so Phantom's worker JSON-stringifies `type: json` composites onto the wire (keep the dotted-leaf fields).

    - **Modeling-rule gate**: none — the rule maps every routed row unconditionally.

    **XDM mapping**: ~11 fields mapped to the unified data model (`xdm.*`), including: `xdm.email.delivery_timestamp`, `xdm.email.message_id`, `xdm.email.recipients`, `xdm.email.sender`, `xdm.email.subject`, `xdm.event.description`.

    **Operator setup**: This data source uses `_raw_log`-based parsing. Cortex's parsing rule reads from `_raw_log` to populate `_json` (or directly to extract XDM fields), and the modeling rule does `regextract`/`json_extract_scalar` on `_raw_log`. For simulated logs sent from Phantom to land in this dataset, **the operator must add a Broker VM Syslog Applet pre-configured with the matching vendor + product + a dedicated source port**. Without that applet, logs are tagged `unknown/unknown` and routed to `unknown_unknown_raw` — the parsing rule never fires. 

  Setup: XSIAM → Settings → Configurations → Data Broker → Applets → Add Applet (Syslog) → Vendor = `Barracuda`, Product = `BarracudaEmailProtection`, Port = (operator picks an unused port, e.g. 1514, 1515, ...). Phantom must then send to that port — current default is 514, which is reserved for the ASA applet.

    **Status**: Routing, gate and field inventory are derived from the parsing/modeling rules. **Not yet XDM-validated** (no `validated` pill); validate by
    streaming a CEF batch and confirming a rich `xdm.*` count over a wide window.

    **Verify** (once the dataset is XDM-bound, wide ≥7d window):

        config timeframe = 30d | datamodel dataset = barracuda_email_protection_raw | sort desc _time | fields xdm.* | limit 20

  **How simulation works — read this before generating.** `phantom_create_data_worker`
  resolves each field's value in this order:

    1. `observables_dict[field]` — explicit; always wins. Values are LISTS.
    2. `is_gate` + `example` — gate fields are auto-pinned to their example.
    3. declared `type` — ipv4/user/url/datetime are synthesized plausibly.
    4. field-name heuristic.
    5. random token.

  **A field's `example` below is DOCUMENTATION ONLY unless that field is marked
  `is_gate`.** So every field the modeling rule reads expecting a specific SHAPE --
  an enum, an HTTP method, a status code, a resource path, a numeric type code, an
  XML or JSON blob -- MUST be passed in `observables_dict`, with keys spelled
  exactly as `fields[]` spells them (dotted leaves included, e.g.
  `event_data.param2`). Anything you leave out is randomly generated, and the rule
  will map it to garbage or drop the event.