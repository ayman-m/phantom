  #### Event 1644 — LDAP search (Active Directory enumeration)

  Targets `administrator-groups-enumerated-via-ldap`, one of only five UNGATED Windows detectors
  (T1087 Account Discovery, **Test Period: N/A — single event**).

  **This event does NOT use the named leaves.** The schema historically declared
  `event_data.SearchFilter` / `.ScopeOfSearch` / `.AttributeList`; the tenant's REAL 1644 rows use
  none of them. Verified against live rows — they carry numbered params:

  ```
  provider_name                    = Microsoft-Windows-ActiveDirectory_DomainService
  channel                          = (OMIT — real 1644 rows carry channel=None and clear the
                                      MODEL gate through provider_name alone)
  event_id                         = 1644
  event_data.param1                = DC=acme,DC=local                       <- search base DN
  event_data.param2                =  (&(objectClass=group)(cn=Domain Admins))   <- THE FILTER (leading space is real)
  event_data.param3                = 0
  event_data.param4                = 0
  event_data.param5                = 10.20.14.17:59300                     <- client as <ip>:<port>
  event_data.param6                = subtree
  event_data.param7                = member,sAMAccountName,objectSid,adminCount,memberOf,distinguishedName
  event_data.param9                = idx_objectClass:0:N;
  event_data.param17               = Acme\abdullah.alzahrani                <- the ACTOR
