schema_version: 1
id: MicrosoftWindowsEvents
pack_name: MicrosoftWindowsEvents
rule_name: MicrosoftWindowsEvents
dataset_name: microsoft_windows_raw
vendor: Microsoft
product: windows
description: 'Microsoft Windows Security-channel event logs (4624 logon, 4625 failed logon, 4672 special
  privileges, 4768/4769/4770 Kerberos TGT/TGS, 4771 pre-auth failure, 4728/4729 group membership, plus
  the PowerShell, TaskScheduler, Defender, Firewall and Active Directory provider paths). Delivered to
  Cortex XSIAM as CEF over syslog with header vendor=microsoft product=windows. Validated end to end:
  58 xdm fields populate and the user-to-machine binding lands (xdm.source.user.username +
  xdm.source.host.hostname + xdm.logon.type + xdm.event.operation=AUTH_LOGIN). The modeling rule reads
  33 of its fields by REGEX OVER THE `message` STRING, several with no other source, so the message body
  is load-bearing rather than decorative — see how_to_use for the per-event templates and the full gate
  set.'
