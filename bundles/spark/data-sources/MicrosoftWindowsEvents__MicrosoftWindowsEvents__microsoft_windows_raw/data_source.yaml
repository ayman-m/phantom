  ### 6. Free raw columns — one CEF extension each, one xdm field each

  Eight ungated raw columns are the SOLE source of an xdm field: no gate, no coalesce, no
  transform. Declaring them WITHOUT pinning is worse than omitting them, because the generator
  then invents the value. Pinning these took a verified run from 52 to 58 xdm fields.

  | column | -> | note |
  |---|---|---|
  | `event_result` | `xdm.event.outcome` | **exact lowercase `success` / `failure`**. "Success" or "Audit Success" falls through the coalesce and lands as an uncoerced raw string, breaking every datamodel filter on the enum |
  | `log_level` | `xdm.event.log_level` | only `information`/`error`/`warning`/`critical` resolve; the rule lowercases for you. On a non-enum value the else-branch returns `opcode` FIRST, so a stray opcode publishes as the log level |
  | `record_id` | `xdm.session_context_id` | Windows EventRecordID, numeric, unique per event |
  | `activity_id` | `xdm.alert.original_alert_id` | the only unconditional `xdm.alert.*` in the rule |
  | `provider_guid` | `xdm.observer.unique_identifier` | |
  | `process_pid` | `xdm.source.process.pid` | **decimal only** — `to_integer()` cannot parse the `0x1e8` form real Windows emits. Hex in the message, decimal in the column |
  | `process_thread_id` | `xdm.source.process.thread_id` | |
  | `os_subtype` | `xdm.source.host.os` | |

  **`event_action` is a poison pill — never send it.** It is arm 1 of
  `event_type = coalesce(event_action, canonical_task, to_string(task), check_message_task,
  event_name)` and nothing overwrites it, so sending it destroys the canonical_task taxonomy and
  `xdm.event.original_event_type` stops resolving to "Logon" / "Special Logon".

  ### 7. Traps that produce a plausible WRONG result

  **Pin every member of a coalesce, not just the one you want to win.** The generator synthesises
  any DECLARED field left unpinned, and a synthesised value EARLIER in the chain beats the real one
  behind it:

  ```
  user_sid = coalesce(event_data -> SID, event_data -> SubjectUserSid, user -> identifier, ...)
       pinning only SubjectUserSid  ->  xdm.source.user.identifier = "hL42dIss"
  xdm.source.host.fqdn = coalesce(event_data -> FQDN, event_data -> WorkstationName)
       pinning only WorkstationName ->  xdm.source.host.fqdn = "host-a"
  ```

  **Declare the SMALLEST field set that works.** Declaring all 126 fields dragged synthesised noise
  into what should read as a Windows logon — target geography in Bulgaria,
  `xdm.target.file.path = /usr/bin/curl`, an OVH ASN. The per-event sets in §5 (27-42 fields) fix
  it. Logon-only fields (`LogonType`, `AuthenticationPackageName`, `LogonProcessName`,
  `ElevatedToken`, `Status`) must be DROPPED for Kerberos event IDs, or `xdm.logon.type` falls
  through the rule's if-chain to the raw synthesised string.

  **A higher field count can mean a worse result.** The full-schema run scored 77 xdm fields; the
  correct minimal run scores 58. The extra 19 were noise. Never use field count alone as the
  quality signal — scan 25 rows for values that look generated (8-char mixed-case tokens,
  geography that does not belong, file paths from the wrong OS).

  **Bind identity per record.** The message embeds the user and host, so it CANNOT vary
  independently of them. Render the message INSIDE the per-identity entity group alongside that
  identity's `event_data` leaves. Passing them as parallel lists produces a cartesian smear where
  the prose contradicts the structured fields.

  **Verifying a re-run: do NOT `sort desc _time`.** Back-dated events from every run share the same
  30-day window, so recency by `_time` says nothing about which run a row came from, and a fixed
  run reads as still-broken because the query keeps returning old rows. Discriminate on a value
  unique to the run (a pinned `process_pid`, a `record_id` range). The mirror-image trap: filtering
  on `provider_guid` set to the GENUINE Microsoft GUID also matches the tenant's REAL XDR agent
  events, so a query can return rows that your synthetic run did not send.

  ### 8. Back-dating

  `time_created`, ISO-8601 with literal `T` and `Z`. The parsing rule parses `%FT%H:%M:%E*SZ` and
  sets `_time` to the **EARLIEST** of (`time_created`, `_insert_time`, `_time`), so a past value
  wins. A space-separated or `+00:00`-offset form passes the L2 regex but NULLS the parse.

  An epoch integer does NOT work on this field — that is the CEF `rt` lever, which is a different
  mechanism (the broker consumes `rt` during generic extraction on sources with no parsing rule).
  Verified span here: 30.0 days from one run, which clears both the 14-day activation and 30-day
  training windows in a single pass.

  ### 9. What this dataset CANNOT do

  The rule emits **no `EVENT_TAG_AUTHENTICATION`** and **no `xdm.source.user.upn`**. Cortex
  documents both as mandatory for building an authentication story, so this dataset does not
  produce one and cannot populate `auth_identity` — regardless of licensing or tenant settings.
  `xdm.event.tags` is filled with `arraycreate(execution_name)`, never the auth tag.

  That does NOT prevent: full XDM normalization, XQL hunting, dashboards, and **correlation rules**,
  which fire deterministically with no story, no detection module and no training period. For a POV
  under time pressure the correlation-rule surface is the reliable one.

  For an authentication story over CEF, use a source whose rule emits the tag and the UPN — of the
  ten in this bundle that do, Duo is the validated one.

  ## Delivery over a real Windows Event Collector

  Over syslog/CEF the broker stamps `_collector_type = Syslog`. A real delivery to the Broker VM's Windows
  Event Collector applet (the `wec-sender` connector, mutual TLS on 5986) stamps `WEC`, lands in
  `microsoft_windows_raw` about 7 s later, and also creates `xdr_data` rows keyed by `agent_hostname` = the
  event's Computer (`EVENT_LOG` / `EVENT_LOG_DOMAIN_CONTROLLER`; a 4624 also yields a PANW Fusion
  `LOGIN_EVENT`). Detectors catalogued as "Windows Event Collector" read this path.

  What the applet maps from the event XML: `_time` = `System/TimeCreated` (back-dating works, a 5-day-old
  event kept its time); `event_id`, `provider_name`, `provider_guid`, `computer_name`, `channel`, `record_id`
  come from `System`; `event_action` = the rendered `Task` text; `message` and `log_level` come from
  `RenderingInfo`; `event_result` is `failure` when the rendered Keywords say "Audit Failure", else `success`;
  `event_data` is a JSON object of the `Data` nodes (named by `Name`, unnamed ones become `param1..paramN`).
  So the sender must render real strings, not placeholders. A 4624 models 48 `xdm.*` fields and a 4625
  gave `xdm.event.outcome = FAILED`.

  The applet does not filter by its subscription's event-id list (4688 and an LDAP-Client event landed).
  Provider routing still applies: a Sysmon-provider event did not reach `microsoft_windows_raw` and
  `microsoft_sysmon_raw` does not exist on the tenant until that pack is installed.

  This is the sanctioned WEC exception to syslog/CEF delivery. Syslog/CEF stays the way to validate this
  source's mapping.
