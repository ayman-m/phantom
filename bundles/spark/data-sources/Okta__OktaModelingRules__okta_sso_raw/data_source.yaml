fields:
- name: actor
  type: json
  description: '— see leaf entries for nested paths. JSON object with keys: alternateId, displayName,
    id, type (each key defined as a dotted-path leaf below).'
  example: '{"id":"00u1ab2c3d","type":"User","alternateId":"alice@example.com"}'
- name: authenticationContext
  type: json
  description: '— see leaf entries for nested paths. JSON object with keys: authenticationProvider (each
    key defined as a dotted-path leaf below).'
  example: '{"key":"value"}'
- name: client
  type: json
  description: '— see leaf entries for nested paths. JSON object with keys: device, geographicalContext,
    id, ipAddress, userAgent, zone (each key defined as a dotted-path leaf below).'
  example: '{"id":"web","userAgent":{"rawUserAgent":"Mozilla/5.0"},"ipAddress":"203.0.113.42"}'
- name: debugContext
  type: json
  description: '— see leaf entries for nested paths. JSON object with keys: debugData (each key defined
    as a dotted-path leaf below).'
  example: '{"key":"value"}'
- name: displayMessage
  type: string
  description: Vendor-emitted field 'DisplayMessage'. Free-form text; may contain whitespace and punctuation.
  example: operator-visible value
- name: eventType
  type: string
  description: Modeling-rule GATE — must equal "user.authentication.sso" (an enumerated SSO member; any
    of the ~350 enumerated members clears the gate) for XDM to map, and is the PR discriminator that routes
    into okta_sso_raw. Event type or category as the vendor classifies it. Free-form text; may contain
    whitespace and punctuation.
  example: user.authentication.sso
- name: legacyEventType
  type: string
  description: Event type or category as the vendor classifies it. Free-form text; may contain whitespace
    and punctuation.
  example: AuditEvent
- name: outcome
  type: json
  description: '— see leaf entries for nested paths. JSON object with keys: reason, result (each key defined
    as a dotted-path leaf below).'
  example: '{"key":"value"}'
- name: published
  type: datetime
  description: Vendor-emitted field 'Published'. ISO-8601 timestamp with timezone (e.g., 2026-05-26T14:23:01Z).
  example: '2026-05-26T14:23:01Z'
- name: request
  type: json
  description: '— see leaf entries for nested paths. JSON array; each element is an object with keys:
    ipChain (each key defined as a dotted-path leaf below).'
  example: '{"key":"value"}'
- name: securityContext
  type: json
  description: '— see leaf entries for nested paths. JSON object with keys: asNumber, asOrg, domain, isProxy,
    isp (each key defined as a dotted-path leaf below).'
  example: '{"key":"value"}'
- name: severity
  type: string
  description: Event severity as classified by the vendor. Free-form text; may contain whitespace and
    punctuation.
  example: INFO
- name: target
  type: string
  description: Event target (user/group/app affected). Free-form text; may contain whitespace and punctuation.
  example: target_object
- name: transaction
  type: json
  description: '— see leaf entries for nested paths. JSON object with keys: detail, id, type (each key
    defined as a dotted-path leaf below).'
  example: '{"key":"value"}'
- name: uuid
  type: string_short
  description: Unique identifier — assigned by Okta per event. Short opaque token, typically without whitespace;
    max ~64 chars.
  example: c3133c87-6e9f-56db-96ef-4f1b2bed8fff
- name: actor.alternateId
  type: string
  description: Vendor-emitted field 'Actor › alternateId'. Leaf of the 'actor' composite. Free-form text;
    may contain whitespace and punctuation.
  example: 00u1ab2c3d4e5f6
- name: actor.displayName
  type: string
  description: Vendor-emitted field 'Actor › displayName'. Leaf of the 'actor' composite. Free-form text;
    may contain whitespace and punctuation.
  example: John Doe
- name: actor.id
  type: string_short
  description: Opaque identifier emitted by Okta. Short opaque token, typically without whitespace; max
    ~64 chars.
  example: okt-b710826f
- name: actor.type
  type: string_short
  description: Type/category classifier emitted by Okta. Short opaque token, typically without whitespace;
    max ~64 chars.
  example: authentication
- name: authenticationContext.authenticationProvider.credentialProvider
  type: string
  description: Vendor-emitted field 'AuthenticationContext › authenticationProvider › credentialProvider'.
    Leaf of the 'authenticationContext' composite. Free-form text; may contain whitespace and punctuation.
  example: 00u1ab2c3d4e5f6
- name: authenticationContext.authenticationProvider.credentialType
  type: string
  description: Vendor-emitted field 'AuthenticationContext › authenticationProvider › credentialType'.
    Leaf of the 'authenticationContext' composite. Free-form text; may contain whitespace and punctuation.
  example: AuditEvent
- name: authenticationContext.authenticationProvider.externalSessionId
  type: string
  description: Vendor-emitted field 'AuthenticationContext › authenticationProvider › externalSessionId'.
    Leaf of the 'authenticationContext' composite. Free-form text; may contain whitespace and punctuation.
  example: sess-0e7c3ce6-354
- name: client.device
  type: string
  description: Vendor-emitted field 'Client › device'. Leaf of the 'client' composite. Free-form text;
    may contain whitespace and punctuation.
  example: host-prod-01
- name: client.geographicalContext.city
  type: string
  description: Vendor-emitted field 'Client › geographicalContext › city'. Leaf of the 'client' composite.
    Free-form text; may contain whitespace and punctuation.
  example: San Francisco
- name: client.geographicalContext.country
  type: country_code
  description: Country (ISO 3166-1 alpha-2 code or descriptive label). ISO 3166-1 alpha-2 uppercase country
    code (e.g., US, DE, JP).
  example: US
- name: client.geographicalContext.geolocation.lat
  type: string
  description: Vendor-emitted field 'Client › geographicalContext › geolocation › lat'. Leaf of the 'client'
    composite. Free-form text; may contain whitespace and punctuation.
  example: '37.7749'
- name: client.geographicalContext.geolocation.lon
  type: string
  description: Vendor-emitted field 'Client › geographicalContext › geolocation › lon'. Leaf of the 'client'
    composite. Free-form text; may contain whitespace and punctuation.
  example: '-122.4194'
- name: client.geographicalContext.state
  type: string
  description: Vendor-emitted field 'Client › geographicalContext › state'. Leaf of the 'client' composite.
    Free-form text; may contain whitespace and punctuation.
  example: CA
- name: client.id
  type: string_short
  description: Opaque identifier emitted by Okta. Short opaque token, typically without whitespace; max
    ~64 chars.
  example: okt-a95ae98d
- name: client.ipAddress
  type: ipv4
  description: Vendor-emitted field 'Client › ipAddress'. Leaf of the 'client' composite. Free-form text;
    may contain whitespace and punctuation.
  example: 192.0.2.45
- name: client.userAgent.browser
  type: string
  description: Vendor-emitted field 'Client › userAgent › browser'. Leaf of the 'client' composite. Free-form
    text; may contain whitespace and punctuation.
  example: Chrome 124.0.6367.155
- name: client.userAgent.os
  type: string
  description: Vendor-emitted field 'Client › userAgent › os'. Leaf of the 'client' composite. Free-form
    text; may contain whitespace and punctuation.
  example: Linux
- name: client.userAgent.rawUserAgent
  type: string
  description: Vendor-emitted field 'Client › userAgent › rawUserAgent'. Leaf of the 'client' composite.
    Free-form text; may contain whitespace and punctuation.
  example: operator-visible value
- name: client.zone
  type: string
  description: Vendor-emitted field 'Client › zone'. Leaf of the 'client' composite. Free-form text; may
    contain whitespace and punctuation.
  example: us-east-1a
- name: debugContext.debugData.deviceFingerprint
  type: string
  description: Vendor-emitted field 'DebugContext › debugData › deviceFingerprint'. Leaf of the 'debugContext'
    composite. Free-form text; may contain whitespace and punctuation.
  example: host-prod-01
- name: debugContext.debugData.factor
  type: string
  description: Vendor-emitted field 'DebugContext › debugData › factor'. Leaf of the 'debugContext' composite.
    Free-form text; may contain whitespace and punctuation.
  example: operator-visible value
- name: debugContext.debugData.origin
  type: string
  description: Vendor-emitted field 'DebugContext › debugData › origin'. Leaf of the 'debugContext' composite.
    Free-form text; may contain whitespace and punctuation.
  example: operator-visible value
- name: debugContext.debugData.proxyType
  type: string
  description: Vendor-emitted field 'DebugContext › debugData › proxyType'. Leaf of the 'debugContext'
    composite. Free-form text; may contain whitespace and punctuation.
  example: AuditEvent
- name: debugContext.debugData.threatDetections
  type: string
  description: Vendor-emitted field 'DebugContext › debugData › threatDetections'. Leaf of the 'debugContext'
    composite. Free-form text; may contain whitespace and punctuation.
  example: operator-visible value
- name: debugContext.debugData.url
  type: url
  description: Full URL with scheme — as Okta captured it. Full URL with scheme (http/https/ftp); percent-encoded
    if non-ASCII.
  example: https://example.com/path
- name: outcome.reason
  type: string
  description: Reason/explanation accompanying the action or outcome. Free-form text; may contain whitespace
    and punctuation.
  example: normal_operation
- name: outcome.result
  type: string_short
  description: Result string emitted by Okta. Short opaque token, typically without whitespace; max ~64
    chars.
  example: success
- name: request.ipChain
  type: json
  is_array: true
  description: — see leaf entries for per-element fields. JSON object or array; structured payload — see
    dotted-path leaves below for full shape.
  example: '{"key":"value"}'
- name: request.ipChain[].ip
  type: ipv4
  description: Vendor-emitted field 'Request › ipChain[] › ip'. Leaf of the 'request' composite. Free-form
    text; may contain whitespace and punctuation.
  example: 192.0.2.45
- name: securityContext.asNumber
  type: string
  description: Vendor-emitted field 'SecurityContext › asNumber'. Leaf of the 'securityContext' composite.
    Free-form text; may contain whitespace and punctuation.
  example: operator-visible value
- name: securityContext.asOrg
  type: string
  description: Vendor-emitted field 'SecurityContext › asOrg'. Leaf of the 'securityContext' composite.
    Free-form text; may contain whitespace and punctuation.
  example: tenant-acme-prod
- name: securityContext.domain
  type: domain
  description: DNS domain reported by Okta — bare domain, no scheme/path/port. Bare DNS domain name; no
    scheme, no path, no port.
  example: example.com
- name: securityContext.isProxy
  type: string
  description: Vendor-emitted field 'SecurityContext › isProxy'. Leaf of the 'securityContext' composite.
    Free-form text; may contain whitespace and punctuation.
  example: operator-visible value
- name: securityContext.isp
  type: string
  description: Vendor-emitted field 'SecurityContext › isp'. Leaf of the 'securityContext' composite.
    Free-form text; may contain whitespace and punctuation.
  example: operator-visible value
- name: transaction.detail.requestApiTokenId
  type: string
  description: Vendor-emitted field 'Transaction › detail › requestApiTokenId'. Leaf of the 'transaction'
    composite. Free-form text; may contain whitespace and punctuation.
  example: create
- name: transaction.id
  type: string_short
  description: Opaque identifier emitted by Okta. Short opaque token, typically without whitespace; max
    ~64 chars.
  example: okt-323fe8a6
- name: transaction.type
  type: string_short
  description: Type/category classifier emitted by Okta. Short opaque token, typically without whitespace;
    max ~64 chars.
  example: authentication
