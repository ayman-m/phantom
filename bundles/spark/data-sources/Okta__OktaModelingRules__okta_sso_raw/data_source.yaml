schema_version: 1
id: Okta
pack_name: Okta
rule_name: OktaModelingRules
dataset_name: okta_sso_raw
vendor: Okta
product: Okta
description: The Okta SSO stream (`okta_sso_raw`) is a subset of the primary Okta feed scoped to single-sign-on
  authentication events — typically `eventType=user.authentication.sso` rows describing a user's successful
  or failed federation into a downstream SaaS application. These rows carry the target SAML/OIDC application
  id, the IdP-side session context, and the authentication method. Simulate this to validate detections
  that correlate SSO usage with downstream application telemetry.
how_to_use: |
  ## Analytics: read this before you simulate

  This is the **syslog/CEF** Okta source. Use it to check **parsing and modeling**: events land in `okta_sso_raw` and fill the `xdm.*` fields.

  **Do not expect Cortex Analytics alerts from it.** Cortex collects Okta with its own Okta API collector (not an HTTP collector), and Analytics reads data that arrives with that source's identity. `http-sender` reproduces that through the Cribl integration with the Okta SSO source UUID (destination `cribl_okta_sso`; native collector type, stories and 25 detectors) or, for FastPass only, through the generic HTTP collector. The same Okta FastPass event lands in `okta_sso_raw` over both paths with the same columns, parsing result and 58 `xdm.*` fields, yet it raises an Analytics alert (typically within a minute) only through the HTTP collector and none over CEF, escaped correctly or not. The reason is not established (the collector-type stamp and the collector being a registered Okta source both fit).

  **To test Analytics, use the HTTP data source (`delivery: http`, product `Okta HTTP`) with the `http-sender` connector.** Its guide has the destinations, profiles and scenarios.

  ## Sending these logs to Cortex XSIAM

  Phantom emits this vendor's wire format as CEF over UDP — point a data worker
  at your XSIAM broker's syslog destination and these records flow straight in.
  The schema below describes the vendor's fields independent of destination, so
  the same records also work for Splunk, Elastic, or any syslog receiver.

  The CEF header's **vendor** + **product** drive XSIAM's parsing-rule routing:
  the broker normalizes them to `<lowercased-vendor>_<lowercased-product>_raw`
  (non-alphanumerics -> `_`) and matches your installed parsing rule. The PR/MR
  rules read NAMED COLUMNS, so the transport is invisible to them — pack the
  vendor's field names as CEF extension `key=value` pairs.

  **Required CEF header for XSIAM**:

  - **vendor**: `Okta`
  - **product**: `Okta`

  Broker derives → `okta_okta_raw`.

  Same broker route as `okta_okta_raw` — the operator's PR splits them by reading the `eventType` raw field. For events to land in `okta_sso_raw`, set `eventType` to an SSO event: `user.authentication.sso` or `user.session.start`. Without this discriminator value, events fall through to the general `okta_okta_raw` dataset.

  **MR pattern**: Nested-JSON. Same MR family as okta_okta_raw but selectively MODELed to the SSO dataset — events with `eventType` starting `user.session.*` or `user.authentication.sso` route here.

  **Composite (nested-JSON) fields**: Same as okta_okta_raw: pack `actor`, `client`, `outcome`, `target`, `authenticationContext` as JSON-string CEF extensions. The PR's discriminator is `eventType` — must contain `sso` substring or `session.start` for the SSO route.

  **Sentinel values**: None.

  **PR filter quirks**: Set `eventType=user.authentication.sso` or `eventType=user.session.start` to route into this dataset instead of `okta_okta_raw`.

  **Saturation strategy**: Same as okta_okta_raw — 2-event split for nested-JSON XDM > 10.

  **Single-event XDM ceiling**: ~10 XDM (nested-JSON ceiling).

  **Verify**:

  ```xql
  datamodel dataset = okta_sso_raw
  | filter xdm.event.id contains "<your-marker>"
  | fields xdm.*
  | limit 1
  ```

  ### Make it map to XDM

  The Okta modeling rule only runs when `eventType` is one of its ~350 enumerated members. When simulating, pass `observables_dict={"eventType": "user.authentication.sso"}` to `phantom_create_data_worker` — `user.authentication.sso` is an enumerated SSO member of the rule's Auth-model `eventType in (...)` gate AND the PR discriminator that routes the event into the `okta_sso_raw` dataset. The rule then populates core XDM: `xdm.auth.logon.type` <- `eventType`, `xdm.auth.client.ipv4` <- `client.ipAddress`, `xdm.auth.client.host.device_id` <- `client.id`, `xdm.auth.client.location.city` <- `client.geographicalContext.city`, `xdm.auth.client.location.country` <- `client.geographicalContext.country`, `xdm.auth.session_id` <- `authenticationContext.externalSessionId`, `xdm.auth.outcome` <- `outcome.result`, and `xdm.auth.reason` <- `outcome.reason`. (Any other enumerated member, e.g. `user.session.start`, also clears the gate; pick an SSO/session member to land in `okta_sso_raw`.)

  **How simulation works — read this before generating.** `phantom_create_data_worker`
  resolves each field's value in this order:

    1. `observables_dict[field]` — explicit; always wins. Values are LISTS.
    2. `is_gate` + `example` — gate fields are auto-pinned to their example.
    3. declared `type` — ipv4/user/url/datetime are synthesized plausibly.
    4. field-name heuristic.
    5. random token.

  **A field's `example` below is DOCUMENTATION ONLY unless that field is marked
  `is_gate`.** So every field the modeling rule reads expecting a specific SHAPE --
  an enum, an HTTP method, a status code, a resource path, a numeric type code, an
  XML or JSON blob -- MUST be passed in `observables_dict`, with keys spelled
  exactly as `fields[]` spells them (dotted leaves included, e.g.
  `event_data.param2`). Anything you leave out is randomly generated, and the rule
  will map it to garbage or drop the event.
