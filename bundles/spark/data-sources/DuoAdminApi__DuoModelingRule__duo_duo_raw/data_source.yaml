  \ long literal ladders. A value outside a ladder does not error — it falls\nthrough and the mapped field\
  \ silently disappears or passes through raw.\n\n- **`factor`** -> `xdm.auth.mfa.method` verbatim, AND\
  \ `establish_factor` ->\n  `xdm.event.operation_sub_type`, bucketing into voice / sms / application\
  \ / hardware_token /\n  trusted_login / Generic SSO. Unmapped -> null.\n- **`reason`** -> `establish_reason`\
  \ -> `xdm.event.outcome_reason`. Unmapped values fall\n  through to `to_string(reason)` and pass as-is.\
  \ It ALSO decides\n  `xdm.event.operation`: `remembered_device` / `trusted_network` /\n  `authentication_trusted_by_risk_based_remembered_devices`\
  \ -> `\"Login\"`, everything else\n  -> `\"MFA\"`.\n- **`result`** -> `xdm.event.outcome`. `success`\
  \ -> SUCCESS; `failure` / `denied` / `fraud`\n  -> FAILED. `fraud` additionally sets `xdm.alert.risks=['risky_signin']`,\
  \ as do the reasons\n  `location_restricted`, `anomalous_push` and `anonymous_ip`.\n\n### 7. Traps\n\n**`access_device.ip = \"0.0.0.0\"` nulls three fields.** The rule reads it as 'no\
  \ real client'\nand blanks `xdm.event.type`, `xdm.source.port` and `xdm.target.port`. Never send it.\n\
  \n**`_id` cannot be seeded.** The rule assigns `xdm.event.id = _id`, but `_id` is ingestion\nmeta —\
  \ the broker stamps it (`/YhDF6WRU2jswETWc6QARA==:0:95:197`) and overwrites anything\nsent. A pinned `_id` does not survive while `txid` on the same event does.\nUnderscore-prefixed\
  \ columns are broker-owned across every source.\n\n**`user.groups` cannot produce a clean array.** The\
  \ rule reads it with the array accessor\n`user -> groups[]`, but the generator serialises every dotted\
  \ leaf as a JSON STRING, so `[]`\nwraps that quoted string. Both a comma-joined value and a JSON array\
  \ literal both come back as `['\"...\"']`. Send a single group name for the least-wrong\
  \ result; a\ntrue multi-value array is not reachable over this path.\n\n**`email` must be `first.last@domain`.**\
  \ The rule splits it to derive\n`xdm.source.user.first_name` / `.last_name`. Any other local-part shape\
  \ produces wrong names.\nThe derived names come out LOWERCASE — that is the rule, not a defect.\n\n\
  **Declare the smallest field set that works.** 33 fields cover the whole authentication\nblock. Declaring\
  \ all 51 drags the administrator- and telephony-only columns into an\nauthentication event, where the\
  \ generator synthesises them as noise.\n\n### 8. What this source unlocks that Windows cannot\n\n`microsoft_windows_raw`\
  \ maps 11 of the 12 fields Cortex documents as mandatory for an\nauthentication story but emits neither\
  \ `EVENT_TAG_AUTHENTICATION` nor `xdm.source.user.upn`,\nso it can never populate `auth_identity`. Duo\
  \ emits both. Of the ten modeling rules in this\nbundle that carry the authentication tag, **Duo is the validated one** —\nthe other nine have no dataset unless their packs are installed.\n\nCaveat worth stating plainly: emitting a correct authentication story is NOT sufficient\
  \ for\nIdentity Analytics detectors to fire. Those are gated on a Cloud Identity Engine directory\n\
  pairing that populates `pan_dss_raw` (empty unless a real directory is paired, and not seedable).\nConsequence: Duo maps all 12 mandatory fields and still fires none of its 21 detectors.\nWhat this data\
  \ reliably supports is XDM normalization, XQL hunting, dashboards, the\nauthentication story itself,\
  \ and correlation rules — which need no module and no training."
