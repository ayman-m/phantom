fields:
- name: date
  type: string
  description: 'Date in MM/dd/yy. The parsing rule FILTERS on this (`date ~= "\d{2}/\d{2}/\d{2}"`) and concatenates date + time + timezone to derive _time. Omit it and the filter misses; no_hit=keep still lands the row, but _time is null and Cortex raises a HEALTH `Parsing Rule Error`.'
  example: '09/06/26'
- name: time
  type: string
  description: 'Time in hh:mm:ss. Second member of the _time concatenation; the parsing rule filters on it too.'
  example: '10:24:07'
- name: timezone
  type: string
  description: 'UTC offset as [+|-]nn:nn. Third member of the _time concatenation and also filtered. NOT listed in Microsoft''s documented DHCP audit fields — Filebeat adds it — so it is easy to miss when building the schema from the vendor doc alone.'
  example: '+03:00'
- name: probationTime
  type: string
  description: 'NAP probation expiry (Windows Server 2008+).'
  example: '0'
- name: correlationID
  type: string
  description: 'NAP correlation id (Windows Server 2008+).'
  example: ''
- name: dhcid
  type: string
  description: 'DHCID record used for DNS record ownership (Windows Server 2012+).'
  example: '0032D1A9…'
- name: vendorClassHex
  type: string
  description: 'Vendor class, hex (2012+).'
  example: '4D53465420352E30'
- name: vendorClassASCII
  type: string
  description: 'Vendor class, ASCII (2012+).'
  example: 'MSFT 5.0'
- name: userClassHex
  type: string
  description: 'User class, hex (2012+).'
  example: '52525300'
- name: userClassASCII
  type: string
  description: 'User class, ASCII (2012+).'
  example: 'RRAS.Microsoft'
- name: relayAgentInformation
  type: string
  description: 'DHCP relay agent option 82 data (2012+).'
  example: '0108000600235409ba2c'
- name: dnsRegError
  type: string
  description: 'DNS dynamic-registration error code (2012+). 0 = success.'
  example: '0'
- name: description
  type: string_long
  description: Free-form human-readable description from Microsoft. Free-form text;
    may span multiple lines or contain large payloads.
  example: Event recorded by Microsoft.
- name: fb_host
  type: json
  description: '— see leaf entries for nested paths. JSON object with keys: hostname
    (each key defined as a dotted-path leaf below).'
  example: '{}'
- name: hostName
  type: host
  description: Human-readable name as displayed by Microsoft. Hostname or fully-qualified
    domain name (RFC 1035 dotted labels); no protocol prefix.
  example: host.example.com
- name: id
  type: string_short
  description: Opaque identifier emitted by Microsoft. Short opaque token, typically
    without whitespace; max ~64 chars.
  example: mic-41d464cd
- name: ipAddress
  type: ipv4
  description: IPv4/IPv6 address — vendor-emitted, no version split. Dotted-quad IPv4
    literal (e.g., 192.0.2.45); no port suffix, no surrounding brackets or quotes.
  example: 203.0.113.42
- name: macAddress
  type: string
  description: 'Client MAC address as Windows DHCP writes it: 12 hex digits, NO separators. Maps to xdm.source.host.mac_addresses. Was typed ipv4 with the example 192.0.2.45, which put an IP address into the MAC field on every event.'
  example: '001A2B3C4D5E'
- name: qResult
  type: string
  description: Vendor-emitted field 'QResult'. Free-form text; may contain whitespace
    and punctuation.
  example: sample_qresult
- name: transactionID
  type: string_short
  description: Unique identifier — assigned by Microsoft per event. Short opaque token,
    typically without whitespace; max ~64 chars.
  example: token_value
- name: userName
  type: user
  description: User account associated with the event. Account name as the vendor
    reports it — login name, UPN, or sAMAccountName depending on the source; no domain
    prefix unless the vendor emits one.
  example: jsmith
- name: fb_host.hostname
  type: host
  description: Hostname or FQDN as reported by Microsoft. Hostname or fully-qualified
    domain name (RFC 1035 dotted labels); no protocol prefix.
  example: host.example.com
