how_to_use: |
  **Required CEF header for XSIAM:**

  - vendor: `microsoft`
  - product: `DHCP`

  The pack's parsing rule claims that pair explicitly
  (`[INGEST:vendor="microsoft", product="DHCP", target_dataset="microsoft_dhcp_raw", no_hit=keep]`),
  and it also derives cleanly, so either path reaches the dataset.

  **_time comes from THREE fields, and all three are filtered.** The parsing rule is:

      filter date ~= "\d{2}/\d{2}/\d{2}" and time ~= "\d{2}:\d{2}:\d{2}.*"
             and `timezone` ~= "[\+|-]\d{2}:?\d{2}"
      | alter tmp_time = concat(date, " ", time, " ", `timezone`)
      | alter _time = parse_timestamp("%D %X %Ez", tmp_time)

  Send `date` (MM/dd/yy), `time` (hh:mm:ss) and `timezone` ([+|-]nn:nn) together or none of them
  work. Because `no_hit=keep`, a missing one does NOT drop the event -- it lands with a null
  `_time`, which Cortex reports as a HEALTH `Parsing Rule Error` rather than anything visible in
  the dataset. Note `timezone` is NOT in Microsoft's documented DHCP audit field list (Filebeat
  adds it), so a schema built from the vendor doc alone will miss it.

  **Real-world collection is Elasticsearch Filebeat** (XDR Collector Windows Filebeat profile /
  Windows DHCP Collector) -- not Broker syslog and not the Windows Event Collector. That is
  irrelevant to us: the parsing and modeling rules key on the DATA SHAPE, so the same CSV-derived
  columns delivered as CEF over syslog parse identically. Do not read the Filebeat requirement as
  a blocker.

  **Analytics expectation -- read before promising anything.** DHCP is NOT one of the 34
  alerts-by-data-source families, and only two detectors in the whole corpus mention DHCP
  (`possible-new-dhcp-server`, `uncommon-ip-configuration-listing-via-ipconfig`); BOTH require the
  XDR Agent. So this source yields **zero** out-of-the-box analytics from a log feed. Its value is
  XDM enrichment and correlation: DHCP is the canonical way to resolve which host/MAC/user held an
  IP at a point in time, which enriches every other IP-based detection.

  ## microsoft DHCP → Cortex XSIAM (dataset `microsoft_dhcp_raw`)

    **Routing** — the broker lowercases the CEF/syslog header `vendor`/`product`, replaces
    non-alphanumerics with `_`, and appends `_raw` to choose the dataset (target: `microsoft_dhcp_raw`).

    **Required CEF header for XSIAM**:
    - **vendor**: `microsoft`
    - **product**: `DHCP`

    These normalize → `microsoft_dhcp_raw`.

    **Ingestion shape**: **JSON-native.** The modeling rule reads nested JSON (e.g. `$.hostname`). CEF/syslog routes + lands and the broker extracts top-level columns; the nested reads need the composite present, so Phantom's worker JSON-stringifies `type: json` composites onto the wire (keep the dotted-leaf fields).

    - **Modeling-rule gate**: none — the rule maps every routed row unconditionally.

    **XDM mapping**: ~12 fields mapped to the unified data model (`xdm.*`), including: `xdm.event.description`, `xdm.event.operation_sub_type`, `xdm.event.outcome`, `xdm.event.outcome_reason`, `xdm.session_context_id`, `xdm.source.host.hostname`.

    **Operator setup**: This data source has typed-column data that does not look like CEF
    (camelCase API fields, JSON sub-objects). In production the vendor is usually collected
    over an HTTP/API path -- that is IRRELEVANT to Phantom. Parsing and modeling rules are
    protocol-agnostic: they match on the DATA SHAPE (field names, JSON paths, value types), not
    on how the event arrived. Phantom always delivers over syslog/CEF to the Cortex Broker and
    never uses an HTTP collector or an API integration. For a JSON-shaped rule, declare the
    composite's dotted-leaf fields (`parent.child.leaf`) in `fields[]` so the generator builds
    the nested object -- nested JSON survives CEF-over-syslog intact, XML payloads included. If
    a rule reads `json_extract_scalar(x, "$.y")` then `x` must be a JSON OBJECT on the wire,
    not a flat column literally named `x.y`.

    **Status**: Routing, gate and field inventory are derived from the parsing/modeling rules. **Not yet XDM-validated** (no `validated` pill); validate by
    streaming a CEF batch and confirming a rich `xdm.*` count over a wide window.

    **Verify** (once the dataset is XDM-bound, wide ≥7d window):

        config timeframe = 30d | datamodel dataset = microsoft_dhcp_raw | sort desc _time | fields xdm.* | limit 20

  **How simulation works — read this before generating.** `phantom_create_data_worker`
  resolves each field's value in this order:

    1. `observables_dict[field]` — explicit; always wins. Values are LISTS.
    2. `is_gate` + `example` — gate fields are auto-pinned to their example.
    3. declared `type` — ipv4/user/url/datetime are synthesized plausibly.
    4. field-name heuristic.
    5. random token.

  **A field's `example` below is DOCUMENTATION ONLY unless that field is marked
  `is_gate`.** So every field the modeling rule reads expecting a specific SHAPE --
  an enum, an HTTP method, a status code, a resource path, a numeric type code, an
  XML or JSON blob -- MUST be passed in `observables_dict`, with keys spelled
  exactly as `fields[]` spells them (dotted leaves included, e.g.
  `event_data.param2`). Anything you leave out is randomly generated, and the rule
  will map it to garbage or drop the event.