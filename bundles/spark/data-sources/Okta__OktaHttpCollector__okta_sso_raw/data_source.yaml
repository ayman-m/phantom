  **Worked example 2, an admin/audit event (`user.account.privilege.grant`)**. An admin grants a role to a
  user; the actor is the admin, `target[0]` is the user who received it (type `User`), which is what the rule
  models as the target user. For `system.api_token.create` use the same skeleton with
  `eventType: system.api_token.create`, `displayMessage: "Create API token"`,
  `legacyEventType: "api.token.create"` and `target` =
  `[{"id":"00T1a2b3c4d5e6f7g8h","type":"Token","alternateId":"phantom-lab-automation","displayName":"phantom-lab-automation","detailEntry":null}]`
  (a Token target is carried raw, not modelled).

  ```text
