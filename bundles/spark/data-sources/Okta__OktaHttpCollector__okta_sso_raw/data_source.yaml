- name: displayMessage
  type: string
  description: Human-readable summary of the event. Mapped to `xdm.event.description`.
  example: User login to Okta
- name: legacyEventType
  type: string
  description: Okta's legacy event type string. Mapped to `xdm.observer.action`.
  example: core.user_auth.login_success
- name: severity
  type: enum
  description: Event severity. Mapped to `xdm.event.log_level` (DEBUG, INFO to INFORMATIONAL, WARN to WARNING, ERROR).
    Use WARN for failed logins.
  example: INFO
  enum_values:
  - DEBUG
  - INFO
  - WARN
  - ERROR
- name: version
  type: string_short
  description: Okta log-event schema version, always the string "0". Not read by the rule.
  example: '0'
- name: device
  type: json
  description: Device object of the event. The profile sends null; the rule does not read it.
  example: 'null'
- name: actor
  type: json
  description: 'Who performed the action: a real nested JSON object (not a string, not a CEF composite) with keys
    id, type, alternateId, displayName, detailEntry. Read by the rule through its leaves.'
  example: '{"id":"00u1a2b3c4d5e6f7g8h","type":"User","alternateId":"noura.alharbi@phantom-lab.example","displayName":"Noura
    Alharbi","detailEntry":null}'
- name: actor.id
  type: string_short
  description: Okta id of the actor (00u... for users). Mapped to `xdm.source.user.identifier` / `xdm.source.identity.identifier`
    only when actor.type is User or AppUser.
  example: 00u1a2b3c4d5e6f7g8h
- name: actor.type
  type: enum
  description: 'Actor type. The rule lower-cases it: `user` and `appuser` give a regular user and populate `xdm.source.user.*`
    / `xdm.source.identity.*` (upn, username, names, identifier) and an interactive `xdm.logon.type`; `systemprincipal`
    (Okta itself or an agent) populates none of the user fields, so an automation-driven event yields no source
    user. Use User for anything a human did.'
  example: User
  enum_values:
  - User
  - AppUser
  - SystemPrincipal
  - PublicClientApp
  - Client
- name: actor.alternateId
  type: email
  description: The actor's login, UPN-shaped (an email). Mapped to `xdm.source.user.upn` / `xdm.source.identity.upn`
    for User and AppUser actors. Always send the bare form `name@domain`; a `DOMAIN\user` form collapses identity
    in Cortex analytics.
  example: noura.alharbi@phantom-lab.example
- name: actor.displayName
  type: string
  description: Actor's display name. Mapped to `xdm.source.user.username`; the first token (up to a space or comma)
    becomes `first_name` and the rest `last_name`, so send `First Last`.
  example: Noura Alharbi
- name: actor.detailEntry
  type: json
  description: Extra actor detail. Usually null; not read by the rule.
  example: 'null'
- name: client
  type: json
  description: 'The requesting client: nested JSON object with userAgent, zone, device, id, ipAddress and geographicalContext.
    Read by the rule through its leaves.'
  example: '{"userAgent":{"rawUserAgent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/126.0.0.0","os":"Windows
    10","browser":"CHROME"},"zone":"null","device":"Computer","id":null,"ipAddress":"144.86.80.11","geographicalContext":{"city":"Dammam","state":"Eastern
    Province","country":"Saudi Arabia","postalCode":null,"geolocation":{"lat":26.4336,"lon":50.1116}}}'
- name: client.ipAddress
  type: ipv4
  description: Client address. Mapped to `xdm.source.ipv4` (or `xdm.source.ipv6` when it contains a colon). Send a
    real, geo-resolvable public address, since Cortex derives country, city and ASN from it, not from the event's labels.
  example: 144.86.80.11
- name: client.id
  type: string_short
  description: Okta client / device id, often null. Mapped to `xdm.source.host.device_id`.
- name: client.device
  type: enum
  description: Device class. Mapped to `xdm.source.host.device_category`.
  example: Computer
  enum_values:
  - Computer
  - Mobile
  - Tablet
  - Unknown
- name: client.zone
  type: string
  description: Okta network zone the client matched. Okta sends the string "null" when none. Mapped to `xdm.source.zone`.
  example: 'null'
- name: client.userAgent.rawUserAgent
  type: string
  description: Raw User-Agent header. Mapped to `xdm.source.user_agent`; the literal value "unknown" (any case)
    is dropped to null.
  example: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36
- name: client.userAgent.os
  type: string
  description: Operating system parsed from the user agent. Mapped to `xdm.source.host.os`; `xdm.source.host.os_family`
    is derived from it (windows, mac, ios, android, linux, ...).
  example: Windows 10
- name: client.userAgent.browser
  type: string
  description: Browser parsed from the user agent. Mapped to `xdm.source.application.name`.
  example: CHROME
- name: client.geographicalContext.city
  type: string
  description: City of the client address. Mapped to `xdm.source.location.city`.
  example: Dammam
- name: client.geographicalContext.state
  type: string
  description: State or province. Mapped to `xdm.source.location.region`.
  example: Eastern Province
- name: client.geographicalContext.country
  type: string
  description: Country as a full name (Okta sends names, not ISO codes). Mapped to `xdm.source.location.country`.
  example: Saudi Arabia
- name: client.geographicalContext.postalCode
  type: string
  description: Postal code, often null. Not read by the rule.
- name: client.geographicalContext.geolocation.lat
  type: float
  description: Latitude as a JSON number. Mapped to `xdm.source.location.latitude`.
  example: 26.4336
- name: client.geographicalContext.geolocation.lon
  type: float
  description: Longitude as a JSON number. Mapped to `xdm.source.location.longitude`.
  example: 50.1116
- name: outcome
  type: json
  description: 'Result of the action: nested JSON object with result and reason (reason may be null).'
  example: '{"result":"SUCCESS","reason":null}'
- name: outcome.result
  type: enum
  description: 'Outcome. Mapped to `xdm.event.outcome`: SUCCESS and ALLOW give SUCCESS; FAILURE and DENY give FAILED;
    CHALLENGE and SKIPPED give PARTIAL; UNKNOWN gives UNKNOWN; any other string is passed through unchanged.'
  example: SUCCESS
  enum_values:
  - SUCCESS
  - FAILURE
  - CHALLENGE
  - SKIPPED
  - ALLOW
  - DENY
  - UNKNOWN
- name: outcome.reason
  type: string
  description: 'Why the outcome occurred; null on plain success. Mapped to `xdm.event.outcome_reason`, which normalises
    these values: UNKNOWN_USER gives user_does_not_exist; INVALID_CREDENTIALS and "Authentication failed: bad username
    or password" give bad_credentials; LOCKED_OUT and "Authentication failed: account is locked" give account_locked;
    USER_ACCOUNT_EXPIRE, GENERAL_NONSUCCESS and "Authentication failed: account is expired" give account_expired_or_disabled;
    "Login failed." gives failed_login; PASSWORD_BASED_LOGIN_DISALLOWED gives auth_policy_access_violation; VERIFICATION_ERROR
    gives mfa_failure; DEL_AUTH_TIMEOUT gives mfa_expired; "User rejected Okta push verify" gives user_reject; "Login
    aborted" gives user_cancelled. Anything else passes through as the raw string.'
  example: INVALID_CREDENTIALS
- name: target
  type: json
  description: 'What the action acted on: a real JSON ARRAY of objects (empty array when none), each with id, type,
    alternateId, displayName, detailEntry. The okta_sso_raw rule reads only the FIRST element: type AppInstance
    fills `xdm.target.resource.id` (id) and `xdm.target.resource.name` (alternateId); type User fills `xdm.target.user.*`
    / `xdm.target.identity.*` (upn from alternateId, username from displayName, first/last name, identifier from
    id). Other types (Token, Role, UserGroup, PolicyEntity, ...) are carried raw but not modelled.'
  example: '[{"id":"0oa1b2c3d4e5f6g7h8i","type":"AppInstance","alternateId":"Salesforce","displayName":"Salesforce","detailEntry":null}]'
  is_array: true
- name: target[].id
  type: string_short
  description: Okta id of the target (0oa... for apps, 00u... for users).
  example: 0oa1b2c3d4e5f6g7h8i
- name: target[].type
  type: string
  description: 'Target type: AppInstance, User, Token, Role, UserGroup, PolicyEntity, AuthenticatorEnrollment, etc.
    Only AppInstance and User (first element) are modelled.'
  example: AppInstance
- name: target[].alternateId
  type: string
  description: Target login or app name. Mapped to `xdm.target.resource.name` (AppInstance) or `xdm.target.user.upn`
    (User).
  example: Salesforce
- name: target[].displayName
  type: string
  description: Target display name. For User targets mapped to `xdm.target.user.username`, split into first and
    last name on the first space.
  example: Salesforce
- name: target[].detailEntry
  type: json
  description: Extra target detail. Usually null; not read.
  example: 'null'
- name: authenticationContext
  type: json
  description: 'Authentication context: nested JSON object in real Okta''s flat form: authenticationProvider (a
    string), credentialProvider, credentialType, externalSessionId, authnContextClassRef, issuer, interface, authenticationStep.
    This is what real Okta and the http-sender okta profile send. NOTE: the Cortex rule reads `authenticationProvider.credentialProvider`
    / `.credentialType` / `.externalSessionId` (an object form, see those leaves), which this flat form does not
    satisfy.'
  example: '{"authenticationProvider":"OKTA_AUTHENTICATION_PROVIDER","credentialProvider":"OKTA_CREDENTIAL_PROVIDER","credentialType":"PASSWORD","externalSessionId":"idx9fQ2lKz8a1b2c3d4e5f6g","issuer":null,"interface":null,"authenticationStep":0}'
- name: authenticationContext.authenticationProvider
  type: string
  description: 'Real Okta sends a string: OKTA_AUTHENTICATION_PROVIDER for password logins, FACTOR_PROVIDER for
    MFA factors. The Cortex rule instead reads three keys beneath it as if it were an object (the next three leaves).'
  example: OKTA_AUTHENTICATION_PROVIDER
- name: authenticationContext.authenticationProvider.credentialProvider
  type: string
  description: 'Rule-read path (object form, derived from reading the rule): mapped to `xdm.auth.mfa.provider`.
    With real Okta''s flat form this path is absent, so the XDM field stays null.'
  example: OKTA_CREDENTIAL_PROVIDER
- name: authenticationContext.authenticationProvider.credentialType
  type: string
  description: 'Rule-read path (object form, derived from the rule): mapped to `xdm.auth.mfa.method`. Absent in real Okta''s
    flat form, so the XDM field stays null.'
  example: PASSWORD
- name: authenticationContext.authenticationProvider.externalSessionId
  type: string_short
  description: 'Rule-read path (object form, derived from the rule): mapped to `xdm.network.session_id`. Absent in real Okta''s
    flat form, so the XDM field stays null.'
  example: idx9fQ2lKz8a1b2c3d4e5f6g
- name: authenticationContext.credentialProvider
  type: string
  description: Real-Okta flat credential provider (what the profile sends). Not read by the rule.
  example: OKTA_CREDENTIAL_PROVIDER
- name: authenticationContext.credentialType
  type: string
  description: 'Real-Okta flat credential type: PASSWORD, OKTA_VERIFY_PUSH, SIGNED_NONCE (FastPass), SMS, EMAIL,
    TOKEN:SOFTWARE:TOTP. Not read by the rule.'
  example: PASSWORD
- name: authenticationContext.externalSessionId
  type: string_short
  description: Real-Okta flat external session id (idx... in Identity Engine). Not read by the rule.
  example: idx9fQ2lKz8a1b2c3d4e5f6g
- name: authenticationContext.authnContextClassRef
  type: string
  description: SAML authentication context class reference. Not read by the rule.
  example: urn:oasis:names:tc:SAML:2.0:ac:classes:Password
- name: authenticationContext.issuer
  type: json
  description: Issuer object, usually null. Not read.
  example: 'null'
- name: authenticationContext.interface
  type: string
  description: Authentication interface, usually null. Not read.
- name: authenticationContext.authenticationStep
  type: integer
  description: Step number within the authentication flow. Not read.
  example: 0
- name: securityContext
  type: json
  description: 'Network context of the client address: nested JSON object (asNumber, asOrg, isp, domain, isProxy).'
  example: '{"asNumber":25019,"asOrg":"Example Telecom JSC","isp":"Example Telecom JSC","domain":"example-isp.example","isProxy":false}'
- name: securityContext.asNumber
  type: integer
  description: Autonomous system number as a JSON number. Mapped to `xdm.source.asn.as_number`.
  example: 25019
- name: securityContext.asOrg
  type: string
  description: AS organisation name. Mapped to `xdm.source.asn.as_name`.
  example: Example Telecom JSC
- name: securityContext.isp
  type: string
  description: ISP name. Mapped to `xdm.source.asn.isp`.
  example: Example Telecom JSC
- name: securityContext.domain
  type: domain
  description: ISP domain. Mapped to `xdm.source.asn.domain`; the literal "." is dropped to null.
  example: example-isp.example
- name: securityContext.isProxy
  type: boolean
  description: Whether Okta flags the client as a proxy. Mapped to `xdm.source.asn.is_proxy` (true only when the
    value is the boolean true or the string "true").
  example: false
- name: debugContext
  type: json
  description: 'Debug data: nested JSON object holding a single `debugData` object. Read by the rule through its
    leaves.'
  example: '{"debugData":{"requestId":"ZmK2qP8aLr5tB9xW3nYc4gAAABc","requestUri":"/idp/idx/identify","threatSuspected":"false","url":"/idp/idx/identify?"}}'
- name: debugContext.debugData
  type: json
  description: The debugData object. Free-form in Okta; the keys below are the ones the rule or the profile uses.
  example: '{"threatSuspected":"false","requestUri":"/idp/idx/identify"}'
- name: debugContext.debugData.requestId
  type: string_short
  description: Okta request id. Emitted by the profile; not mapped.
  example: ZmK2qP8aLr5tB9xW3nYc4gAAABc
- name: debugContext.debugData.requestUri
  type: string
  description: Request path. Emitted by the profile; not mapped.
  example: /idp/idx/identify
- name: debugContext.debugData.url
  type: url
  description: Request URL or path. Mapped to `xdm.network.http.url`.
  example: /idp/idx/identify?
- name: debugContext.debugData.threatSuspected
  type: string
  description: 'Real Okta (and the profile) send the STRING "true" or "false". The rule does `lowercase(to_string(json_extract(debugContext,
    "$.debugData.threatSuspected")))` and compares to "false" to build the `xdm.alert.risks` tag `risky_signin:
    FALSE` / `risky_signin: TRUE`; json_extract keeps the JSON quotes on a string value, so whether the string form
    matches is not established (a JSON boolean would). Check `xdm.alert.risks` on a sample before relying on it.'
  example: 'false'
- name: debugContext.debugData.factor
  type: string
  description: 'Authentication factor. Lower-cased by the rule (json_extract_scalar) and, for eventType user.authentication.auth_via_mfa
    only, mapped to `xdm.event.operation_sub_type`: yubikey and fido_webauthn give hardware_token; password_as_factor
    gives password; okta_soft_token and okta_verify_push give application; email_factor gives email; sms_factor
    gives sms; call_factor gives voice.'
  example: OKTA_VERIFY_PUSH
- name: debugContext.debugData.errorCode
  type: string
  description: 'Numeric error code (AD agent events). Matched by regex: 1326 maps the outcome reason to bad_credentials;
    1331 and 1793 map it to account_expired_or_disabled.'
  example: '1326'
- name: debugContext.debugData.risk
  type: string
  description: Real Okta (and the profile) send risk as ONE flat string such as "{level=HIGH}", present only on authentication
    events (session.start, auth_via_mfa, verify). The rule reads it as an object (`risk.level`, `risk.reasons`,
    next two leaves); against the flat string those paths give null.
  example: '{level=HIGH}'
- name: debugContext.debugData.risk.level
  type: string
  description: 'Rule-read path (object form, derived from the rule): mapped to `xdm.alert.severity` via json_extract, which
    keeps JSON quotes on strings, so the resulting value may carry quotes. Null against real Okta''s flat `risk`
    string.'
  example: HIGH
- name: debugContext.debugData.risk.reasons
  type: string
  description: 'Rule-read path (object form), comma-separated risk reasons. Matched by regex: when it contains "Anonymizing
    Proxy" the rule sets `xdm.intermediate.is_proxy` true and adds `anonymized_ip: TRUE` to `xdm.alert.risks`, else
    `anonymized_ip: FALSE`. Null against a flat `risk` string.'
  example: Anonymizing Proxy
- name: debugContext.debugData.logOnlySecurityData
  type: string
  description: 'Okta''s log-only security data string (on FastPass phishing events: phishingUrl, originCheckResult
    MISMATCH, requestedUri). Carried raw; not read by the rule.'
  example: '{"behaviors":{},"phishingUrl":"https://okta-secure-login.example/login/login.htm","originCheckResult":"MISMATCH","requestedUri":"/idp/idx/challenge/answer?"}'
- name: debugContext.debugData.behaviors
  type: string
  description: Okta behavior-detection result string. The rule splits it on commas, strips braces, and appends each
    item to `xdm.alert.risks`.
  example: '{New Geo-Location=POSITIVE, New Device=NEGATIVE, New IP=POSITIVE, New State=NEGATIVE, New Country=NEGATIVE,
    Velocity=NEGATIVE, New City=POSITIVE}'
- name: debugContext.debugData.originalPrincipal.type
  type: string
  description: 'Rule-read path (derived from the modeling rule): lower-cased by the rule; user, guest, admin and system map to `xdm.auth.privilege_level`.
    The rule reads it with json_extract, which keeps JSON quotes on strings, so a string value may not hit those
    branches and pass through raw instead. Not part of real Okta''s System Log debugData for most events.'
  example: Admin
- name: debugContext.debugData.deviceFingerprint
  type: string
  description: Device fingerprint. Mapped to `xdm.observer.unique_identifier`.
  example: 7d8e3f4a1b2c9d6e5f0a4b3c2d1e8f9a
- name: debugContext.debugData.dtHash
  type: string
  description: Device-token hash. Mapped to `xdm.logon.fingerprint` (modeling rule 2_11 and later).
  example: 4f6a9c2e8b1d7035a4c9e6f2b8d1a3c5
- name: debugContext.debugData.origin
  type: string
  description: Request origin. Mapped to `xdm.network.http.referrer`.
  example: https://phantom-lab.okta.example
- name: debugContext.debugData.proxyType
  type: string
  description: Proxy type detected by Okta. Mapped to `xdm.intermediate.application.name`.
  example: Tor
- name: debugContext.debugData.threatDetections
  type: string
  description: Threat detections string. Mapped to `xdm.network.rule`.
- name: debugContext.debugData.privilegeGranted
  type: string
  description: On user.account.privilege.grant events, the role(s) granted. Carried raw; not read by the rule.
  example: Organization administrator
- name: transaction
  type: json
  description: 'Transaction context: nested JSON object (type, id, detail).'
  example: '{"type":"WEB","id":"ZmK2qP8aLr5tB9xW3nYc4gAAABc","detail":{}}'
- name: transaction.type
  type: string
  description: Transaction type (WEB, JOB). Mapped to `xdm.observer.type`.
  example: WEB
- name: transaction.id
  type: string_short
  description: Transaction id. Mapped to `xdm.session_context_id`.
  example: ZmK2qP8aLr5tB9xW3nYc4gAAABc
- name: transaction.detail
  type: json
  description: Free-form detail object, usually empty.
  example: '{}'
- name: transaction.detail.requestApiTokenId
  type: string_short
  description: Id of the API token that made the request, when one did. Mapped to `xdm.auth.mfa.client_details`.
  example: 00T1a2b3c4d5e6f7g8h
- name: request
  type: json
  description: 'Request context: nested JSON object holding `ipChain`.'
  example: '{"ipChain":[{"ip":"144.86.80.11","geographicalContext":{"city":"Dammam","state":"Eastern Province","country":"Saudi
    Arabia","postalCode":null,"geolocation":{"lat":26.4336,"lon":50.1116}},"version":"V4","source":null}]}'
- name: request.ipChain
  type: json
  description: Real JSON array of hop objects (client first, then any proxies). Mapped as a list to `xdm.source.host.ipv4_addresses`
    / `xdm.source.host.ipv6_addresses` (split by colon).
  example: '[{"ip":"144.86.80.11","version":"V4","source":null}]'
  is_array: true
- name: request.ipChain[].ip
  type: ipv4
  description: Hop address. See `request.ipChain`.
  example: 144.86.80.11
- name: request.ipChain[].version
  type: string_short
  description: Address family, V4 or V6. Not read.
  example: V4
- name: request.ipChain[].source
  type: string
  description: Hop source label, usually null. Not read.
- name: request.ipChain[].geographicalContext
  type: json
  description: Geography of the hop, same shape as client.geographicalContext. Not read.
  example: '{"city":"Dammam","country":"Saudi Arabia"}'
use_cases:
- Identity
- MFA
- SaaS
- PAM
