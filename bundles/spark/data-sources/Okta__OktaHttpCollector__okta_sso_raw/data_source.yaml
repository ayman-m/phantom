  **Worked example 3, FastPass declined a phishing attempt (`user.authentication.auth_via_mfa`)**. The shape
  that fired the FastPass BIOC in our runs: a FAILED MFA verification whose reason is exactly
  `FastPass declined phishing attempt`, from the AiTM proxy's address (here an out-of-country hosting range), with
  `threatSuspected` `"true"`, `risk` `{level=HIGH}` and the phishing URL in `logOnlySecurityData`:

  ```text
