schema_version: 1
id: Okta
pack_name: Okta
rule_name: OktaHttpCollector
dataset_name: okta_sso_raw
vendor: Okta
product: Okta HTTP
delivery: http
description: 'The HTTP-collector variant of Okta System Log events (`okta_sso_raw`): one JSON object per event,
  delivered by the `http-sender` connector to an XSIAM HTTP Log Collector (Vendor Okta, Product Sso) instead of
  syslog/CEF. Simulate it to test sign-in, MFA and admin-audit detections over HTTP delivery with real nested JSON.'
how_to_use: |
  **Use this source when the goal is Cortex Analytics alerts.** Analytics reads data that arrives with the source's identity, so send it with the `http-sender` connector: the strongest route is the Cribl destination `cribl_okta_sso` (the Okta SSO source UUID: native collector type, stories and 25 detectors), and the generic HTTP collector destination fires FastPass. The syslog/CEF Okta source is for checking parsing and modeling; do not wait for Analytics alerts from it (identical data alerts over HTTP and not over CEF).

  ## Simulating Okta over HTTP (JSON, `http-sender` connector)

  This source describes Okta System Log events (the objects returned by Okta's `GET /api/v1/logs`) as they
  are delivered to a Cortex XSIAM **HTTP Log Collector** and land in dataset `okta_sso_raw`
  (`_vendor=Okta`, `_product=Sso`). It is the HTTP-delivery sibling of
  the syslog/CEF Okta sources and was written for HTTP, not copied from them.

  **Two Okta collectors can exist on a tenant.** Okta/Sso writes `okta_sso_raw` (the dataset this source is
  catalogued under) and Okta/Okta writes `okta_okta_raw`. Both bind the Okta pack; `okta_okta_raw` produces 58 distinct `xdm.*` fields from one event. The sender has a destination for each: `okta_sso` (used in
  the calls below) and `okta_okta` (the `okta` profile's preferred one, with no dataset-mismatch warning for
  either). Which collector a given Cortex detector reads is NOT established here.

  **Do NOT use `phantom_create_data_worker`, syslog, CEF, `schema_override` or `observables_dict` for this
  source.** Delivery is the `http-sender` connector's `list_destinations`, `send_test_event`,
  `generate_events` and `send_events` tools, and for two reasons: (1) the payload is one real JSON object
  per event, with nested objects and arrays as real JSON, not CEF composites packed into strings; (2) the
  dataset is fixed by the collector configured in XSIAM (Vendor Okta, Product Sso), not by anything in
  the event, so there is no CEF header to set and no routing literal to get wrong. The sender adds no
  fields: every object you send arrives exactly as you wrote it, so never put `_time`, `_vendor` or
  `_product` in it (Cortex stamps those).

  ### Prerequisites

  1. An `http-sender` connector instance with a destination named **`okta_sso`** (a destination's name is its
     dataset without `_raw`). Check with `http-sender.list_destinations`: the row must show
     `destination: okta_sso`, `dataset: okta_sso_raw`, `ready: true`. If it is missing or not ready, stop and
     tell the operator; you cannot create or read collector keys.
  2. The Cortex **Okta content pack** installed on the tenant; it binds `okta_sso_raw` to the Okta parsing
     and modeling rules. Without the pack the dataset is raw-only: no `_time` from `published`, no `xdm.*`.

  ### Quick start (exact calls)

  ```text
  http-sender.list_destinations   {}
  http-sender.send_test_event     {"destination": "okta_sso", "profile": "okta"}
  ```

  `send_test_event` sends one benign `user.session.start` for `phantom.test@<userDomain>` and returns
  `test_id` (its `uuid`) plus a ready-made XQL query. Run it first; then wait for it to land (see Timing).

  Built-in scenarios (`generate_events`). Always preview with `"dry_run": true` first (builds and returns the
  first 3 events without sending), then repeat the same call without it. Common arguments:
  `count` (1-5000, default 20), `spread_seconds` (width of the window the events are spread across, default
  120), `start_offset_minutes` (end the window this many minutes in the past, to back-date; default 0),
  `target_user` (victim, bare name or email, never `DOMAIN\user`), `source_ip` (attacker address; default a
  random real out-of-country address). Nothing is ever dated after now.

  **Addresses are real, so Cortex can geo-resolve them.** Cortex derives country, city, ASN and ISP from the
  IP itself and ignores any label in the event. Each benign user therefore has ONE stable Saudi home address
  (a real regional-ISP range, checked with Cortex's `iploc`), the same on every run, with
  `client.geographicalContext` and `securityContext` filled with what Cortex resolves for it. Attack scenarios
  default to an out-of-country address, never a home one, so geo, ASN and new-country detections have something
  to profile; `source_ip` overrides the default (an address outside the built-in pools is sent as given, with
  empty geography).

  | Scenario | Use when | What it sends |
  |---|---|---|
  | `benign_logins` | You need normal background traffic or a baseline | Alternating `user.session.start` SUCCESS and `user.authentication.sso` SUCCESS, cycling through 12 home users, each from one stable real Saudi ISP address (Cortex resolves it to Saudi Arabia), 6 apps |
  | `failed_then_success` | Brute-force-then-compromise, account takeover | `count-1` x `user.session.start` FAILURE (reason INVALID_CREDENTIALS) for ONE victim from ONE attacker IP, then one SUCCESS |
  | `password_spray` | One IP against many accounts | `count` x `user.session.start` FAILURE, each for a different user (the 12 users, then numbered variants), one attacker IP; `target_user` is ignored |
  | `mfa_fatigue` | MFA push bombing | For ONE victim, alternating `system.push.send_factor_verify_push` SUCCESS and `user.mfa.okta_verify.deny_push` FAILURE (reason USER_REJECTED_OKTA_VERIFY_PUSH), ending with one `user.authentication.auth_via_mfa` SUCCESS; use `count` >= 3 |

  ```text
  http-sender.generate_events {"profile":"okta","scenario":"failed_then_success","destination":"okta_sso","count":8,"spread_seconds":120,"target_user":"khalid.alotaibi","source_ip":"80.130.44.45","dry_run":true}
  http-sender.generate_events {"profile":"okta","scenario":"password_spray","destination":"okta_sso","count":40,"spread_seconds":300,"source_ip":"49.36.20.77"}
  http-sender.generate_events {"profile":"okta","scenario":"mfa_fatigue","destination":"okta_sso","count":9,"spread_seconds":240,"target_user":"noura.alharbi"}
  http-sender.generate_events {"profile":"okta","scenario":"benign_logins","destination":"okta_sso","count":120,"spread_seconds":3600,"start_offset_minutes":30}
  ```

  Any other Okta event type: build the JSON yourself from the field guide below and send it with
  `send_events` (1-5000 objects, sent exactly as given). `generate_events` only knows the 4 scenarios above.

  **Worked example 1, a user login (`user.session.start`)**. Replace `published` with the current UTC time
  (or the back-dated time you want) and give every event a fresh `uuid`. The nested objects use real Okta's shape, the same
