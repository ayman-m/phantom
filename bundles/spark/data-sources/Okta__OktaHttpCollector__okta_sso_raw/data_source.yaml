fields:
- name: published
  type: datetime
  description: 'Event time, and the Cortex parsing-rule gate. ISO-8601 UTC with a T separator, seconds, and a trailing
    Z or fractional digits (Okta form: millisecond precision plus Z). The INGEST rule (`okta`/`sso` -> `okta_sso_raw`,
    no_hit=keep) matches `.*T\d{2}:\d{2}:\d{2}[\.\dZ]+` and then sets `_time = published`; an offset form such as
    `+00:00` or an epoch number does not match, so the event is kept but stamped with the ingestion time. Set this
    per event; back-date by setting an earlier value. The `example` is illustrative, never reuse it verbatim.'
  example: '2026-10-01T09:15:42.318Z'
  is_gate: true
- name: uuid
  type: string_short
  description: Unique id of the log event (a UUID). Mapped to `xdm.event.id`. Make it unique per event and keep
    it as the marker you query for when verifying an event landed.
  example: 6b1f0a52-9d3e-4c7a-8f21-3e5a7c4d9b10
- name: eventType
  type: enum
  description: 'Okta event type (dotted, lower-case except a few segments such as `auth_via_AD_agent`). Mapped to
    `xdm.event.original_event_type`. The okta_sso_raw model has NO eventType filter, so every type maps; the value
    decides `xdm.event.type` (set to `authentication` only for 10 types: user.authentication.sso, user.session.start,
    user.mfa.okta_verify.deny_push, user.mfa.factor.update, user.authentication.auth_via_mfa, user.authentication.auth_via_AD_agent,
    user.authentication.verify, user.authentication.auth_via_radius, user.authentication.auth_via_richclient, system.push.send_factor_verify_push;
    any other type gives an empty `xdm.event.type`), `xdm.event.operation` (AUTH_MFA when the type contains authentication,
    oauth2 or mfa; AUTH_LOGIN when it contains session, access_request, import, kerberos_rich_client, iwa or ldap;
    otherwise the raw type) and `xdm.auth.service` (IDP for session.start / MFA / verify / policy.evaluate_sign_on
    types, SP for user.authentication.sso).'
  example: user.session.start
  enum_values:
  - user.session.start
  - user.session.end
  - user.session.clear
  - user.session.access_admin_app
