  ### Field guide (what the rule enforces)

  The reference rule is the Okta pack's `OktaModelingRules_2_11` (2_0 is the same without the
  `xdm.*.identity.*` and `xdm.logon.fingerprint` mappings). Its `okta_sso_raw` block reads the System Log
  objects as top-level columns (`actor`, `client`, `outcome`, `target`, `debugContext`, `securityContext`,
  `authenticationContext`, `transaction`, `request`) and extracts with `json_extract_scalar`, so each must be a
  real JSON object (or, for `target` and `request.ipChain`, an array). The `okta_sso_raw` model has **no
  eventType filter**: any event that parses maps. Rules that matter:

  - **Identity**: `xdm.source.user.upn` / `xdm.source.identity.upn` come from `actor.alternateId` ONLY when
    `actor.type` is `User` or `AppUser` (case-insensitive). A `SystemPrincipal` actor yields no source user at all.
    Keep logins bare UPNs (`name@phantom-lab.example`); a `DOMAIN\user` form collapses identity in Cortex
    analytics. `actor.displayName` should be `First Last`.
  - **Authentication type**: `xdm.event.type` is `authentication` only for these 10 event types: `user.authentication.sso`, `user.session.start`, `user.mfa.okta_verify.deny_push`, `user.mfa.factor.update`, `user.authentication.auth_via_mfa`, `user.authentication.auth_via_AD_agent`, `user.authentication.verify`, `user.authentication.auth_via_radius`, `user.authentication.auth_via_richclient`, `system.push.send_factor_verify_push`.
    Everything else maps but with an empty `xdm.event.type`.
  - **Outcome**: `outcome.result` SUCCESS/ALLOW -> SUCCESS, FAILURE/DENY -> FAILED, CHALLENGE/SKIPPED ->
    PARTIAL, UNKNOWN -> UNKNOWN. `outcome.reason` strings are normalised (see the field's description); use the
    exact Okta strings (for a denied push: `User rejected Okta push verify`, which the rule maps to
    `user_reject`; the profile's `USER_REJECTED_OKTA_VERIFY_PUSH` is not recognised and passes through raw).
  - **Target**: only `target[0]` is read, and only `AppInstance` (resource id/name) and `User` (target user)
    produce `xdm.target.*`.
  - **Network**: `client.ipAddress` goes to `xdm.source.ipv4` (or `ipv6` if it contains a colon);
    `request.ipChain[].ip` to the host address lists; `securityContext.*` to `xdm.source.asn.*`;
    `client.geographicalContext.*` to `xdm.source.location.*`. Latitude, longitude, `asNumber` are JSON numbers.
  - **Shapes: send real Okta's shape, which is also what the profile sends.** The rule reads a few
    paths that real Okta's shape does not contain, and that mismatch is inferred from reading the rule and
    has not been confirmed on data: it reads `authenticationContext.authenticationProvider.{credentialProvider,credentialType,externalSessionId}`
    (real Okta has `authenticationProvider` as a string and the other keys flat), and
    `debugContext.debugData.risk.{level,reasons}` (real Okta has `risk` as the flat string `{level=HIGH}`). With the
    real shape those paths are absent, so `xdm.auth.mfa.provider`, `xdm.auth.mfa.method`, `xdm.network.session_id`,
    `xdm.alert.severity` and the anonymizer flag are expected to stay null. Sending the object forms instead is an
    untested experiment.
  - **`json_extract` keeps JSON quotes on string values** (the rule uses `json_extract_scalar` for most
    fields, which does not, but plain `json_extract` for `debugData.threatSuspected`, `debugData.risk.*`,
    `debugData.behaviors` and `debugData.originalPrincipal.type`). For those fields what the rule produces from a
    string value is not established: check `xdm.alert.risks` and `xdm.auth.privilege_level` on a sample before
    depending on them.

  Key event types (the complete 175-type list is the `eventType`
  enum in the field list):

  - `user.authentication.sso`: User single sign on to app (SAML 2.0 or OIDC).
  - `user.session.start`: User login to Okta (password, FastPass, or MFA). Includes `debugContext`, `authenticationContext`, geo/IP context, and authenticator targets.
  - `user.mfa.okta_verify.deny_push`: User explicitly denies an Okta Verify push notification.
  - `user.mfa.factor.update`: MFA factor configuration updated.
  - `user.authentication.auth_via_mfa`: MFA factor verification (Okta Verify Push, TOTP, SMS, Email, FastPass).
  - `user.authentication.auth_via_AD_agent`: Authentication delegated to the Okta AD agent.
  - `user.authentication.verify`: Identity verification step (password accepted; MFA step now required).
  - `user.authentication.auth_via_radius`: RADIUS authentication (corporate WiFi, VPN gateway, NAC).
  - `user.authentication.auth_via_richclient`: Authentication from a rich (non-browser) client.
  - `system.push.send_factor_verify_push`: Okta Verify push notification sent.
  - `user.session.end`: User logout from Okta.
  - `user.session.access_admin_app`: User accesses the Okta Admin Console from an active session.
  - `user.authentication.auth_via_webauthn`: WebAuthn/FIDO2 hardware key or passkey authentication (YubiKey, Touch ID, Windows Hello, Passkey).
  - `user.account.lock`: Account locked after repeated authentication failures.
  - `user.account.update_password`: User self-service password change.
  - `user.account.reset_password`: Admin resets a user's password.
  - `user.account.privilege.grant`: Admin role or privilege granted to a user.
  - `user.account.privilege.revoke`: Admin role or privilege revoked from a user.
  - `user.mfa.factor.reset_all`: Admin resets all MFA factors for a user.
  - `user.mfa.factor.deactivate`: MFA factor removed from user's account.
  - `user.lifecycle.create`: New user account created.
  - `user.lifecycle.deactivate`: Account deactivated (soft delete).
  - `user.risk.detect`: Risk signal detected for a user (new country, anomalous behaviour, known threat IP).
  - `group.privilege.grant`: Admin privilege granted to a group.
  - `system.api_token.create`: API token created by an admin.
  - `system.idp.lifecycle.create`: External Identity Provider created.
  - `system.log_stream.lifecycle.delete`: Log streaming destination deleted.
  - `policy.rule.update`: Policy rule updated (e.g., MFA requirement changed).
  - `iam.resourceset.bindings.add`: Admin role binding created (user assigned to custom role).
  - `security.threat.detected`: Okta ThreatInsight detected a threat (credential stuffing, brute force).
  - `security.session.detect_client_roaming`: Session token used from a different IP than it was issued to.
  - `app.oauth2.as.token.detect_reuse`: One-time refresh token reuse detected (potential session hijack).
  - `application.policy.sign_on.deny_access`: Sign-on policy denied user access to an application.

  ### Timing and back-dating

  `published` is the event time. The parsing rule sets `_time = published` **only at ingest and only because the
  Okta pack is installed**; events sent before the pack was installed keep their ingestion time forever, and an
  event whose `published` does not match the rule's pattern (needs `T`, `hh:mm:ss`, then `.`, digits or `Z`, so
  `2026-10-01T09:15:42Z` or `...42.318Z`; offsets such as `+00:00` do not match) is kept but stamped with the
  ingestion time (the rule is `no_hit=keep`). To back-date, set `published` earlier, or pass
  `start_offset_minutes` to `generate_events`. HTTP 200 only means the collector accepted the request; on this
  tenant events become queryable **5-7 minutes** after sending. Wait that long before concluding anything.

  ### Verify (XQL)

  Raw, by the event id (the test id from `send_test_event`, or any `uuid` you sent):

  ```xql
  dataset = okta_sso_raw
  | filter uuid = "<uuid>"
  ```

  Mapped:

  ```xql
  datamodel dataset = okta_sso_raw
  | fields _time, xdm.source.user.upn, xdm.event.type, xdm.event.outcome, xdm.source.ipv4
  | limit 20
  ```

  Expect a `failed_then_success` run to map `xdm.source.user.upn`, `xdm.event.type`
  = `authentication`, `xdm.event.outcome` FAILED/SUCCESS and `xdm.source.ipv4`. **Never judge mapping from one
  row**: count the distinct non-null `xdm.*` columns over at least 20 rows and a wide time window.

  ### Analytics

  One example, not a promise for other detectors: a single `user.authentication.auth_via_mfa` event whose
  `outcome.reason` said FastPass declined a phishing attempt fires the Cortex Analytics BIOC "Okta FastPass
  reported phishing attack suspected" within about 2 minutes. Worked example 3 above is that shape: `outcome.result` FAILURE and `outcome.reason` exactly
  `FastPass declined phishing attempt`. Do not extrapolate this to other detectors; Analytics detectors need
  baselines and licensing that are tenant-specific.

  ### Scope

  Never claim `validated` for this source. Mapping validation of a data source stays on the syslog/CEF path
  (see the Okta syslog sources); this HTTP variant exists to simulate Okta delivery and attacks over an XSIAM
  HTTP Log Collector.
