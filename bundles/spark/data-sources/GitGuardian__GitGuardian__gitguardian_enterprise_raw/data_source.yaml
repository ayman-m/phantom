how_to_use: |
  ## GitGuardian GitGuardian → Cortex XSIAM (dataset `gitguardian_enterprise_raw`)

    **Routing** — the broker lowercases the CEF/syslog header `vendor`/`product`, replaces
    non-alphanumerics with `_`, and appends `_raw` to choose the dataset (target: `gitguardian_enterprise_raw`).

    **Required CEF header for XSIAM** — the header must normalize to `gitguardian_enterprise`. The marketplace pack's display name `GitGuardian` / `GitGuardian` normalizes to `gitguardian_gitguardian_raw`, a **different dataset** (vendor rename / legacy CEF identity), so use the vendor's actual CEF `deviceVendor`/`deviceProduct` that yields `gitguardian_enterprise` and confirm which dataset the events land in.

    **Ingestion shape**: **JSON-native.** The modeling rule reads nested JSON. CEF/syslog routes + lands and the broker extracts top-level columns; the nested reads need the composite present, so Phantom's worker JSON-stringifies `type: json` composites onto the wire (keep the dotted-leaf fields).

    - **Modeling-rule gate**: `source_log_type = "incident"` — seed that field with an accepted value or the rule drops the row (XDM stays 0).

    **XDM mapping**: ~21 fields mapped to the unified data model (`xdm.*`), including: `xdm.alert.description`, `xdm.alert.name`, `xdm.alert.original_alert_id`, `xdm.alert.severity`, `xdm.alert.subcategory`, `xdm.event.description`.

    **Operator setup**: This data source has typed-column data that does not look like CEF
    (camelCase API fields, JSON sub-objects). In production the vendor is usually collected
    over an HTTP/API path -- that is IRRELEVANT to Phantom. Parsing and modeling rules are
    protocol-agnostic: they match on the DATA SHAPE (field names, JSON paths, value types), not
    on how the event arrived. Phantom always delivers over syslog/CEF to the Cortex Broker and
    never uses an HTTP collector or an API integration. For a JSON-shaped rule, declare the
    composite's dotted-leaf fields (`parent.child.leaf`) in `fields[]` so the generator builds
    the nested object -- nested JSON survives CEF-over-syslog intact, XML payloads included. If
    a rule reads `json_extract_scalar(x, "$.y")` then `x` must be a JSON OBJECT on the wire,
    not a flat column literally named `x.y`.

    **Status**: Routing, gate and field inventory are derived from the parsing/modeling rules. **Not yet XDM-validated** (no `validated` pill); validate by
    streaming a CEF batch and confirming a rich `xdm.*` count over a wide window.

    **Verify** (once the dataset is XDM-bound, wide ≥7d window):

        config timeframe = 30d | datamodel dataset = gitguardian_enterprise_raw | sort desc _time | fields xdm.* | limit 20

  **How simulation works — read this before generating.** `phantom_create_data_worker`
  resolves each field's value in this order:

    1. `observables_dict[field]` — explicit; always wins. Values are LISTS.
    2. `is_gate` + `example` — gate fields are auto-pinned to their example.
    3. declared `type` — ipv4/user/url/datetime are synthesized plausibly.
    4. field-name heuristic.
    5. random token.

  **A field's `example` below is DOCUMENTATION ONLY unless that field is marked
  `is_gate`.** So every field the modeling rule reads expecting a specific SHAPE --
  an enum, an HTTP method, a status code, a resource path, a numeric type code, an
  XML or JSON blob -- MUST be passed in `observables_dict`, with keys spelled
  exactly as `fields[]` spells them (dotted leaves included, e.g.
  `event_data.param2`). Anything you leave out is randomly generated, and the rule
  will map it to garbage or drop the event.