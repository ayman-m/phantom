- Analytics & SIEM
version: 1.0.0
origin: bundle
author: phantom-bundle
uploaded_by: null
created_at: '2026-10-14T00:00:00Z'
updated_at: '2026-10-14T00:00:00Z'
formats:
- WINEVENT
is_rawlog_only: false
fields:
- name: event_id
  type: integer
  description: AD FS Auditing event id — one of 1200-1207, or 510. Not one of the wec-sender
    connector's natively-catalogued Windows logon ids, so provider and rendering.message/rendering.task
    are also required.
  example: '1202'
- name: computer
  type: host
  description: Host name (short or FQDN) of the ADFS server the event claims to come from.
  example: PHADFS01.phantom.lab
- name: provider
  is_gate: true
  type: string
  description: The ADFS parsing rule's INGEST filter requires provider_name = "AD FS Auditing" or
    "AD FS" (plus _collector_type = "WEC", which only a real WEC delivery stamps) before the event
    is even considered for microsoft_adfs_raw; any other value is dropped.
  example: AD FS Auditing
- name: channel
  type: string
  description: Windows Event Log channel.
  example: Security
- name: time
  type: datetime
  description: Event time (ISO-8601 UTC, epoch seconds, or a relative token the connector resolves
    with its own clock, e.g. "now-300s"). Becomes the event's TimeCreated and therefore _time.
  example: '2026-10-14T09:15:42Z'
- name: event_data
  type: json
  description: 'POSITIONAL (unnamed) Data nodes as a JSON ARRAY of 15 strings. Element 0 is a GUID,
    element 1 (param2) is the audit XML payload and MUST start with "<?xml " or every tag the
    modeling rule regex-extracts from it (AuditType, UserId, MfaMethod, DeviceId, Server,
    AuthProtocol, IpAddress, ForwardedIpAddress, UserAgentString) matches null, elements 2-14 MUST be
    the literal "-" filler (never omitted) -- the applet maps the array 1:1 to
    event_data.param1..param15, which is what the modeling rule''s 15-field concatenation reads.'
  example: '[]'
- name: rendering.message
  type: string_long
  description: 'Rendered description text (RenderingInfo/Message). Required by the wec-sender
    connector to build valid Event XML for this event_id (AD FS is not in the connector''s own event
    catalogue, so provider/rendering.message/rendering.task must all be supplied or the call is
    rejected before anything is sent). Load-bearing, not decorative: the modeling rule reads it
    directly for xdm.event.description, and again via an "Account Name: (\S+)" regex that TAKES
    PRIORITY over the audit XML''s <UserId> for xdm.source.user.username (the rule''s most-preferred
    source, a user JSON column, is not settable via send_events at all). Give it the vendor''s own
    "Account Name: <value>" line when you need username to populate this way.'
  example: 'Account Name: ahmed.saleh'
- name: rendering.task
  type: string_short
  description: Rendered Task text (RenderingInfo/Task), required by the wec-sender connector for this
    event_id. Becomes the event_action column, which the modeling rule folds into the event's
    original-type derivation — give it real, specific text rather than a placeholder. No confirmed
    real AD FS Task string is available here, so no example is given; do not invent one and treat it
    as authoritative.
- name: outcome
  type: enum
  enum_values:
  - success
  - failure
  description: Operation outcome. Drives the applet's RenderingInfo/Keywords ("Audit Failure" vs
    "Audit Success"), which the applet turns into the event_result column, which the modeling rule
    maps to xdm.event.outcome.
  example: success
- name: record_id
  type: integer
  description: Windows Event record id (System/EventRecordID). Optional.
  example: 88301
use_cases:
- Cloud
- SaaS
- Identity
