how_to_use: |
  ## Microsoft DNS -> Cortex XSIAM (dataset `microsoft_dns_raw`)

  **WIRE FORMAT -- use `type=RAW`, NOT CEF.** This source's modeling rule
  extracts its fields from `_raw_log`, the vendor's own log line. A CEF event's
  extensions become dataset COLUMNS and the broker leaves `_raw_log` EMPTY, so
  over CEF this rule maps NOTHING however the schema is shaped. Create the
  worker with `type=RAW`: the generator pins `_raw_log` to this schema's
  `_raw_log` example (or to an `observables_dict` override) and the sender ships
  that line syslog-framed, verbatim.

  **Routing for RAW.** A raw line carries no CEF header, so the broker cannot
  derive vendor/product from the wire. A Broker syslog collector row must map
  this source's listener port to vendor `microsoft` / product `windows`, taken verbatim
  from this pack's parsing-rule INGEST block -- that is the literal the broker
  actually routes on. These are NOT the display `vendor`/`product` fields in
  this schema, which differ. Without that row the event lands in
  `unknown_unknown_raw`.

  This source's PARSING rule also reads `_raw_log` -- over CEF it receives
  nothing, so the parsing rule extracts NO columns at all and every
  column-derived field in the modeling rule stays empty too. CEF does not
  merely lose some fields here; it breaks the whole chain.

  Required CEF header for XSIAM:
  - vendor: `microsoft`
  - product: `windows`

  **Routing.** Four packs share the pair `microsoft`/`windows`. DNS is selected by its
  parsing rule branch A, whose only test is that `_raw_log` contains a DNS-debug timestamp
  in `M/D/YYYY h:mm:ss AM` form. Branch B requires `_raw_log = null`, which is unreachable
  over syslog because the broker always populates it, so branch A is the only way in.
  Setting `provider_name = Microsoft-Windows-DNSServer` additionally excludes the event
  from the Windows Events rule (which filters that provider out) and selects the richer
  second branch of the modeling rule. Verified: an event shaped this way lands in
  `microsoft_dns_raw` with every column intact.

  **`_raw_log` MUST carry a CURRENT date.** The parsing rule sets `_time` from that
  timestamp. A fixed example date stamps every event in the past, where normal query
  windows will not find it -- the failure looks like "nothing landed" and is not.

  **Fields the modeling rule reads.** Flat columns: `questionName`, `questionType` (`A`,
  `AAAA`, `TXT` ... uppercase), `responseCode` (`NOERROR`, `NXDOMAIN` ...), `protocol`
  (`UDP`/`TCP`/`ICMP` -- UPPERCASE, the rule matches on case), `sourceIp`, `sourcePort`,
  `dstPort`. Metadata: `provider_name`, `channel`, `record_id`, `event_id`, `log_level`,
  `event_action`, `task`, `computer_name`, `host_name`, `message`, `process_pid`,
  `process_thread_id`. Composites (JSON objects on the wire): `event_data` with leaves
  `type` (NUMERIC record type as a string, `1` = A), `NAME`, `Source`, `Zone`,
  `BufferSize`, `PropertyKey`, `NewValue`; and `user` with `name`, `domain`, `identifier`,
  `type`.

  `_raw_log` also feeds the answer section: the rule extracts between literal
  `ANSWER SECTION:` and `AUTHORITY SECTION:` markers with `[^:]+`, so NO colons may appear
  between them.

  **KNOWN GAP -- modeling rule may not be bound on a tenant.** Events land correctly and
  every column is present, but `datamodel dataset = microsoft_dns_raw` returns 0 rows,
  while the sibling AMSI, ADFS and Windows Events datasets all return rows. That is the
  signature of the Microsoft DNS content pack not being installed. Until an operator
  installs it, this source produces raw rows and no `xdm.*`. Nothing in this schema can
  change that.

  **How simulation works — read this before generating.** `phantom_create_data_worker`
  resolves each field's value in this order:

    1. `observables_dict[field]` — explicit; always wins. Values are LISTS.
    2. `is_gate` + `example` — gate fields are auto-pinned to their example.
    3. declared `type` — ipv4/user/url/datetime are synthesized plausibly.
    4. field-name heuristic.
    5. random token.

  **A field's `example` below is DOCUMENTATION ONLY unless that field is marked
  `is_gate`.** So every field the modeling rule reads expecting a specific SHAPE --
  an enum, an HTTP method, a status code, a resource path, a numeric type code, an
  XML or JSON blob -- MUST be passed in `observables_dict`, with keys spelled
  exactly as `fields[]` spells them (dotted leaves included, e.g.
  `event_data.param2`). Anything you leave out is randomly generated, and the rule
  will map it to garbage or drop the event.