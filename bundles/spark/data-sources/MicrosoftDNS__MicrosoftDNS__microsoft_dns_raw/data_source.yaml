fields:
- name: _raw_log
  type: string
  description: 'Native microsoft_dns log line as the vendor emits it (no syslog frame -- the RAW sender prepends one). Branch: DNS debug-log response packet. Column padding is load-bearing: the rule indexes the 8th capture of (\s|R)\s, which only exists with the vendor''s real space runs.'
  example: '{{now:%-m/%-d/%Y %-I:%M:%S %p}} 0AE4 PACKET  000001F0A4F0AC50 UDP Rcv 10.20.30.40    00a2   R Q [8081   DR  NOERROR] A      (3)www(7)example(3)com(0) ANSWER SECTION: TYPE A CLASS IN TTL 3600 DATA 93.184.216.34 AUTHORITY SECTION: TYPE NS'
- name: channel
  type: string
  description: Vendor-emitted field 'Channel'. Free-form text; may contain whitespace
    and punctuation.
  example: 'DNS Server'
- name: computer_name
  type: string
  description: Human-readable name as displayed by Microsoft. Free-form text; may
    contain whitespace and punctuation.
  example: 'dc01.acme.local'
- name: dstPort
  type: integer_port
  description: Destination TCP/UDP port. Signed decimal integer; bare digits, optional
    leading minus.
  example: '53'
- name: event_action
  type: string_short
  description: Action taken by Microsoft's enforcement engine (allow/block/quarantine/etc.).
    Short opaque token, typically without whitespace; max ~64 chars.
  example: 'Query'
- name: event_data
  type: json
  description: '— see leaf entries for nested paths. JSON object with keys: BufferSize,
    NAME, NewValue, PropertyKey, Source, Zone, type (each key defined as a dotted-path
    leaf below).'
  example: '{}'
- name: event_id
  type: integer
  description: Unique identifier for this event as assigned by the vendor. Signed
    decimal integer; bare digits, optional leading minus.
  example: '257'
- name: host_name
  type: string
  description: Human-readable name as displayed by Microsoft. Free-form text; may
    contain whitespace and punctuation.
  example: 'dc01.acme.local'
- name: log_level
  type: string_short
  description: Severity level (string label, e.g., info/warn/error). Short opaque
    token, typically without whitespace; max ~64 chars.
  example: 'Information'
- name: message
  type: string
  description: Human-readable event message. Free-form text; may contain whitespace
    and punctuation.
  example: 'DNS query resolved'
- name: opcode
  type: string
  description: Vendor-emitted field 'Opcode'. Free-form text; may contain whitespace
    and punctuation.
  example: 'Info'
- name: process_pid
  type: integer
  description: Vendor-emitted field 'Process pid'. Signed decimal integer; bare digits,
    optional leading minus.
  example: '1820'
- name: process_thread_id
  type: integer
  description: Opaque identifier emitted by Microsoft. Short opaque token, typically
    without whitespace; max ~64 chars.
  example: '4128'
- name: protocol
  type: string
  description: Network protocol name or numeric IANA assignment. Free-form text; may
    contain whitespace and punctuation.
  example: 'UDP'
- name: provider_name
  type: string
  description: Human-readable name as displayed by Microsoft. Free-form text; may
    contain whitespace and punctuation.
  example: 'Microsoft-Windows-DNSServer'
- name: questionName
  type: string
  description: Vendor-emitted field 'QuestionName'. Free-form text; may contain whitespace
    and punctuation.
  example: 'www.example.com'
- name: questionType
  type: string
  description: Vendor-emitted field 'QuestionType'. Free-form text; may contain whitespace
    and punctuation.
  example: 'A'
- name: record_id
  type: integer
  description: Opaque identifier emitted by Microsoft. Short opaque token, typically
    without whitespace; max ~64 chars.
  example: '91001'
- name: responseCode
  type: string
  description: Vendor-emitted field 'ResponseCode'. Free-form text; may contain whitespace
    and punctuation.
  example: 'NOERROR'
- name: sourceIp
  type: ipv4
  description: Source address of the connection initiator. Free-form text; may contain
    whitespace and punctuation.
  example: '10.20.30.40'
- name: sourcePort
  type: integer_port
  description: Source TCP/UDP port. Signed decimal integer; bare digits, optional
    leading minus.
  example: '53535'
- name: task
  type: string
  description: Vendor-emitted field 'Task'. Free-form text; may contain whitespace
    and punctuation.
  example: 'Query'
- name: user
  type: json
  description: '— see leaf entries for nested paths. JSON object with keys: domain,
    identifier, name, type (each key defined as a dotted-path leaf below).'
  example: '{}'
- name: event_data.BufferSize
  type: integer_byte_count
  description: Vendor-emitted field 'Event data › BufferSize'. Leaf of the 'event_data'
    composite. Free-form text; may contain whitespace and punctuation.
  example: '512'
- name: event_data.NAME
  type: string
  description: Human-readable name as displayed by Microsoft. Free-form text; may
    contain whitespace and punctuation.
  example: 'www.example.com'
- name: event_data.NewValue
  type: string
  description: Vendor-emitted field 'Event data › NewValue'. Leaf of the 'event_data'
    composite. Free-form text; may contain whitespace and punctuation.
  example: 'Primary'
- name: event_data.PropertyKey
  type: string
  description: Vendor-emitted field 'Event data › PropertyKey'. Leaf of the 'event_data'
    composite. Free-form text; may contain whitespace and punctuation.
  example: 'ZoneType'
- name: event_data.Source
  type: ipv4
  description: Vendor-emitted field 'Event data › Source'. Leaf of the 'event_data'
    composite. Free-form text; may contain whitespace and punctuation.
  example: '10.20.30.40'
- name: event_data.Zone
  type: string
  description: Vendor-emitted field 'Event data › Zone'. Leaf of the 'event_data'
    composite. Free-form text; may contain whitespace and punctuation.
  example: 'example.com'
- name: event_data.type
  type: integer
  description: Type/category classifier emitted by Microsoft. Short opaque token,
    typically without whitespace; max ~64 chars.
  example: '1'
- name: user.domain
  type: domain
  description: DNS domain reported by Microsoft — bare domain, no scheme/path/port.
    Bare DNS domain name; no scheme, no path, no port.
  example: 'Acme'
- name: user.identifier
  type: string
  description: Vendor-emitted field 'User › identifier'. Leaf of the 'user' composite.
    Free-form text; may contain whitespace and punctuation.
  example: 'S-1-5-21-77'
- name: user.name
  type: user
  description: Human-readable name as displayed by Microsoft. Account name as the
    vendor reports it — login name, UPN, or sAMAccountName; no domain prefix unless
    vendor emits one.
  example: 'dnsadmin'
- name: user.type
  type: string_short
  description: Type/category classifier emitted by Microsoft. Short opaque token,
    typically without whitespace; max ~64 chars.
  example: 'User'
