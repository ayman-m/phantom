how_to_use: |
  ## Azure App Service -> Cortex XSIAM (dataset `msft_azure_app_service_raw`)

  Required CEF header for XSIAM:
  - vendor: `msft`
  - product: `azure`

  **Routing.** Several Azure packs share `msft`/`azure` and are separated by the `category`
  field inside their INGEST filter. App Service claims
  `AppServiceHTTPLogs`, `AppServiceConsoleLogs`, `AppServiceAppLogs`,
  `AppServiceIPSecAuditLogs`, `AppServicePlatformLogs`, `AppServiceAntivirusScanAuditLogs`,
  `AppServiceFileAuditLogs`, `FunctionAppLogs`, `AppServiceAuditLogs`, `WorkflowRuntime`,
  `AppServiceEnvironmentPlatformLogs`.

  **`category` is the hard gate and the rule is `no_hit=drop`.** Any other value and the
  event is DISCARDED at ingest -- no raw row, no error, nothing to diagnose. This schema
  shipped `category: access_control`, so every generated event was silently thrown away.

  **`_time` comes from `time` or `TimeGenerated`**, in that order. At least one must be
  present and parseable or the event has no usable timestamp.

  **`properties` is coalesced BEFORE the flat columns.** The rule reads
  `coalesce(properties -> ScStatus, to_string(ScStatus))`, so a wrong value inside
  `properties` OVERRIDES a correct flat column. This schema shipped 27 `properties.*`
  leaves typed `integer_port` with the example `443` -- `properties.CsMethod = 443`,
  `properties.ScStatus = 443` -- which would have actively broken the mapping rather than
  merely failing to help it. Keep `properties.*` correct or omit it.

  **Fields the HTTP-logs branch reads**: `category`, `TimeGenerated`, `resourceId` (or
  `_ResourceId`; the rule splits it on `/` for subscription id, resource name and type, so
  send a real ARM path), `location`, `CIp`, `CsHost`, `CsMethod`, `ScStatus`, `Result`
  (`Success`/`Failure`), `TimeTaken`, `ComputerName`, `Referer`, `userAgent`, `CsUsername`,
  `CsBytes`, `ScBytes`, `SPort`.

  **KNOWN GAP -- modeling rule not bound when the content pack is missing.** With the fixes above events
  land in the dataset, but `datamodel dataset = msft_azure_app_service_raw` returns 0 rows
  while the sibling Azure DevOps dataset returns rows. That is the signature of the Azure
  App Service content pack not being installed. Until an operator installs it, this source
  produces raw rows and no `xdm.*`.

  **Simulation recipe — reverse-engineered from this pack's parsing + modeling rules.**

  Routing: vendor `MSFT` / product `Azure`.
  Discriminator: category = "AppServiceHTTPLogs" (any of the 11 App Service categories selects this dataset)
  (Taken VERBATIM from the pack's parsing rule, line 1: [INGEST:vendor="MSFT", product="Azure", target_dataset="msft_azure_app_service_raw", no_hit = drop]. Not derived — the derived name for MSFT/Azure would be msft_azure_raw (which is MicrosoftEntraID's dataset), so the explicit target_dataset is load-bearing. Case is irrelevant on the wire: the broker lowercases before matching, and the sibling Azure packs spell the same pair lowercase (vendor="msft", product="azure"). The schema's how_to_use documents the lowercase form `msft`/`azure`, which is the form already proven to land (raw_validated: true).)

  Gate: `category` must be one of `AppServiceHTTPLogs`, `AppServiceConsoleLogs`, `AppServiceAppLogs`, `AppServiceIPSecAuditLogs`, `AppServicePlatformLogs`, `AppServiceAntivirusScanAuditLogs`, `AppServiceFileAuditLogs`, `FunctionAppLogs`, `AppServiceAuditLogs`, `WorkflowRuntime`, `AppServiceEnvironmentPlatformLogs`.
  no_hit: drop

  Composite: `properties` must be a JSON OBJECT on the wire. Leaves read: `properties.CIp`, `properties.CsHost`, `properties.CsMethod`, `properties.ScStatus`, `properties.Result`, `properties.TimeTaken`, `properties.ComputerName`, `properties.Referer`, `properties.UserAgent`, `properties.CsUsername`, `properties.CsBytes`, `properties.ScBytes`

  Pass this verbatim as `observables_dict` (keys are schema field names; values are LISTS):

  ```json
