- id: 9d7b5a3c-4e1f-4b62-a9c1-8f3e7d2b5a6e
  name: "Phantom: Master Killchain (curated)"
  description: >
    Phantom's flagship adversary: the most comprehensive attack chain in the
    battery. Combines the 20-step phishing → ransomware kill chain with two
    additional steps:

      1. Phantom decoy-files pre-condition (T1607) at chain start, so the
         Ransack-style staging half of the chain works on a clean lab without
         operator manual setup (the curated Ransack/Super Spy/Thief variants
         use the same pre-condition).

      2. PowerKatz (stockpile T1003 Run PowerKatz, ability baac2c6d) added
         mid-chain. Cortex's "PowerShell runs with known Mimikatz arguments"
         signature fires reliably on this; together with the LSASS minidump
         (T1003.001 comsvcs.dll rundll32) the chain produces 2 distinct
         Cortex credential-access detection signals per run.

    Expected Cortex XDR detections span 7 of the 12 MITRE enterprise tactics:

      TA0002 Execution           (Script Engine Activity, PSh Activity)
      TA0003 Persistence         (T1574.002 DLL Side-Loading, T1197 BITS Jobs)
      TA0004 Privilege Escalation (Akagi64 Fodhelper UAC bypass WildFire)
      TA0005 Defense Evasion     (T1140 Decode, T1132 Data Encoding)
      TA0006 Credential Access   (T1003, T1003.001, T1003.004, T1555 — Mimikatz
                                  args + Credential Gathering Protection x2)
      TA0008 Lateral Movement    (T1550 — real SMB+WMI+WinRM cross-host)
      TA0011 Command and Control (Sandcat HTTP beacon + T1197 BITS)

    The chain is reproducible across the 2-host lab: each host raises alerts
    when it is the victim or the attacker.

    Cortex-detected Caldera abilities in this chain (ranked by alert volume):
      - PSh-encoded ability execution (Script Engine + PSh Activity)
      - Sandcat venus.exe beacon (WildFire + Local Analysis + BITS)
      - Akagi64 Fodhelper UAC bypass (WildFire Malware alerts on Akagi64.exe)
      - PowerKatz Mimikatz args (Credential Gathering Protection alerts)

    Use this adversary when you want ONE operation that exercises a broad,
    Cortex-detected attack chain across multiple tactics. For focused testing
    (just ransomware-staging, just lateral movement, etc.), use the other
    curated adversaries in this directory.

    Phantom-bundled: ships in the caldera image.
    Requires the two bootstrap abilities (00-bootstrap/) to be run once first
    (bootstrap-win-host-02-victim on group=victim host, bootstrap-win-host-01-attacker
    on group=red host) before this adversary executes, the same as for the
    phishing chain.

