name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: Agent (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/agent/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  python:
    name: Python tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [mcp, xlog, updater]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install and test
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          case "$SUITE" in
            mcp)     cd bundles/spark/mcp && pip install -r requirements.txt pytest pytest-asyncio && PYTHONPATH=$PWD/src python -m pytest tests/ -x -q ;;
            xlog)    cd xlog && pip install -r requirements.txt pytest pytest-asyncio && python -m pytest -x -q ;;
            updater) cd updater && pip install -r requirements.txt pytest pytest-asyncio && PYTHONPATH=$PWD/src python -m pytest -x -q ;;
          esac

  validate:
    name: Bundle validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema 'mcp[cli]<2'
      - run: python tooling/validate/validate_all.py
